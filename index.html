*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;position:fixed;overscroll-behavior:none;-webkit-overflow-scrolling:none;-webkit-text-size-adjust:100%;}
canvas#c{position:fixed;top:0;left:0;z-index:0;display:block;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}

/* ── THEME VARS ── */
:root{
  --bg:rgba(3,8,18,0.93);--border:rgba(60,120,180,0.5);
  --text:#7ab8d8;--text-bright:#a8d4f0;--accent:#3a8abf;
  --accent2:rgba(58,138,191,0.25);--tab-bg:rgba(6,14,28,0.97);
}

/* ── UI ROOT ── */
#ui-root{position:fixed;inset:0;pointer-events:none;z-index:10}
#snap-overlay{position:fixed;inset:0;pointer-events:none;z-index:55}
#tab-ghost{position:fixed;display:none;pointer-events:none;z-index:60;
  background:var(--bg);border:1px solid var(--accent);color:var(--text-bright);
  padding:3px 12px;font-size:10px;letter-spacing:.06em;border-radius:2px;
  box-shadow:0 0 12px rgba(58,138,191,0.4)}
.snap-glow{position:fixed;background:rgba(80,180,255,0.75);
  box-shadow:0 0 14px rgba(80,180,255,1);pointer-events:none;
  animation:spulse .35s ease infinite alternate}
@keyframes spulse{from{opacity:.45}to{opacity:1}}

/* ── PANEL ── */
.ui-panel{position:absolute;pointer-events:all;display:flex;flex-direction:column;
  min-width:150px;min-height:90px;background:var(--bg);border:1px solid var(--border);
  box-shadow:0 4px 24px rgba(0,0,0,0.6)}

/* ── TABBAR ── */
.ui-tabbar{display:flex;flex-shrink:0;height:26px;background:var(--tab-bg);
  border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;cursor:grab;user-select:none;align-items:stretch}
.ui-tabbar::-webkit-scrollbar{display:none}
.ui-tab{display:flex;align-items:center;padding:0 11px;font-size:9px;letter-spacing:.07em;
  color:var(--text);cursor:pointer;white-space:nowrap;flex-shrink:0;
  border-right:1px solid rgba(40,80,120,0.25);transition:background .12s,color .12s}
.ui-tab:hover{background:rgba(30,70,120,0.45);color:var(--text-bright)}
.ui-tab.active{background:rgba(18,50,95,0.9);color:var(--text-bright);
  border-bottom:2px solid var(--accent);margin-bottom:-1px}

/* ── CONTENT WRAP ── */
.ui-cwrap{flex:1;position:relative;overflow:hidden}
.ui-content{position:absolute;inset:0;overflow:auto;padding:8px;
  color:var(--text);font-size:10px;display:flex;flex-direction:column;gap:0;
  scrollbar-width:thin;scrollbar-color:rgba(60,120,180,0.3) transparent}
.ui-content::-webkit-scrollbar{width:4px}
.ui-content::-webkit-scrollbar-thumb{background:rgba(60,120,180,0.3);border-radius:2px}

/* ── RESIZE HANDLES ── */
.ui-rz{position:absolute;z-index:5}
.ui-rz-e{right:-4px;top:6px;bottom:6px;width:8px;cursor:ew-resize}
.ui-rz-w{left:-4px;top:6px;bottom:6px;width:8px;cursor:ew-resize}
.ui-rz-s{bottom:-4px;left:6px;right:6px;height:8px;cursor:ns-resize}
.ui-rz-n{top:-4px;left:6px;right:6px;height:8px;cursor:ns-resize}
.ui-rz-se{right:-5px;bottom:-5px;width:14px;height:14px;cursor:se-resize}
.ui-rz-sw{left:-5px;bottom:-5px;width:14px;height:14px;cursor:sw-resize}
.ui-rz-ne{right:-5px;top:-5px;width:14px;height:14px;cursor:ne-resize}
.ui-rz-nw{left:-5px;top:-5px;width:14px;height:14px;cursor:nw-resize}
.ui-rz-se::after{content:'';position:absolute;right:3px;bottom:3px;
  width:7px;height:7px;border-right:2px solid var(--border);border-bottom:2px solid var(--border);opacity:.7}

/* ── STATS ── */
.t-section{font-size:8px;letter-spacing:.1em;color:var(--accent);
  padding:5px 0 3px;text-transform:uppercase;border-bottom:1px solid rgba(40,80,120,0.2);margin-bottom:2px}
.t-row{display:flex;justify-content:space-between;align-items:center;
  padding:1.5px 0;border-bottom:1px solid rgba(20,50,80,0.15);min-height:16px}
.t-lbl{color:var(--text);opacity:.7;font-size:9px}
.t-val{color:var(--text-bright);font-size:9px;font-weight:bold;text-align:right}
.role-row{display:flex;flex-wrap:wrap;gap:3px;padding:3px 0}
.rb{font-size:8px;padding:1px 5px;border-radius:8px;border:1px solid currentColor;letter-spacing:.04em}

/* ── TRAIT BARS ─ three layouts ── */
/* Wide: label + bar + value in a row */
.traits-wide{display:flex;flex-direction:column;gap:2px;padding:2px 0}
.tr-wide{display:flex;align-items:center;gap:5px}
.tr-lbl{font-size:9px;color:var(--text);opacity:.65;flex-shrink:0;width:50px;overflow:hidden}
.tr-track{flex:1;height:5px;background:rgba(20,50,80,0.5);border-radius:3px;overflow:hidden}
.tr-fill{height:100%;border-radius:3px;transition:width .4s}
.tr-num{width:28px;font-size:9px;color:var(--text-bright);text-align:right;flex-shrink:0}

/* Grid: 2-col */
.traits-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;align-content:start}
.tr-cell{display:flex;flex-direction:column;gap:2px;padding:2px 3px}
.tr-cell .tr-lbl{width:auto;font-size:8px}
.tr-cell .tr-track{height:4px}
.tr-cell .tr-num{font-size:8px;width:auto}
.tr-cell-top{display:flex;justify-content:space-between}

/* Ribbon: vertical sticks */
.traits-ribbon{display:flex;gap:3px;height:calc(100% - 4px);align-items:flex-end;overflow-x:auto;padding:4px 2px}
.traits-ribbon::-webkit-scrollbar{height:3px}
.traits-ribbon::-webkit-scrollbar-thumb{background:rgba(60,120,180,0.3)}
.tr-stick{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:18px;height:100%}
.tr-stick-lbl{font-size:7px;color:var(--text);opacity:.6;writing-mode:vertical-lr;
  transform:rotate(180deg);flex-shrink:0;height:30px;overflow:hidden;text-align:center}
.tr-stick-track{flex:1;width:10px;background:rgba(20,50,80,0.5);border-radius:3px;
  position:relative;overflow:hidden;min-height:20px}
.tr-stick-fill{position:absolute;bottom:0;left:0;right:0;border-radius:3px;
  transition:height .4s}

/* ── TICKER TAPE (events tab) ── */
.ticker-wrap{height:100%;display:flex;flex-direction:column;gap:4px}
.ticker-controls{display:flex;gap:4px;align-items:center;flex-shrink:0}
.tk-btn{background:rgba(10,30,60,0.8);border:1px solid var(--border);color:var(--text);
  cursor:pointer;padding:2px 8px;font-family:inherit;font-size:9px}
.tk-btn:hover{color:var(--text-bright);background:rgba(20,55,100,0.8)}
.ticker-stage{flex:1;background:rgba(2,5,12,0.8);border:1px solid rgba(30,60,100,0.3);
  position:relative;overflow:hidden;border-radius:2px}
#ticker-cnv{display:block;width:100%;height:100%}

/* ── THEME CONTROLS ── */
.th-section{font-size:8px;letter-spacing:.1em;color:var(--accent);
  padding:5px 0 3px;text-transform:uppercase}
.th-row{display:flex;align-items:center;gap:6px;margin:3px 0}
.th-lbl{width:72px;font-size:9px;color:var(--text);opacity:.65;flex-shrink:0}
.th-row input[type=range]{flex:1;height:3px;accent-color:var(--accent);cursor:pointer}
.th-row .th-val{width:34px;font-size:9px;color:var(--text-bright);text-align:right;flex-shrink:0}
.th-row input[type=color]{width:34px;height:18px;border:1px solid var(--border);
  background:none;cursor:pointer;padding:1px;border-radius:2px}

/* ── CONTROLS TAB ── */
.ctl-btn{display:block;width:100%;padding:5px 8px;margin:2px 0;text-align:left;
  background:rgba(10,30,60,0.8);border:1px solid var(--border);color:var(--text);
  cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:.05em}
.ctl-btn:hover{background:rgba(20,55,100,0.9);color:var(--text-bright)}
.ctl-btn.active{background:rgba(20,55,100,0.9);color:var(--text-bright);border-color:var(--accent)}
.ctl-speed{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}
.spd-btn{padding:2px 8px;background:rgba(10,30,60,0.8);border:1px solid var(--border);
  color:var(--text);cursor:pointer;font-family:inherit;font-size:9px}
.spd-btn.on{background:rgba(20,55,100,0.9);color:var(--text-bright);border-color:var(--accent)}
.tf-grid{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}
.tft{padding:3px 7px;background:rgba(10,30,60,0.8);border:1px solid var(--border);
  color:var(--text);cursor:pointer;font-size:9px;font-family:inherit}
.tft.on{background:rgba(20,55,100,0.9);color:var(--text-bright);border-color:var(--accent)}

/* ── ADMIN TAB ── */
.adm-section{font-size:8px;letter-spacing:.1em;color:var(--accent);padding:5px 0 3px;text-transform:uppercase}
.adm-row{display:flex;align-items:center;gap:6px;margin:3px 0}
.adm-lbl{width:72px;font-size:9px;color:var(--text);opacity:.65;flex-shrink:0}
.adm-row input[type=range]{flex:1;height:3px;accent-color:var(--accent);cursor:pointer}
.adm-val{width:34px;font-size:9px;color:var(--text-bright);text-align:right;flex-shrink:0}

/* ── CANVAS TABS ── */
.canvas-tab{padding:0 !important}
#chart,#minimap{display:block;width:100%;height:100%}

/* ── PERSISTENT TICKER (sim events) ── */
#sim-ticker{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
  color:var(--text-bright);font-size:11px;letter-spacing:.1em;pointer-events:none;
  z-index:25;transition:opacity 1.4s;text-shadow:0 0 8px rgba(0,0,0,.9);
  background:rgba(3,7,16,.7);padding:6px 18px;max-width:60vw;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── INSPECT ── */
#insp-wrap{margin-top:4px}
.ey{font-size:9px;letter-spacing:.08em;color:var(--accent);margin-bottom:3px}
.sep{font-size:8px;letter-spacing:.1em;color:var(--accent);
  border-top:1px solid rgba(40,80,120,0.3);padding:4px 0 2px;margin-top:3px}
.div-{border-top:1px solid rgba(30,60,100,0.2);margin-top:4px;padding-top:4px}
.lb{color:var(--text);opacity:.7;font-size:9px}
.vl{color:var(--text-bright);font-size:9px;font-weight:bold}
.row{display:flex;justify-content:space-between;padding:1.5px 0}
#steps-badge{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.step-pill{font-size:8px;padding:1px 5px;border-radius:8px;background:rgba(20,50,90,0.6);
  border:1px solid rgba(60,120,180,0.4);color:var(--text-bright)}


/* ══════════════════════════════
   MOBILE LAYOUT
   ══════════════════════════════ */
#mobile-bar{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(3,8,20,0.97);border-top:1px solid var(--border);
  padding:6px 8px;
  padding-bottom:calc(6px + env(safe-area-inset-bottom, 0px));
  padding-left:calc(8px + env(safe-area-inset-left, 0px));

}

  transform:translateY(100%);transition:transform .28s cubic-bezier(.22,.68,0,1.2);
  max-height:72vh;display:flex;flex-direction:column;pointer-events:all;
}
#mobile-drawer.open{transform:translateY(0);}
#mobile-drawer-handle{
  display:flex;justify-content:center;padding:8px 0 4px;flex-shrink:0;cursor:pointer;
}
#mobile-drawer-handle::before{
  content:'';width:36px;height:4px;background:rgba(100,160,200,0.45);border-radius:2px;
}
#mobile-tab-bar{
  display:flex;border-bottom:1px solid var(--border);flex-shrink:0;
}
.m-tab{
  flex:1;padding:8px 4px 6px;text-align:center;font-size:9px;letter-spacing:.06em;
  color:var(--text);cursor:pointer;transition:color .12s;border:none;
  background:none;font-family:inherit;
}
.m-tab.active{color:var(--text-bright);border-bottom:2px solid var(--accent);}
#mobile-tab-content{
  flex:1;overflow-y:auto;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:10px;color:var(--text);
  -webkit-overflow-scrolling:touch;
}
.m-btn{
  background:rgba(10,30,60,.85);border:1px solid var(--border);color:var(--text);
  cursor:pointer;padding:7px 11px;font-family:inherit;font-size:11px;
  border-radius:3px;flex-shrink:0;touch-action:manipulation;
}
.m-btn:active{background:rgba(20,55,100,.9);color:var(--text-bright);}
.m-btn.on{background:rgba(20,55,100,.9);color:var(--text-bright);border-color:var(--accent);}
.m-spd{padding:7px 9px;font-size:10px;}
.m-fab{
  position:fixed;bottom:calc(72px + env(safe-area-inset-bottom,0px));right:calc(14px + env(safe-area-inset-right,0px));z-index:45;
  width:44px;height:44px;border-radius:50%;
  background:rgba(20,55,100,.9);border:1px solid var(--accent);
  color:var(--text-bright);font-size:18px;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  box-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:all;touch-action:manipulation;
}
.m-row{display:flex;justify-content:space-between;align-items:center;
  padding:3px 0;border-bottom:1px solid rgba(20,50,80,.15);min-height:24px;}
.m-lb{color:var(--text);opacity:.7;font-size:10px;}
.m-vl{color:var(--text-bright);font-size:10px;font-weight:bold;text-align:right;}
.m-section{font-size:9px;letter-spacing:.1em;color:var(--accent);padding:7px 0 3px;
  text-transform:uppercase;border-bottom:1px solid rgba(40,80,120,.2);}
.m-bar-track{height:6px;background:rgba(20,50,80,.5);border-radius:3px;
  overflow:hidden;margin:4px 0 6px;}
.m-bar-fill{height:100%;border-radius:3px;transition:width .4s;}
/* On mobile: hide desktop elements */
@media (max-width:900px),(pointer:coarse){
  #ptoolbar{display:none!important;}
  .ui-panel{display:none!important;}
  #mobile-bar{display:flex!important;}
  .m-fab{display:flex!important;}
}

</style>

<body>
<canvas id="c" oncontextmenu="return false"></canvas>
<div id="ui-root"></div>

<!-- ── MOBILE UI ── -->
<div id="mobile-bar">
  <button class="m-btn" onclick="init(false)" title="Reset life">↺</button>
  <button class="m-btn" id="mb-prim" onclick="init(true)" title="Primordial">⌁</button>
  <button class="m-btn" id="mb-pause" onclick="paused=!paused;this.textContent=paused?'▶':'⏸'" title="Pause">⏸</button>
  <button class="m-btn" id="mb-tf" onclick="toggleTerraform();this.classList.toggle('on',terraformMode)" title="Terraform">⛏</button>
  <button class="m-btn" onclick="fitWorld()" title="Fit">⊡</button>
  <span style="display:flex;gap:3px;margin-left:auto">
    <button class="m-btn m-spd on" id="mspd1" onclick="setSpeed(1)">1×</button>
    <button class="m-btn m-spd" id="mspd2" onclick="setSpeed(2)">2×</button>
    <button class="m-btn m-spd" id="mspd4" onclick="setSpeed(4)">4×</button>
    <button class="m-btn m-spd" id="mspd8" onclick="setSpeed(8)">8×</button>
  </span>
</div>

<div id="mobile-drawer">
  <div id="mobile-drawer-handle" onclick="closeMobileDrawer()"></div>
  <div id="mobile-tab-bar">
    <button class="m-tab active" data-tab="pop" onclick="switchMobileTab('pop')">👥 Pop</button>
    <button class="m-tab" data-tab="traits" onclick="switchMobileTab('traits')">🧬 Traits</button>
    <button class="m-tab" data-tab="map" onclick="switchMobileTab('map')">🗺️ Map</button>

<div id="ptoolbar-tab" onclick="toggleToolbar()" style="position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:32px;height:8px;z-index:31;cursor:pointer;pointer-events:all;
  background:rgba(60,120,180,0.45);border-radius:0 0 4px 4px;
  display:flex;align-items:center;justify-content:center">
  <span id="ptoolbar-arrow" style="font-size:7px;color:rgba(120,180,220,0.8);line-height:1">▲</span>
</div>
<div id="ptoolbar" style="position:fixed;top:8px;left:50%;transform:translateX(-50%);
  display:flex;gap:3px;padding:4px 10px;z-index:30;pointer-events:all;
  background:rgba(3,8,20,0.92);border:1px solid rgba(60,120,180,0.5);border-radius:3px;
  transition:opacity .18s,transform .18s">
  <button onclick="init(false)" style="background:rgba(10,30,60,.8);border:1px solid rgba(60,120,180,.5);color:#7ab8d8;cursor:pointer;padding:3px 9px;font-family:inherit;font-size:10px">↺ Reset</button>
  <button onclick="init(true)" style="background:rgba(10,30,60,.8);border:1px solid rgba(60,120,180,.5);color:#7ab8d8;cursor:pointer;padding:3px 9px;font-family:inherit;font-size:10px">⌁ Prim</button>
  <button onclick="paused=!paused;this.textContent=paused?'▶':'⏸'" style="background:rgba(10,30,60,.8);border:1px solid rgba(60,120,180,.5);color:#7ab8d8;cursor:pointer;padding:3px 9px;font-family:inherit;font-size:10px">⏸</button>
  <button onclick="toggleTerraform()" id="b-tf" style="background:rgba(10,30,60,.8);border:1px solid rgba(60,120,180,.5);color:#7ab8d8;cursor:pointer;padding:3px 9px;font-family:inherit;font-size:10px">⛏</button>
  <button onclick="fitWorld()" style="background:rgba(10,30,60,.8);border:1px solid rgba(60,120,180,.5);color:#7ab8d8;cursor:pointer;padding:3px 9px;font-family:inherit;font-size:10px">⊡</button>
  <span style="display:flex;gap:2px;align-items:center">
    <span style="font-size:9px;color:#7ab8d8">Speed</span>
    ${[1,2,4,8].map ? '' : ''}
    <button onclick="setSpeed(1)" style="background:rgba(20,55,100,.9);border:1px solid #3a8abf;color:#a8d4f0;cursor:pointer;padding:3px 7px;font-family:inherit;font-size:9px">1×</button>
    <button onclick="setSpeed(2)" style="background:rgba(10,30,60,.8);border:1px solid rgba(60,120,180,.5);color:#7ab8d8;cursor:pointer;padding:3px 7px;font-family:inherit;font-size:9px">2×</button>
    <button onclick="setSpeed(4)" style="background:rgba(10,30,60,.8);border:1px solid rgba(60,120,180,.5);color:#7ab8d8;cursor:pointer;padding:3px 7px;font-family:inherit;font-size:9px">4×</button>
    <button onclick="setSpeed(8)" style="background:rgba(10,30,60,.8);border:1px solid rgba(60,120,180,.5);color:#7ab8d8;cursor:pointer;padding:3px 7px;font-family:inherit;font-size:9px">8×</button>
  </span>
</div>
<script>

// ═══════════════════════════════════════════════════════════
// ── Early declarations needed by showTicker ──────────
const tickerEvents=[];
function pushTickerEvent(msg){
  const cols={'↯':'#4adada','◈':'#ffa040','⟡':'#80c880','×':'#cc6060'};
  tickerEvents.push({text:msg,color:cols[msg[0]]||'#a8d4f0'});
  if(tickerEvents.length>80)tickerEvents.shift();
}
// ─────────────────────────────────────────────────────

// WORLD
// ═══════════════════════════════════════════════════════════
const WW=7680,WH=4320;
const CELL=120,MAX_ORG=380,MAX_FOOD=1200,FOOD_E=44,INIT_POP=35,FOOD_RATE=0.85,MAX_GRASS=120,GRID_STEP=100;
const CHART_LEN=250,HUD_N=8;

// ═══════════════════════════════════════════════════════════
// BIOME SYSTEM — active world zone grows with milestones
// ═══════════════════════════════════════════════════════════
const BIOME_STAGES=[
  {key:'petri', name:'Petri Dish',  w:1440, h:900,  maxOrg:80,  maxFood:500,
   grass:false,vents:false,current:false,depth:false,
   milestones:['First sexual reproduction + pop 30+ sustained','...or first predator emerges']},
  {key:'bowl',  name:'Bowl',        w:2880, h:1620, maxOrg:150, maxFood:450,
   grass:true, vents:false,current:false,depth:false,
   milestones:['First commune forms','10 evolutionary steps discovered']},
  {key:'tank',  name:'Tank',        w:4320, h:2430, maxOrg:240, maxFood:700,
   grass:true, vents:true, current:false,depth:true,
   milestones:['First predator','First herbivore','Population sustains 100+ for 2000 ticks']},
  {key:'pond',  name:'Pond',        w:5760, h:3240, maxOrg:300, maxFood:900,
   grass:true, vents:true, current:true, depth:true,
   milestones:['First whale fall','First deep adapted organism']},
  {key:'lake',  name:'Lake',        w:7680, h:3240, maxOrg:340, maxFood:1100,
   grass:true, vents:true, current:true, depth:true,
   milestones:['Full trophic stack','First mangrove']},
  {key:'sea',   name:'Sea',         w:7680, h:4320, maxOrg:380, maxFood:1200,
   grass:true, vents:true, current:true, depth:true,
   milestones:[]},
];
// Each biome stage declares its own maxOrg (Petri:80 ... Sea:380) but nothing
// ever read it — every population cap in the sim (division gating,
// specialist spawning) used the flat MAX_ORG=380 constant instead. That let
// population pack all the way up to the Sea-biome cap while still confined
// to the tiny 1440x900 Petri dish — 5x the crowding the biome was actually
// designed for, which starves the (correctly small) Petri food budget and
// explains a lot of the chaos/crowding/starvation seen early on.
function curMaxOrg(){return BIOME_STAGES[biomeIdx].maxOrg;}
let biomeIdx=0;
let activeW=BIOME_STAGES[0].w, activeH=BIOME_STAGES[0].h;
let biomeMilestones={sexualRepro:false,pop30ticks:0,communeFormed:false,predatorEverEmerged:false,
  stepsDiscovered:new Set(),predatorFound:false,herbivoreFound:false,
  pop100ticks:0,whaleFall:false,deepAdapted:false,fullStack:false,mangrove:false};
let biomeExpanding=false,biomeExpandT=0;
let biomeExpandFromW=activeW,biomeExpandFromH=activeH;
let biomeExpandToW=activeW,biomeExpandToH=activeH;

// ═══════════════════════════════════════════════════════════
// ADMIN TUNABLE PARAMS — adjusted via slider panel
// ═══════════════════════════════════════════════════════════
let ADM={
  foodRate:   0.85,   // multiplier on FOOD_RATE
  starvGrace: 280,    // ticks before starvation kicks in
  mutMult:    1.0,    // mutation rate multiplier
  upkeepMult: 1.0,    // giant upkeep multiplier
  sprintMult: 1.0,    // sprint cost multiplier
  ventActivity:0.35,  // fraction of vent cycle that is active
  predGate:   320000, // tick threshold for predatory unlock
};
// Centre values used for default vent positions
const EL_CX=WW*.5,EL_CY=WH*.5,EL_RX=WW*.4,EL_RY=WH*.38;
const ALL_TR={
  speed: [0.3,4.0,'Speed'],  size:   [2,16,'Size'],
  sense: [20,250,'Sense'],   effic:  [0.4,2.0,'Effic'],

const canvas=document.getElementById('c');

let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',()=>{resize();if(cam)clampCam();});
window.addEventListener('orientationchange',()=>setTimeout(()=>{resize();if(cam)fitWorld();},120));
const cam={x:WW*.5,y:WH*.5,zoom:.25,minZ:.22,maxZ:2.8};
function fitWorld(){cam.zoom=Math.min(W/activeW,H/activeH)*.95;cam.x=activeW*.5;cam.y=activeH*.5;clampCam();}
function clampCam(){
  const ww=activeW*cam.zoom,wh=activeH*cam.zoom;
  // If world fits inside viewport — centre it; else constrain to edges
  if(ww<=W){cam.x=activeW*.5;}
  else{const hw=W/(2*cam.zoom);cam.x=Math.max(hw,Math.min(activeW-hw,cam.x));}
  if(wh<=H){cam.y=activeH*.5;}
  else{const hh=H/(2*cam.zoom);cam.y=Math.max(hh,Math.min(activeH-hh,cam.y));}
}
function s2w(sx,sy){return{x:(sx-W*.5)/cam.zoom+cam.x,y:(sy-H*.5)/cam.zoom+cam.y};}
function w2s(wx,wy){return{x:(wx-cam.x)*cam.zoom+W*.5,y:(wy-cam.y)*cam.zoom+H*.5};}
function inView(wx,wy,sm=60){const{x,y}=w2s(wx,wy);return x>-sm&&x<W+sm&&y>-sm&&y<H+sm;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

// ═══════════════════════════════════════════════════════════
// SPATIAL GRID
// ═══════════════════════════════════════════════════════════
class Grid{
  constructor(){this.cols=0;this.rows=0;this.data=[];}
  reset(){this.cols=(WW/CELL|0)+2;this.rows=(WH/CELL|0)+2;this.data=new Array(this.cols*this.rows).fill(null).map(()=>[]);}
  clear(){for(const c of this.data)c.length=0;}
  _i(x,y){return Math.max(0,Math.min(this.rows-1,y/CELL|0))*this.cols+Math.max(0,Math.min(this.cols-1,x/CELL|0));}
  put(e){this.data[this._i(e.x,e.y)].push(e);}
  near(x,y,r){
    const cr=(r/CELL|0)+1,cx=x/CELL|0,cy=y/CELL|0,out=[];
    for(let dx=-cr;dx<=cr;dx++)for(let dy=-cr;dy<=cr;dy++){
      const nx=cx+dx,ny=cy+dy;
      if(nx>=0&&nx<this.cols&&ny>=0&&ny<this.rows)for(const e of this.data[ny*this.cols+nx])out.push(e);
    }
    return out;
  }
}
const FG=new Grid(),OG=new Grid();

// ═══════════════════════════════════════════════════════════
// BAIT BALL — small/tiny organisms coalesce under threat
// ═══════════════════════════════════════════════════════════
class BaitBall{
  constructor(members){
    this.members=[...members];
    this.x=members.reduce((s,o)=>s+o.x,0)/members.length;
    this.y=members.reduce((s,o)=>s+o.y,0)/members.length;
    this.vx=0;this.vy=0;this.spin=Math.random()*Math.PI*2;
    this.r=Math.sqrt(members.length)*4.5+8;
    this.alive=true;this.threatTimer=80;
    for(const m of members)m.inBall=this;
  }
  update(){
    let threat=null,tD2=450*450;
    for(const o of orgs){
      if(!o.alive||o.mode!=='predator'||o.dna.size<6||o.inBall)continue;
      const dx=o.x-this.x,dy=o.y-this.y,d2=dx*dx+dy*dy;
      if(d2<tD2){tD2=d2;threat=o;}
    }
    if(threat){
      this.threatTimer=80;
      const d=Math.sqrt(tD2)||1;
      this.vx+=(this.x-threat.x)/d*2*.22;this.vy+=(this.y-threat.y)/d*2*.22;
      this.spin+=.15;
      if(Math.sqrt(tD2)<this.r+threat.dna.size+5){
        const perM=threat.dna.aggr*1.5/this.members.length;
        for(const m of this.members)m.energy-=perM;
        threat.energy+=threat.dna.aggr*1.5*.6;threat.flash=4;
        if(Math.random()<.18)this.eject(this.members[Math.floor(Math.random()*this.members.length)]);
        // Blood signal from ball
        bloodSignals.push({x:this.x,y:this.y,str:4,age:0,maxAge:200});
      }
    }else{this.threatTimer--;this.spin+=.03;}
    this.vx*=.86;this.vy*=.86;
    const spd=Math.sqrt(this.vx*this.vx+this.vy*this.vy);
    if(spd>1.8){this.vx=this.vx/spd*1.8;this.vy=this.vy/spd*1.8;}
    this.x=clamp(this.x+this.vx,this.r,WW-this.r);
    this.y=clamp(this.y+this.vy,this.r,WH-this.r);
    const n=this.members.length;
    for(let i=0;i<n;i++){
      const a=this.spin+(i/n)*Math.PI*2;
      this.members[i].x=this.x+Math.cos(a)*this.r*.68;
      this.members[i].y=this.y+Math.sin(a)*this.r*.68;
    }
    for(let i=this.members.length-1;i>=0;i--){if(!this.members[i].alive)this.eject(this.members[i],true);}
    if(this.threatTimer<=0||this.members.length<4)this.dissolve();
  }
  eject(m,dead=false){
    m.inBall=null;
    if(!dead){const a=Math.random()*Math.PI*2;m.vx=Math.cos(a)*2.5;m.vy=Math.sin(a)*2.5;}
    this.members=this.members.filter(x=>x!==m);
    this.r=Math.max(8,Math.sqrt(this.members.length)*4.5+8);
  }
  dissolve(){for(const m of [...this.members])this.eject(m);this.alive=false;}
}
let baitBalls=[];

function checkBaitBalls(){
  if(tick%20!==0||baitBalls.length>=6)return;
  const eligible=orgs.filter(o=>o.alive&&o.sz<5&&!o.inBall&&o.hurt>0&&o.mode==='grazer');
  if(eligible.length<5)return;
  for(const o of eligible){
    const cluster=eligible.filter(e=>{
      if(e.id===o.id||e.inBall)return false;
      const dx=e.x-o.x,dy=e.y-o.y;return dx*dx+dy*dy<90*90;
    });
    if(cluster.length<3)continue;
    const threatened=orgs.some(p=>{
      if(!p.alive||p.mode!=='predator'||p.dna.size<6)return false;
      const dx=p.x-o.x,dy=p.y-o.y;return dx*dx+dy*dy<320*320;
    });
    if(threatened){
      const members=[o,...cluster].filter(m=>!m.inBall).slice(0,20);
      if(members.length>=4){baitBalls.push(new BaitBall(members));return;}
    }
  }
}

// ═══════════════════════════════════════════════════════════
// NUTRIENT ZONES — whale falls + vent enrichment
// ═══════════════════════════════════════════════════════════
class NutrientZone{
  constructor(x,y,size,duration){
    this.x=x;this.y=y;this.r=size*4+20;
    this.totalTicks=duration;this.remaining=duration;
    this.spawnRate=size*.015;this.alive=true;this.pulse=Math.random()*Math.PI*2;
  }
  update(){
    this.pulse+=.02;this.remaining--;
    if(this.remaining<=0){this.alive=false;return;}
    const vitality=this.remaining/this.totalTicks;
    if(foods.length<MAX_FOOD+60&&Math.random()<this.spawnRate*vitality){
      const a=Math.random()*Math.PI*2,r=Math.random()*this.r;
      foods.push(new Food(this.x+Math.cos(a)*r,this.y+Math.sin(a)*r));
    }
  }
}
let nutrientZones=[];

// ═══════════════════════════════════════════════════════════
// DISSOLVED NUTRIENT GRID
// Coarse 2D grid (every 180 units). Colonies absorb from it.
// Vents, shallow zones, whale falls enrich it.
// Cheaper than spawning food particles — no collision detection.
// ═══════════════════════════════════════════════════════════
const NG_STEP=180;
let nutGrid=null,NG_COLS=0,NG_ROWS=0;
// Eutrophication tracking — sustained over-saturation builds up "bloom
// stress" per cell; once it tips over, the algae bloom collapses, the
// water is stripped of nutrients (algae used them all), and a temporary
// hypoxic dead zone forms that costs anything living/growing in it energy.
// Mirrors the real mechanic: excess nutrients -> algal bloom -> bloom dies
// and is decomposed by bacteria -> dissolved oxygen crashes -> die-off.
let bloomStress=null;
let hypoxicZones=[];
let lastBloomCollapseTick=-999999;
const BLOOM_THRESH=0.94,BLOOM_TRIGGER=30,BLOOM_COOLDOWN=1000;

function initNutGrid(){
  NG_COLS=Math.ceil(WW/NG_STEP)+1;
  NG_ROWS=Math.ceil(WH/NG_STEP)+1;
  nutGrid=new Float32Array(NG_COLS*NG_ROWS);
  bloomStress=new Float32Array(NG_COLS*NG_ROWS);
  hypoxicZones=[];
  // Seed base nutrients — shallow zones and upper water richest
  for(let r=0;r<NG_ROWS;r++){
    for(let c=0;c<NG_COLS;c++){
      const x=c*NG_STEP,y=r*NG_STEP;
      const depthFrac=y/WH;
      let n=0.35+Math.random()*0.15;
      // Richer near surface
      n+=Math.max(0,0.3*(1-depthFrac*2.5));
      // Shallow zones get rich seed
      for(const sz of shallowZones){
        const dx=x-sz.x,dy=y-sz.y;
        if(dx*dx+dy*dy<sz.r*sz.r)n+=0.4;
      }
      // Vents also seed rich
      for(const v of vents){
        const dx=x-v.x,dy=y-v.y;
        if(dx*dx+dy*dy<(v.r*2)*(v.r*2))n+=0.3;
      }
      nutGrid[r*NG_COLS+c]=Math.min(1,n);
    }
  }
}

function nutAt(x,y){
  if(!nutGrid)return 0.3;
  const c=Math.max(0,Math.min(NG_COLS-1,x/NG_STEP|0));
  const r=Math.max(0,Math.min(NG_ROWS-1,y/NG_STEP|0));
  return nutGrid[r*NG_COLS+c];
}

function depleteNut(x,y,amt){
  if(!nutGrid)return;
  const c=Math.max(0,Math.min(NG_COLS-1,x/NG_STEP|0));
  const r=Math.max(0,Math.min(NG_ROWS-1,y/NG_STEP|0));
  nutGrid[r*NG_COLS+c]=Math.max(0,nutGrid[r*NG_COLS+c]-amt);
}

// Cheap single-cell nutrient add — living-organism waste/excretion.
// Unlike enrichNut(), no radius fade loop: called once per organism per
// tick, so it must stay O(1).
function dumpWaste(x,y,amt){
  if(!nutGrid)return;
  const c=Math.max(0,Math.min(NG_COLS-1,x/NG_STEP|0));
  const r=Math.max(0,Math.min(NG_ROWS-1,y/NG_STEP|0));
  const i=r*NG_COLS+c;
  nutGrid[i]=Math.min(1,nutGrid[i]+amt);
}

// Bloom collapse — algae strips a patch of water nearly bare of nutrients
// (the opposite of enrichNut). Same radius-fade shape, but tears down
// instead of building up.
function crashNut(x,y,radius){
  if(!nutGrid)return;
  const cells=Math.ceil(radius/NG_STEP);
  const cc=x/NG_STEP|0,rc=y/NG_STEP|0;
  for(let dr=-cells;dr<=cells;dr++){
    for(let dc=-cells;dc<=cells;dc++){
      const nr=rc+dr,nc=cc+dc;
      if(nr<0||nr>=NG_ROWS||nc<0||nc>=NG_COLS)continue;
      const wx=nc*NG_STEP,wy=nr*NG_STEP;
      const dx=wx-x,dy=wy-y,d=Math.sqrt(dx*dx+dy*dy);
      if(d>radius)continue;
      const fade=1-d/radius;
      const i=nr*NG_COLS+nc;
      nutGrid[i]=Math.min(nutGrid[i],0.08*(1-fade)+0.02);
      bloomStress[i]=0;
    }
  }
}

function enrichNut(x,y,amt,radius){
  if(!nutGrid)return;
  const cells=Math.ceil(radius/NG_STEP);
  const cc=x/NG_STEP|0,rc=y/NG_STEP|0;
  for(let dr=-cells;dr<=cells;dr++){
    for(let dc=-cells;dc<=cells;dc++){
      const nr=rc+dr,nc=cc+dc;
      if(nr<0||nr>=NG_ROWS||nc<0||nc>=NG_COLS)continue;
      const wx=nc*NG_STEP,wy=nr*NG_STEP;
      const dx=wx-x,dy=wy-y,d=Math.sqrt(dx*dx+dy*dy);
      if(d>radius)continue;
      const fade=1-d/radius;
      nutGrid[nr*NG_COLS+nc]=Math.min(1,nutGrid[nr*NG_COLS+nc]+amt*fade);
    }
  }
}

let _nutTmp=null;
function diffuseNutGrid(){
  if(!nutGrid||tick%20!==0)return; // every 20 ticks — sufficient and cheaper
  if(!_nutTmp||_nutTmp.length!==nutGrid.length)_nutTmp=new Float32Array(nutGrid.length);
  _nutTmp.set(nutGrid); // reuse buffer
  const tmp=_nutTmp;
  for(let r=1;r<NG_ROWS-1;r++){
    for(let c=1;c<NG_COLS-1;c++){
      const i=r*NG_COLS+c;
      // Average with neighbors — gentle diffusion
      tmp[i]=nutGrid[i]*0.92+(
        nutGrid[i-1]+nutGrid[i+1]+
        nutGrid[i-NG_COLS]+nutGrid[i+NG_COLS])*0.02;
      // Background replenishment — sunlight driven, stronger near surface
      const y=r*NG_STEP;
      if(y<WH*0.25)tmp[i]=Math.min(1,tmp[i]+0.002);
      else if(y<WH*0.45)tmp[i]=Math.min(1,tmp[i]+0.0008);
    }
  }
  // Vent enrichment
  for(const v of vents){
    if(v.ventCycle&&(v.ventCycle%600)/600<ADM.ventActivity)
      enrichNut(v.x,v.y,0.018,v.r*2);
  }
  // Shallow zone replenishment
  if(tick%60===0){for(const sz of shallowZones)enrichNut(sz.x,sz.y,0.012,sz.r*.6);}
  nutGrid.set(tmp);

  // Eutrophication check — cells sitting near TRUE saturation for a long
  // stretch build up stress; everywhere else it bleeds off fast. Gated by
  // both a low simultaneous-zone cap and a flat cooldown between any two
  // collapses anywhere, so richly-seeded map regions (shallow zones etc.)
  // can't chain-trigger back-to-back the moment the world loads.
  if(hypoxicZones.length<3&&tick-lastBloomCollapseTick>BLOOM_COOLDOWN){
    let worstI=-1,worstStress=BLOOM_TRIGGER;
    for(let i=0;i<nutGrid.length;i++){
      if(nutGrid[i]>BLOOM_THRESH)bloomStress[i]+=1;
      else bloomStress[i]=Math.max(0,bloomStress[i]-0.6);
      if(bloomStress[i]>worstStress){worstStress=bloomStress[i];worstI=i;}
    }
    if(worstI>=0){
      const r=worstI/NG_COLS|0,c=worstI%NG_COLS;
      const wx=c*NG_STEP,wy=r*NG_STEP;
      const alreadyZoned=hypoxicZones.some(hz=>{const dx=hz.x-wx,dy=hz.y-wy;return dx*dx+dy*dy<hz.r*hz.r;});
      if(!alreadyZoned){
        const zr=NG_STEP*1.3;
        crashNut(wx,wy,zr);
        hypoxicZones.push({x:wx,y:wy,r:zr,ticksLeft:900,maxTicks:900,pulse:0});
        lastBloomCollapseTick=tick;
        showTicker('☠ Algae bloom collapses — oxygen crashing, dead zone forming');
      }
    }
  }
}

function updateHypoxicZones(){
  for(let i=hypoxicZones.length-1;i>=0;i--){
    const hz=hypoxicZones[i];
    hz.ticksLeft--;hz.pulse+=0.03;
    if(hz.ticksLeft<=0)hypoxicZones.splice(i,1);
  }
}

// Strength of the choking effect at (x,y) — 0 outside all zones, up to ~1
// at a fresh zone's center, fading with both distance and remaining life.
function hypoxiaAt(x,y){
  let s=0;
  for(const hz of hypoxicZones){
    const dx=x-hz.x,dy=y-hz.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d>hz.r)continue;
    const life=hz.ticksLeft/hz.maxTicks;
    s=Math.max(s,(1-d/hz.r)*life);
  }
  return s;
}

// ═══════════════════════════════════════════════════════════
// COLONY — single organism entity, not a cluster of individuals
// Filter feeds from dissolved nutrients. Becomes food for others.
// Grows, reproduces by budding, dies in a nutrient burst.
// ═══════════════════════════════════════════════════════════
let colonies=[];
let _colId=0;

// Shared one-hex-clearance test — used both for growing an existing branch
// cell-by-cell AND for placing a brand-new bud's seed point. A candidate
// spot is blocked if it's too close to an island, or within one hex-width
// of any OTHER colony's actual cells. No exemption for freshly-budding
// colonies — a new seed needs the same lane clearance a grown cell would.
function hexSpotBlocked(wx,wy,hexSize,excludeColony){
  for(const isl of islands){
    if(Math.hypot(wx-isl.x,wy-isl.y)<isl.r+hexSize*2)return true;
  }
  for(const other of colonies){
    if(other===excludeColony||!other.alive)continue;
    const odx=wx-other.x,ody=wy-other.y;
    if(odx*odx+ody*ody>(other.radius+hexSize*2)*(other.radius+hexSize*2))continue; // too far to matter
    for(const oc of other.cells.values()){
      const op=hexToXY(oc.q,oc.r,other.hexSize);
      const dx2=wx-(other.x+op.x),dy2=wy-(other.y+op.y);
      if(dx2*dx2+dy2*dy2<(hexSize+other.hexSize)*(hexSize+other.hexSize))return true;
    }
  }
  return false;
}

// ── HEX GROWTH GRID — colonies branch cell-by-cell instead of scaling
// as a smooth blob. Flat-top axial hex coordinates. ──────────────────
const HEX_DIRS=[{q:1,r:0},{q:1,r:-1},{q:0,r:-1},{q:-1,r:0},{q:-1,r:1},{q:0,r:1}];
function hexKey(q,r){return q+','+r;}
function hexToXY(q,r,size){return{x:size*1.5*q,y:size*Math.sqrt(3)*(r+q*0.5)};}

class Colony{
  constructor(x,y,energy,type){
    this.id=_colId++;
    this.x=x;this.y=y;
    this.energy=energy||120;
    this.maxEnergy=200;
    this.alive=true;
    this.age=0;
    this.pulse=Math.random()*Math.PI*2;
    this.type=type||'coral'; // 'coral' | 'vent' | 'drift'
    // Color by type
    if(this.type==='coral') this.hue=270+Math.random()*20; // purple
    else if(this.type==='vent') this.hue=20+Math.random()*15; // orange
    else this.hue=190+Math.random()*20; // cyan drift
    this.damage=0;
    this.budCooldown=0;
    this.vx=0;this.vy=0; // drift colonies move with current
    // Hex-cell growth — the colony is a branching cluster of hex tiles
    // that accrete one at a time, rather than a smooth scaling blob.
    this.hexSize=6.5;
    this.cells=new Map(); // key "q,r" -> {q,r,jitA,jitS}
    this.radius=this.hexSize; // bounding radius, grows as cells attach
    this.growCooldown=180; // paces cell attachment — see update()
    this._addCell(0,0);
  }

  // Attach a single hex cell at (q,r), rebuilding the bounding radius
  // used everywhere else in the game (feeding range, hit-testing, etc.)
  _addCell(q,r,hp,maxHp){
    const seed=(q*928371+r*50231+this.id*131+1)>>>0;
    this.cells.set(hexKey(q,r),{
      q,r,
      jitA:((seed%1000)/1000-0.5)*0.6,
      jitS:0.8+((seed>>4)%1000)/1000*0.35,
      hp:hp!=null?hp:10, maxHp:maxHp!=null?maxHp:10
    });
    const p=hexToXY(q,r,this.hexSize);
    const d=Math.sqrt(p.x*p.x+p.y*p.y)+this.hexSize*1.05;
    if(d>this.radius)this.radius=d;
  }

  // Recompute the bounding radius from scratch — needed after cells are
  // removed by damage, since growth-time updates only ever grow it.
  _recalcRadius(){
    let r=this.hexSize;
    for(const c of this.cells.values()){
      const p=hexToXY(c.q,c.r,this.hexSize);
      const d=Math.sqrt(p.x*p.x+p.y*p.y)+this.hexSize*1.05;
      if(d>r)r=d;
    }
    this.radius=r;
  }

  // Flood-fill hex-adjacency starting from startCell. If withinSet is
  // given, only wanders through keys in that set; otherwise wanders
  // through all of this.cells. Returns the set of keys reached.
  _floodFill(startCell,withinSet){
    const seen=new Set([hexKey(startCell.q,startCell.r)]);
    const stack=[startCell];
    while(stack.length){
      const c=stack.pop();
      for(const d of HEX_DIRS){
        const k=hexKey(c.q+d.q,c.r+d.r);
        if(seen.has(k))continue;
        if(withinSet){if(!withinSet.has(k))continue;}
        else if(!this.cells.has(k))continue;
        seen.add(k);
        stack.push(this.cells.get(k)||{q:c.q+d.q,r:c.r+d.r});
      }
    }
    return seen;
  }

  // A hex cell just died. Since growth only ever attaches a cell that
  // touches exactly ONE existing neighbor, the whole structure is a tree
  // — so losing an interior cell can genuinely split it into separate
  // pieces. Whatever is no longer reachable from the rest becomes its
  // own independent Colony instead of being deleted outright.
  _afterCellLoss(){
    if(this.cells.size===0){this.alive=false;return;}
    const totalBefore=this.cells.size;
    const keepKeys=this._floodFill([...this.cells.values()][0]);
    if(keepKeys.size!==totalBefore){
      const strandedKeys=new Set([...this.cells.keys()].filter(k=>!keepKeys.has(k)));
      while(strandedKeys.size){
        const firstKey=strandedKeys.values().next().value;
        const groupKeys=this._floodFill(this.cells.get(firstKey),strandedKeys);
        const groupCells=[...groupKeys].map(k=>this.cells.get(k));
        const share=Math.max(1,this.energy*(groupCells.length/totalBefore));
        this.energy=Math.max(1,this.energy-share);
        this._spawnFragment(groupCells,share);
        for(const k of groupKeys){strandedKeys.delete(k);this.cells.delete(k);}
      }
    }
    this._recalcRadius();
  }

  // Spin off a disconnected group of cells as their own new Colony,
  // recentered so the group's first cell becomes its new origin (0,0).
  _spawnFragment(groupCells,energy){
    const origin=groupCells[0];
    const op=hexToXY(origin.q,origin.r,this.hexSize);
    const frag=new Colony(this.x+op.x,this.y+op.y,energy,this.type);
    frag.cells.clear();
    for(const c of groupCells){
      const q=c.q-origin.q,r=c.r-origin.r;
      frag.cells.set(hexKey(q,r),{q,r,jitA:c.jitA,jitS:c.jitS,hp:c.hp,maxHp:c.maxHp});
    }
    frag._recalcRadius();
    newColonies.push(frag);
  }

  // Find a random legal attachment point and grow into it. Rules:
  //  - always a random pick among legal frontier points (never the "best" one)
  //  - a candidate must touch EXACTLY one existing cell — if it touched two
  //    or more, two separate branches would fuse into a loop, which we
  //    never want
  //  - may fuse onto rocks, but must clear islands by a full hex cell
  //  - must also clear every OTHER colony's cells by a full hex cell —
  //    otherwise two separate colonies can grow straight into each other
  //    and visually merge into one blob
  _tryGrowCell(){
    const seen=new Set(),candidates=[];
    for(const cell of this.cells.values()){
      for(const d of HEX_DIRS){
        const nq=cell.q+d.q,nr=cell.r+d.r,k=hexKey(nq,nr);
        if(this.cells.has(k)||seen.has(k))continue;
        seen.add(k);
        let touch=0;
        for(const d2 of HEX_DIRS){if(this.cells.has(hexKey(nq+d2.q,nr+d2.r)))touch++;}
        if(touch!==1)continue; // would meet another branch — reject
        const p=hexToXY(nq,nr,this.hexSize);
        const wx=this.x+p.x,wy=this.y+p.y;
        if(hexSpotBlocked(wx,wy,this.hexSize,this))continue; // rocks are fine — islands and other colonies need clearance
        candidates.push({q:nq,r:nr});
      }
    }
    if(!candidates.length)return false;
    const pick=candidates[Math.floor(Math.random()*candidates.length)];
    this._addCell(pick.q,pick.r);
    return true;
  }

  get sz(){return this.radius;} // compatibility with trophic feeding checks

  update(){
    this.age++;this.pulse+=0.018;this.budCooldown=Math.max(0,this.budCooldown-1);
    this.growCooldown=Math.max(0,this.growCooldown-1);

    // Absorb dissolved nutrients from water
    const localNut=nutAt(this.x,this.y);
    const surfaceArea=this.cells.size*1.1; // more cells = more absorbing surface
    const absorbed=localNut*surfaceArea*0.038; // must exceed drain rate
    this.energy=Math.min(this.maxEnergy,this.energy+absorbed);
    depleteNut(this.x,this.y,absorbed*0.0012); // slow depletion — water column replenishes

    // Grow — spend surplus energy to attach one more hex cell. Cost rises
    // with size so growth naturally slows as the colony gets larger.
    this.maxEnergy=200+this.cells.size*70;
    const cellCost=16+this.cells.size*5;
    if(this.growCooldown<=0&&this.energy>cellCost*1.3&&this._tryGrowCell()){
      this.energy-=cellCost;
      this.growCooldown=180+this.cells.size*8; // slows further as it gets bigger
    }

    // Metabolic drain — bigger colonies cost more to maintain
    this.energy-=0.004+this.cells.size*0.0035;

    // Dead-zone suffocation — sessile, can't swim away from a bloom
    // collapse the way an organism can, so it eats the full brunt of it.
    const hx=hypoxiaAt(this.x,this.y);
    if(hx>0)this.energy-=hx*this.maxEnergy*0.003;

    if(this.energy<=0){this.alive=false;return;}
    if(this.damage>0)this.damage--;
    // Drift colonies move with current
    if(this.type==='drift'){
      const cur=currentAt(this.x,this.y);
      this.vx=this.vx*.9+cur.vx*.4;this.vy=this.vy*.9+cur.vy*.4;
      this.x=clamp(this.x+this.vx,this.radius+5,activeW-this.radius-5);
      this.y=clamp(this.y+this.vy,this.radius+5,activeH-this.radius-5);
    }
    // Vent colonies get bonus nutrition near vents
    if(this.type==='vent'){
      for(const v of vents){
        const d=Math.hypot(this.x-v.x,this.y-v.y);
        if(d<v.r*1.5)this.energy=Math.min(this.maxEnergy,this.energy+0.04);
      }
    }

    // Budding — colony splits off a daughter when large enough
    if(this.energy>this.maxEnergy*0.82&&this.radius>22&&this.budCooldown<=0){
      const a=Math.random()*Math.PI*2;
      const dist=this.radius*1.8+20;
      const bx=clamp(this.x+Math.cos(a)*dist,10,activeW-10);
      const by=clamp(this.y+Math.sin(a)*dist,10,activeH-10);
      // A fresh bud seed needs the exact same one-hex lane clearance a grown
      // cell would — no exemption just because it's brand new. Previously
      // this only checked a flat 16-unit buffer past each colony's CURRENT
      // radius, which let daughters seed right next to still-small (not yet
      // grown) neighbors; they'd then all expand independently until every
      // gap between separate colonies choked down to nothing.
      if(!hexSpotBlocked(bx,by,this.hexSize,null)&&!onSolidGround(bx,by,16)){
        const budEnergy=this.energy*0.28;
        this.energy-=budEnergy;
        newColonies.push(new Colony(bx,by,budEnergy));
        this.budCooldown=1200;
        showTicker(`⟡ Colony buds — generation ${Math.floor(this.age/600)+1}`);
      }
    }

    // Slowly enrich immediate water (waste products, O2, etc.)
    if(tick%12===0)enrichNut(this.x,this.y,0.002,this.radius*0.6);
  }

  // Called when something bites the colony. Each hex cell has its own
  // health — the bite only wounds whichever cell the attacker is
  // actually touching, so one dying cell never takes the whole colony
  // down with it. If killing that cell disconnects the tree, the
  // severed piece(s) become their own independent colonies.
  takeDamage(dmg,attacker){
    this.energy=Math.max(0,this.energy-dmg);
    this.damage=18;
    // Enrich local water with the lost energy — wound leak
    enrichNut(this.x,this.y,dmg*0.003,this.radius);
    bloodSignals.push({x:this.x+(Math.random()-.5)*this.radius,
      y:this.y+(Math.random()-.5)*this.radius,
      str:dmg*2,age:0,maxAge:200});
    if(attacker)attacker.energy+=dmg*0.65;
    if(!this.cells.size)return;
    const ax=attacker?attacker.x:this.x,ay=attacker?attacker.y:this.y;
    let target=null,bd=Infinity;
    for(const cell of this.cells.values()){
      const p=hexToXY(cell.q,cell.r,this.hexSize);
      const wx=this.x+p.x,wy=this.y+p.y;
      const d2=(wx-ax)*(wx-ax)+(wy-ay)*(wy-ay);
      if(d2<bd){bd=d2;target=cell;}
    }
    if(!target)return;
    target.hp-=dmg;
    if(target.hp<=0){
      this.cells.delete(hexKey(target.q,target.r));
      this._afterCellLoss();
    }
  }

  die(){
    // Death nutrient burst — colony collapse feeds the whole zone
    enrichNut(this.x,this.y,0.35,this.radius*4);
    // Spawn a few food particles from the collapse
    for(let i=0;i<Math.floor(this.radius/3);i++){
      const a=Math.random()*Math.PI*2,r=Math.random()*this.radius*1.5;
      if(foods.length<MAX_FOOD)
        foods.push(new Food(this.x+Math.cos(a)*r,this.y+Math.sin(a)*r));
    }
    showTicker(`× Colony collapses — nutrients released`);
    nutrientZones.push(new NutrientZone(this.x,this.y,this.radius*0.5,this.radius*120));
  }
}

let newColonies=[]; // staging buffer, same pattern as newOrgs

function spawnInitialColonies(){
  // Seed coral colonies in shallow zones
  // NOTE: an island's shallow zone is centered ON the island itself, with a
  // radius ~3.2x the island's — sampling within half that radius (below)
  // lands inside the island's own solid footprint far too often (worse,
  // Math.random()*r biases toward the center, i.e. right where the island
  // is). Without the onSolidGround guard, colonies spawn embedded in rock,
  // can never be reached/grazed, and bud more colonies in place. Retry a
  // few times before giving up on this zone.
  for(const sz of shallowZones){
    if(Math.random()<0.6){
      for(let attempt=0;attempt<6;attempt++){
        const a=Math.random()*Math.PI*2,r=Math.random()*sz.r*.5;
        const cx=clamp(sz.x+Math.cos(a)*r,10,activeW-10);
        const cy=clamp(sz.y+Math.sin(a)*r,10,activeH-10);
        if(onSolidGround(cx,cy,10))continue;
        const tooClose=colonies.some(c=>Math.hypot(c.x-cx,c.y-cy)<60);
        if(!tooClose){colonies.push(new Colony(cx,cy,120+Math.random()*60,'coral'));break;}
      }
    }
  }
  // Seed vent colonies near hydrothermal vents
  for(const v of vents){
    if(Math.random()<0.7){
      for(let attempt=0;attempt<6;attempt++){
        const a=Math.random()*Math.PI*2,r=v.r*0.8+Math.random()*v.r;
        const cx=clamp(v.x+Math.cos(a)*r,10,activeW-10);
        const cy=clamp(v.y+Math.sin(a)*r,10,activeH-10);
        if(onSolidGround(cx,cy,10))continue;
        colonies.push(new Colony(cx,cy,100+Math.random()*50,'vent'));break;
      }
    }
  }
  // Seed drift colonies in open water (few, small)
  for(let i=0;i<2;i++){
    for(let attempt=0;attempt<6;attempt++){
      const cx=Math.random()*activeW*.8+activeW*.1;
      const cy=Math.random()*activeH*.4;
      if(onSolidGround(cx,cy,10))continue;
      colonies.push(new Colony(cx,cy,60+Math.random()*30,'drift'));break;
    }
  }
  showTicker(`⟡ ${colonies.length} colonies established`);
}

// ── Trophic feeding — gated by role, not raw size ────────────────
// Urchins: efficient colony feeders (handled in behaveUrchin)
// Crabs: nibble colonies as fallback (handled in behaveCrab)
// Everyone else: very small incidental contact damage only — and this
// is also how the urchin niche bootstraps in the first place (see
// colGrazeScore below), so small organisms need a (very gentle) path
// in here too, not just large ones.
// This prevents the bum-rush — colonies can establish before being eaten
function colonyFeedingStep(){
  for(const col of colonies){
    if(!col.alive)continue;
    for(const o of OG.near(col.x,col.y,col.radius+o_sz_max)){
      if(!o.alive)continue;
      // Urchins and crabs handle their own colony feeding in their behavior functions
      if(o.mode==='urchin'||o.mode==='crab')continue;
      const dx=o.x-col.x,dy=o.y-col.y;
      const dist=Math.sqrt(dx*dx+dy*dy)||1;
      if(dist>col.radius+(o.sz||3)+2)continue;
      // Young colony (radius < 10) is ignored entirely — too small to eat
      if(col.radius<10)continue;
      if(o.colBiteCooldown>0)continue; // paced — was biting every tick in contact
      if(o.energy>=o.maxE*.9)continue; // full — feeding, not killing for its own sake
      const sz=o.sz||3;
      if(sz>=8){
        // Large non-specialists: small incidental damage
        const bite=sz*0.012*(o.dna.aggr+0.1); // much smaller than urchin bites
        if(bite>0&&col.energy>0){
          col.takeDamage(bite,o);
          o.hungerTicks=0;o.fullness+=0.15;o.predScore+=0.05;o.colBiteCooldown=45;
        }
      } else {
        // Small organisms — gentler still, but this is the ONLY path that
        // earns colGrazeScore, so a small organism that keeps coming back
        // to graze a colony can eventually discover the urchin niche.
        const bite=sz*0.006*(o.dna.aggr+0.1);
        if(bite>0&&col.energy>0){
          col.takeDamage(bite,o);
          o.hungerTicks=0;o.fullness+=0.1;o.colGrazeScore=(o.colGrazeScore||0)+0.4;o.colBiteCooldown=50;
        }
      }
    }
  }
}

// ── Colony drawing ────────────────────────────────────────────────
function drawColonies(){
  for(const col of colonies){
    if(!col.alive||!inView(col.x,col.y,col.radius+30))continue;
    const pulse=(Math.sin(col.pulse)+1)*0.5;
    const vitality=Math.min(1,col.energy/col.maxEnergy);
    const dmgFlash=col.damage>0;

    // Nutrient halo — color matches colony type
    const localNut=nutAt(col.x,col.y);
    if(localNut>0.15){
      const halo=ctx.createRadialGradient(col.x,col.y,col.radius*0.8,col.x,col.y,col.radius*2.2);
      const haloCol=col.type==='vent'?`rgba(180,80,20,`
                  :col.type==='drift'?`rgba(20,140,180,`
                  :`rgba(120,40,180,`; // coral = purple
      halo.addColorStop(0,haloCol+'0.0)');
      halo.addColorStop(0.5,haloCol+`${localNut*0.14})`);
      halo.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath();ctx.arc(col.x,col.y,col.radius*2.2,0,Math.PI*2);
      ctx.fillStyle=halo;ctx.fill();
    }

    // Body — a branching cluster of hex cells, each one an accreted
    // growth point, instead of one smooth scaling blob
    if(col.cells&&col.cells.size){
      ctx.save();ctx.translate(col.x,col.y);
      const h=dmgFlash?0:col.hue;
      const s=dmgFlash?70:50+vitality*20;
      const l=dmgFlash?35:18+vitality*16;
      for(const cell of col.cells.values()){
        const p=hexToXY(cell.q,cell.r,col.hexSize);
        const cs=col.hexSize*cell.jitS;
        // Per-cell wound tint — a bitten cell reddens toward its own
        // health, independent of the rest of the colony's condition
        const cellVit=Math.max(0,Math.min(1,cell.hp/cell.maxHp));
        const ch=h*cellVit; // hue drifts toward red(0) as this cell is chewed on
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(col.pulse*0.015+cell.jitA); // slow breathing rotation
        ctx.beginPath();
        for(let i=0;i<6;i++){
          const ang=Math.PI/3*i,px=cs*Math.cos(ang),py=cs*Math.sin(ang);
          if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        }
        ctx.closePath();
        ctx.fillStyle=`hsl(${ch},${s}%,${l}%)`;ctx.fill();
        ctx.strokeStyle=`hsla(${ch},${s+10}%,${l+18}%,${0.4+pulse*0.35})`;
        ctx.lineWidth=1.4/cam.zoom;ctx.stroke();
        ctx.beginPath();
        for(let i=0;i<6;i++){
          const ang=Math.PI/3*i,px=cs*0.55*Math.cos(ang),py=cs*0.55*Math.sin(ang);
          if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        }
        ctx.closePath();
        ctx.fillStyle=`hsla(${ch},${s}%,${l+28}%,0.18)`;ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }

    // Selection ring
    if(selectedColonyId===col.id){
      ctx.beginPath();ctx.arc(col.x,col.y,col.radius+8/cam.zoom,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5/cam.zoom;ctx.stroke();
    }
    // Energy bar
    if(vitality<0.95){
      const bw=col.radius*1.6,bh=3/cam.zoom;
      const bx=col.x-bw*.5,by=col.y-col.radius-8/cam.zoom;
      ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle=`hsl(${vitality*120},70%,45%)`;ctx.fillRect(bx,by,bw*vitality,bh);
    }
  }
}

// ── Nutrient grid rendering (subtle water tint) ───────────────────
function drawNutGrid(){
  if(!nutGrid||!inView(activeW/2,activeH/2,activeW))return;
  // Only draw every 4th cell for performance
  const step=NG_STEP*2;
  for(let r=0;r<NG_ROWS;r+=2){
    for(let c=0;c<NG_COLS;c+=2){
      const x=c*NG_STEP,y=r*NG_STEP;
      if(!inView(x,y,step))continue;
      const n=nutGrid[r*NG_COLS+c];
      if(n<0.25)continue; // skip low-nutrient cells — no visual
      ctx.fillStyle=`rgba(8,${40+n*60|0},${30+n*50|0},${n*0.07})`;
      ctx.fillRect(x,y,step,step);
    }
  }
}

// ═══════════════════════════════════════════════════════════
// BLOOD SIGNALS — damage events attract predators
// ═══════════════════════════════════════════════════════════
let bloodSignals=[];
function updateBloodSignals(){
  for(let i=bloodSignals.length-1;i>=0;i--){
    bloodSignals[i].age++;
    if(bloodSignals[i].age>=bloodSignals[i].maxAge)bloodSignals.splice(i,1);
  }
}

// ═══════════════════════════════════════════════════════════
// REEF SYSTEM — communes at 100+ become physical barriers
// ═══════════════════════════════════════════════════════════
let activeReefs=[];
function detectReefs(){
  if(tick%80!==0)return;
  activeReefs=[];
  const communeOrgs=orgs.filter(o=>o.alive&&o.mode==='commune');
  if(communeOrgs.length<20)return;
  const visited=new Set();
  for(const o of communeOrgs){
    if(visited.has(o.id))continue;
    const cluster=[o],stack=[o];visited.add(o.id);
    while(stack.length){
      const cur=stack.pop();
      for(const other of OG.near(cur.x,cur.y,160)){
        if(!other.alive||other.mode!=='commune'||visited.has(other.id))continue;
        visited.add(other.id);cluster.push(other);stack.push(other);
      }
    }
    if(cluster.length>=100){
      const cx=cluster.reduce((s,o)=>s+o.x,0)/cluster.length;
      const cy=cluster.reduce((s,o)=>s+o.y,0)/cluster.length;
      let maxR=0;
      for(const o of cluster){const dx=o.x-cx,dy=o.y-cy;maxR=Math.max(maxR,Math.sqrt(dx*dx+dy*dy)+o.dna.size);}
      const existing=activeReefs.find(r=>Math.hypot(r.x-cx,r.y-cy)<100);
      if(!existing){
        activeReefs.push({x:cx,y:cy,r:maxR,members:cluster.length});
        biomeMilestones.communeFormed=true;
    if(!cluster[0].reefMember){cluster.forEach(o=>o.reefMember=true);showTicker(`⟡ REEF ESTABLISHED — ${cluster.length} commune members`);}
      } else {existing.x=cx;existing.y=cy;existing.r=maxR;existing.members=cluster.length;}
    }
  }
}
function reefCollide(e){
  if((e.sz||e.dna.size)<3.5)return;
  for(const reef of activeReefs){
    const dx=e.x-reef.x,dy=e.y-reef.y,d=Math.sqrt(dx*dx+dy*dy)||1,minD=reef.r+(e.sz||e.dna.size);
    if(d<minD){
      e.x=reef.x+(dx/d)*minD;e.y=reef.y+(dy/d)*minD;
      const dot=e.vx*(dx/d)+e.vy*(dy/d);
      if(dot<0){e.vx-=2*dot*(dx/d)*0.8;e.vy-=2*dot*(dy/d)*0.8;e.vx*=.35;e.vy*=.35;}
    }
  }
}

// ═══════════════════════════════════════════════════════════
// TERRAIN + ISLANDS
// ═══════════════════════════════════════════════════════════
// Terrain unlocked through play — start empty, earn through milestones
let terrain=[];
let islands=[];
// Unlock flags
let terraformUnlocked={rock:false,island:false,vent:false,shallow:false,waypoint:false};

// Default shallow zones — positions are fractions of the FULL world (WW/WH),
// which only line up correctly once activeW/activeH reach that same size
// (the Sea stage). In earlier, smaller biomes most of this full-world
// footprint falls in the fogged, not-yet-unlocked part of the map — e.g. in
// Petri (1440x900) two of the three zones fall entirely outside the active
// area, and the one that partly overlaps only covers a corner of it. That
// concentrates every food/grass richness bonus that depends on shallow
// zones into whatever sliver happens to overlap, instead of being usefully
// spread across the area actually being played in — the "food only spawns
// in one corner" bug. isDefault zones get rescaled to activeW/activeH each
// time the biome initializes (see initBiome), so they stay well distributed
// in whatever's currently visible and settle into their final absolute
// layout once the world reaches full (Sea) size. Player-placed zones don't
// have this flag and are left exactly where placed.
const DEFAULT_SHALLOW_FRACS=[
  {fx:.15,fy:.15,fr:520/7680},{fx:.70,fy:.12,fr:460/7680},{fx:.45,fy:.08,fr:400/7680},
];
let shallowZones=DEFAULT_SHALLOW_FRACS.map(f=>({x:WW*f.fx,y:WH*f.fy,r:WW*f.fr,isDefault:true}));
let vents=[];
let grassPatches=[];

function nearIsland(x,y,margin=200){
  for(const isl of islands){const dx=x-isl.x,dy=y-isl.y;if(dx*dx+dy*dy<(isl.r+margin)*(isl.r+margin))return true;}
  return false;
}
function inShallowZone(x,y){
  for(const sz of shallowZones){const dx=x-sz.x,dy=y-sz.y;if(dx*dx+dy*dy<sz.r*sz.r)return true;}
  if(nearIsland(x,y,180))return true;
  return false;
}
// Shared solid-ground check — same rock+island set applyTerrain() uses to
// block organisms. Colonies and food placement need this too: an island's
// shallow zone is centered ON the island and is much wider than the island
// itself, so naive random placement inside that zone lands on/inside the
// island rock a large fraction of the time (colony visibly stuck in solid
// ground, no food ever spawns there since organisms can't enter it either).
function onSolidGround(x,y,pad=0){
  for(const t of terrain){const dx=x-t.x,dy=y-t.y;if(dx*dx+dy*dy<(t.r+pad)*(t.r+pad))return true;}
  for(const isl of islands){const dx=x-isl.x,dy=y-isl.y;if(dx*dx+dy*dy<(isl.r+pad)*(isl.r+pad))return true;}
  return false;
}

function applyTerrain(e){
  const r=e.dna?e.sz||e.dna.size:3;
  const allRocks=[...terrain,...islands];
  for(const t of allRocks){
    const dx=e.x-t.x,dy=e.y-t.y,d=Math.sqrt(dx*dx+dy*dy)||1,mn=t.r+r;
    if(d<mn){e.x=t.x+(dx/d)*mn;e.y=t.y+(dy/d)*mn;const dot=e.vx*(dx/d)+e.vy*(dy/d);if(dot<0){e.vx-=2*dot*(dx/d);e.vy-=2*dot*(dy/d);e.vx*=.5;e.vy*=.5;}}
  }
}

// Is (x,y) sitting over an actual hex cell of a colony's branch structure,
// or in the empty single-hex-wide gaps ("lanes") between branches, or not
// near any colony at all? Used to size-gate fish navigation around colonies.
function colonyHexState(x,y){
  for(const col of colonies){
    if(!col.alive)continue;
    const dx=x-col.x,dy=y-col.y;
    if(dx*dx+dy*dy>col.radius*col.radius)continue;
    for(const cell of col.cells.values()){
      const p=hexToXY(cell.q,cell.r,col.hexSize);
      const cdx=(col.x+p.x)-x,cdy=(col.y+p.y)-y;
      if(cdx*cdx+cdy*cdy<(col.hexSize*.85)*(col.hexSize*.85))return{state:'cell',col};
    }
    return{state:'lane',col}; // inside the footprint but between branches
  }
  return null;
}

// Colony branch-and-lane size gating for the food-chain hunters (fish,
// crab, predator): large ones can't pass over a branch OR squeeze
// through the single-hex lanes between them (blocked from the whole
// footprint, same push-and-reflect as solid terrain), medium ones are
// only slowed when directly over a branch but swim the lanes freely,
// small ones are never affected either way. This is what makes a colony
// actual refuge — see fleeBehavior()'s bias toward a nearby colony when
// the thing chasing it is too big to follow in.
function applyColonyNavGate(o){
  if(o.mode!=='fish'&&o.mode!=='crab'&&o.mode!=='predator')return;
  const hs=colonyHexState(o.x,o.y);
  if(!hs)return;
  if(o.sz>=7){
    const col=hs.col,dx=o.x-col.x,dy=o.y-col.y,d=Math.sqrt(dx*dx+dy*dy)||1,mn=col.radius+o.sz*.5;
    o.x=col.x+(dx/d)*mn;o.y=col.y+(dy/d)*mn;
    const dot=o.vx*(dx/d)+o.vy*(dy/d);
    if(dot<0){o.vx-=2*dot*(dx/d);o.vy-=2*dot*(dy/d);o.vx*=.5;o.vy*=.5;}
  } else if(o.sz>=4&&hs.state==='cell'){
    o.vx*=.35;o.vy*=.35;
  }
}

// ═══════════════════════════════════════════════════════════
// ORGANIC CURRENT — Catmull-Rom spline + precomputed grid
// ═══════════════════════════════════════════════════════════
let surfaceWPs=[]; // player builds the current loop via terraform ↗
let trenchPts=[
  {x:WW*.80,y:WH*.88,type:'down'},
  {x:WW*.50,y:WH*.96,type:'mid'},
  {x:WW*.20,y:WH*.84,type:'up'},
];

let currentField=null,CF_COLS=0,CF_ROWS=0,splineSamples=[];

function catmullRomPt(p0,p1,p2,p3,t){
  const t2=t*t,t3=t2*t;
  return{
    x:.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
    y:.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3),
  };
}

function buildSpline(){
  splineSamples=[];
  if(surfaceWPs.length<3)return; // need at least 3 to form a sensible loop
  const pts=surfaceWPs,n=pts.length;
  splineSamples=[];
  const segs=50;
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    for(let j=0;j<segs;j++)splineSamples.push(catmullRomPt(p0,p1,p2,p3,j/segs));
  }
}

function buildCurrentField(){
  buildSpline();
  CF_COLS=Math.ceil(WW/GRID_STEP)+1;CF_ROWS=Math.ceil(WH/GRID_STEP)+1;
  currentField=new Float32Array(CF_COLS*CF_ROWS*2); // zeros = calm water
  if(!splineSamples.length)return; // no waypoints yet — nothing to compute
  const N=splineSamples.length;
  const tangents=splineSamples.map((_,i)=>{
    const nx=splineSamples[(i+1)%N],px=splineSamples[(i-1+N)%N];
    let tx=nx.x-px.x,ty=nx.y-px.y,tm=Math.sqrt(tx*tx+ty*ty)||1;
    return{x:tx/tm,y:ty/tm};
  });
  for(let gy=0;gy<CF_ROWS;gy++){
    const wy=gy*GRID_STEP;
    for(let gx=0;gx<CF_COLS;gx++){
      const wx=gx*GRID_STEP;
      let best=0,bestD=Infinity;
      for(let i=0;i<N;i++){const dx=splineSamples[i].x-wx,dy=splineSamples[i].y-wy,d=dx*dx+dy*dy;if(d<bestD){bestD=d;best=i;}}
      const dist=Math.sqrt(bestD);
      const strength=Math.exp(-dist/380)*.22;
      const t=tangents[best];
      const speedMod=1+Math.max(0,-t.y)*.7;
      const idx=(gy*CF_COLS+gx)*2;
      currentField[idx]=t.x*strength*speedMod;
      currentField[idx+1]=t.y*strength*speedMod;
    }
  }
  // Deep counter-current (cold return along benthic)
  const down=trenchPts[0],mid=trenchPts[1],up=trenchPts[2];
  const trenchSegs=[[down,mid],[mid,up]];
  for(let gy=0;gy<CF_ROWS;gy++){
    const wy=gy*GRID_STEP;
    if(wy<WH*.58)continue;
    for(let gx=0;gx<CF_COLS;gx++){
      const wx=gx*GRID_STEP,idx=(gy*CF_COLS+gx)*2;
      for(const[p1,p2]of trenchSegs){
        const dx=p2.x-p1.x,dy=p2.y-p1.y,dm=Math.sqrt(dx*dx+dy*dy)||1;
        const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
        const pdx=wx-mx,pdy=wy-my,pd=Math.sqrt(pdx*pdx+pdy*pdy);
        const str=Math.exp(-pd/500)*.09;
        currentField[idx]+=dx/dm*str;currentField[idx+1]+=dy/dm*str;
      }
      // Upwelling: upward Y pull near upwelling point
      const udx=wx-up.x,udy=wy-up.y,ud=Math.sqrt(udx*udx+udy*udy);
      currentField[idx+1]-=Math.exp(-ud/280)*.14;
      // Downwelling: downward Y pull near downwelling point
      const ddx=wx-down.x,ddy=wy-down.y,dd=Math.sqrt(ddx*ddx+ddy*ddy);
      currentField[idx+1]+=Math.exp(-dd/280)*.14;
    }
  }
}

function currentAt(x,y){
  if(!currentField)return{vx:0,vy:0};
  const gx=x/GRID_STEP,gy=y/GRID_STEP;
  const gx0=Math.max(0,Math.min(CF_COLS-2,gx|0)),gy0=Math.max(0,Math.min(CF_ROWS-2,gy|0));
  const fx=gx-gx0,fy=gy-gy0;
  const i00=(gy0*CF_COLS+gx0)*2,i10=i00+2,i01=((gy0+1)*CF_COLS+gx0)*2,i11=i01+2;
  return{
    vx:currentField[i00]*(1-fx)*(1-fy)+currentField[i10]*fx*(1-fy)+currentField[i01]*(1-fx)*fy+currentField[i11]*fx*fy,
    vy:currentField[i00+1]*(1-fx)*(1-fy)+currentField[i10+1]*fx*(1-fy)+currentField[i01+1]*(1-fx)*fy+currentField[i11+1]*fx*fy,
  };
}
function nearestTrackPt(x,y){
  if(!splineSamples.length)return{x,y};
  let best=splineSamples[0],bestD=Infinity;
  for(const s of splineSamples){const dx=s.x-x,dy=s.y-y,d=dx*dx+dy*dy;if(d<bestD){bestD=d;best=s;}}
  return best;
}

const NFLOW=60;
let flowPhases=Array.from({length:NFLOW},(_,i)=>i/NFLOW);
function updateFlow(){
  if(!splineSamples.length)return;
  for(let i=0;i<NFLOW;i++){flowPhases[i]=(flowPhases[i]+.0018)%1;}
}

// DNA + STEPS
// ═══════════════════════════════════════════════════════════
let mutBoost=false,primordialMode=false;
let nichePressure={predator:false,parasite:false,herbivore:false};

function randDNA(){
  // Everything starts as single-cell. All complexity must be earned.
  // Tiny variation gives natural selection something to grip.
  const v=()=>Math.random()*.018; // near-zero noise for advanced traits
  return{
    speed:  0.3+Math.random()*.35,
    size:   2  +Math.random()*.6,
    sense:  20 +Math.random()*18,
    effic:  0.4+Math.random()*.18,
    repro:  120+Math.random()*40,
    mantle: v(), jet:v(), nozzle:v(),
    armor:  v(), anchor:v(),
    aggr:   v(), adhes:v(), bite:0,
  };
}

function mutateDNA(dna){
  const d={...dna},b=(mutBoost?2.1:1)*ADM.mutMult;
  for(const[k,[mn,mx]]of Object.entries(ALL_TR)){
    if(Math.random()<.27*b){
      let delta=(mx-mn)*.09*(Math.random()*2-1);
      // Niche pressure nudges
      if(k==='aggr'&&nichePressure.predator)delta=Math.abs(delta)*.7+delta*.3;
      if(k==='adhes'&&nichePressure.parasite)delta=Math.abs(delta)*.6+delta*.4;
      d[k]=clamp(d[k]+delta,mn,mx);
    }
  }
  return d;
}

// ═══════════════════════════════════════════════════════════
// APPENDAGES — random structural mutations, no effect yet.
// Foundation for future behaviors. Extend this list as new
// appendage-driven mechanics get built.
// ═══════════════════════════════════════════════════════════
const APPENDAGE_TYPES=['tentacle','spine','fin','lure'];
const APPENDAGE_MUTATION_CHANCE=0.012; // per birth event, before mutMult scaling

function mutateAppendages(inherited){
  const set=new Set(inherited||[]);
  const chance=APPENDAGE_MUTATION_CHANCE*(mutBoost?1.8:1)*ADM.mutMult;
  // Each birth gets one roll per appendage type — an individual can
  // accumulate several different appendages across generations.
  for(const type of APPENDAGE_TYPES){
    if(!set.has(type)&&Math.random()<chance)set.add(type);
  }
  return set;
}

function blendDNA(a,b){
  const d={};
  for(const[k,[mn,mx]]of Object.entries(ALL_TR)){
    const base=Math.random()<.5?a[k]:b[k];
    d[k]=clamp(base+(mx-mn)*.05*(Math.random()*2-1),mn,mx);
  }
  return d;
}

function orgColor(dna,steps){
  let h=((dna.speed-.3)/3.7*260)|0;
  if(steps.has('predatory'))h=(h+340)%360;
  if(steps.has('parasitic'))h=(h+270)%360;
  if(steps.has('herbivore'))h=(h+120)%360;
  if(steps.has('ambush'))h=(h+30)%360; // amber/gold — patient hunter
  if(steps.has('deep_adapted'))h=(h+190)%360; // cold deep blue
  if(steps.has('vent_adapted'))h=(h+300)%360; // volcanic — orange-red glow
  const s=(52+((dna.effic-.4)/1.6)*28)|0;
  const l=(40+((1-(dna.size-2)/14)*18))|0;
  return[h,s,l];
}
function hsl(h,s,l,a=1){return a<1?`hsla(${h},${s}%,${l}%,${a})`:`hsl(${h},${s}%,${l}%)`;}

// ═══════════════════════════════════════════════════════════
// GRASS
// ═══════════════════════════════════════════════════════════
class GrassPatch{
  constructor(x,y){
    this.x=x;this.y=y;this.density=.12+Math.random()*.2;
    this.r=70+Math.random()*55;this.maxDensity=.75+Math.random()*.25;
    this.growRate=.0008+Math.random()*.0006; // 6x faster — visible growth
    this.blades=Array.from({length:28},()=>({
      ox:(Math.random()-.5)*this.r*1.7,oy:(Math.random()-.5)*this.r*1.7,
      sw:Math.random()*Math.PI*2,h:8+Math.random()*16,
    })).filter(b=>b.ox*b.ox+b.oy*b.oy<this.r*this.r);
  }
  update(){
    // Grass is primary production too — growth rate follows the same
    // nutrient-saturation curve as food spawning, and growing draws down
    // the same local nutrient pool. Nutrient-starved grass still creeps
    // along slowly (a bare rate floor), it just can't thrive.
    if(this.density<this.maxDensity){
      const nut=nutAt(this.x,this.y),nutFactor=nut/(nut+0.25);
      const grown=this.growRate*(0.25+nutFactor*1.5);
      this.density=Math.min(this.maxDensity,this.density+grown);
      depleteNut(this.x,this.y,grown*0.2);
    }

    // Invasive spread — aggressive colonisation
    if(this.density>.52&&grassPatches.length<MAX_GRASS&&Math.random()<.003){
      const angle=Math.random()*Math.PI*2;
      const dist=this.r*1.3+Math.random()*110;
      const nx=this.x+Math.cos(angle)*dist;
      const ny=this.y+Math.sin(angle)*dist;
      if(nx>20&&nx<WW-20&&ny>20&&ny<WH-20){
        const tooClose=grassPatches.some(g=>{const dx=g.x-nx,dy=g.y-ny;return dx*dx+dy*dy<(g.r+18)*(g.r+18);});
        const inRock=onSolidGround(nx,ny); // rocks AND islands — was rocks-only
        if(!tooClose&&!inRock){
          const inShallow=shallowZones.some(sz=>{const dx=nx-sz.x,dy=ny-sz.y;return dx*dx+dy*dy<sz.r*sz.r;})||nearIsland(nx,ny,200);
          const tooDeep=ny>WH*.72&&!inShallow;
          if(!tooDeep){
            const gp=new GrassPatch(nx,ny);
            gp.density=.20+Math.random()*.18; // visible from the start
            if(inShallow)gp.growRate*=1.6;
            grassPatches.push(gp);
          }
        }
      }
    }
  }
  coverAt(x,y){const dx=x-this.x,dy=y-this.y;return dx*dx+dy*dy<this.r*this.r?this.density:0;}
}

function grassCoverAt(x,y){
  let cover=0;for(const gp of grassPatches)cover=Math.max(cover,gp.coverAt(x,y));return cover;
}


// Add grass patches near newly placed terrain without destroying existing ones
function seedGrassAround(x,y,radius,count){
  for(let i=0;i<count;i++){
    if(grassPatches.length>=MAX_GRASS)break;
    const a=Math.random()*Math.PI*2;
    const r=radius*.5+Math.random()*radius*.8;
    const gx=x+Math.cos(a)*r,gy=y+Math.sin(a)*r;
    if(gx<10||gx>WW-10||gy<10||gy>WH-10)continue;
    if(onSolidGround(gx,gy))continue; // rocks AND islands — was rocks-only
    const tooClose=grassPatches.some(g=>{const dx=g.x-gx,dy=g.y-gy;return dx*dx+dy*dy<(g.r+15)*(g.r+15);});
    if(!tooClose)grassPatches.push(new GrassPatch(gx,gy));
  }
}

function initGrass(){
  grassPatches=[];
  // Shallow zones had no rock/island exclusion at all — an island's own
  // shallow zone is centered on the island, so plenty of this grass used
  // to land directly inside solid rock (same root cause as the colony and
  // food placement bugs).
  for(const sz of shallowZones)for(let i=0;i<8;i++){
    const a=Math.random()*Math.PI*2,r=Math.random()*sz.r*.8;
    const gx=sz.x+Math.cos(a)*r,gy=sz.y+Math.sin(a)*r;
    if(!onSolidGround(gx,gy))grassPatches.push(new GrassPatch(gx,gy));
  }
  for(const t of terrain)for(let i=0;i<3;i++){
    const a=Math.random()*Math.PI*2,r=t.r+(30+Math.random()*80);
    const gx=t.x+Math.cos(a)*r,gy=t.y+Math.sin(a)*r;
    if(gy<WH*.35&&!onSolidGround(gx,gy))grassPatches.push(new GrassPatch(gx,gy));
  }
}
