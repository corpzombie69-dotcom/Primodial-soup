// ORGANISM
// ═══════════════════════════════════════════════════════════
let _uid=0,sexualBirths=0;
class Org{
  constructor(x,y,dna,energy,gen,steps,appendages){
    this.id=_uid++;this.x=x;this.y=y;this.dna=dna;
    this.energy=energy;this.gen=gen||1;
    this.vx=(Math.random()-.5)*.3;this.vy=(Math.random()-.5)*.3;
    this.wa=Math.random()*Math.PI*2;
    this.age=0;this.alive=true;this.flash=0;this.hurt=0;
    this.mFill=0;this.mateCooldown=0;this.mating=0;
    this.predScore=0;this.paraScore=0;this.grassTicks=0;this.contactScore=0;this.colGrazeScore=0;
    this.parasiteLoad=0;this._tasted=false;this.ambushScore=0;this.inBall=null;this.packBonus=1;this.deathHandled=false;this.exposed=0;
    this.colBiteCooldown=0; // paces colony bites — was landing every tick in contact
    this.hungerTicks=0;
    this.deepTicks=0;
    this.fullness=0; // satiation meter
    // Body size — phenotypic, not genetic. Born small, grow with food.
    // dna.size = genetic ceiling (max potential). sz = current physical size.
    this.sz=Math.max(2,dna.size*(0.28+Math.random()*.12)); // born at ~30% of potential — fills on eating, triggers division
    this.maxAge=Math.floor(3600+Math.random()*1200); // ~1 min base lifespan — efficient organisms live longer
    this.ventTicks=0;
    this.digestTimer=0;this.digestEnergy=0;
    this.communeBonus=0;
    // Inherit steps from parent if provided
    this.evolSteps=new Set(steps||[]);
    this.recalcSteps();
    // Appendages — random structural mutations, inert for now.
    // Foundation for future behavior: tentacle, spine, fin, lure, etc.
    // An individual can carry more than one simultaneously.
    this.appendages=new Set(appendages||[]);
    this.mode='grazer';this.modeTimer=0;
    this.hsv=orgColor(dna,this.evolSteps);
    this.maxE=dna.repro*1.35;
    this.anchorPt=null;
  }

  // Learned aggression — a hungry organism that successfully hurts/feeds on
  // another reinforces that strategy. Aggression climbs through experience,
  // not just genetic drift. Capped so it still takes sustained success to matter.
  learnAggression(dmg){
    if(dmg<=0)return;
    const hungry=this.energy<this.maxE*.55;
    if(hungry&&this.dna.aggr<1)
      this.dna.aggr=Math.min(1,this.dna.aggr+0.0009);
  }

  recalcSteps(){
    for(const[name,fn]of Object.entries(STEP_DEFS)){
      if(fn(this.dna,this))this.evolSteps.add(name);else this.evolSteps.delete(name);
    }
    // Special discovery steps — update color when new step added
    const prevSize=this.evolSteps.size;
    // Predatory discovery — needs fast + aggressive steps, high predScore
    // AND ecosystem must be mature: 15+ large organisms + minimum sim time
    // Ecosystem maturity — tied to generations passed and population health,
    // not a fixed tick count (which is speed-dependent and arbitrary) or a
    // population snapshot of genetic-ceiling giants (disconnected from whether
    // THIS individual has actually proven itself a hunter).
    const ecosystemMature=highGen>=12&&orgs.length>=40;
    // Speed dropped as a requirement — a starving organism that finds ANY way
    // to survive (fast chase or patient ambush) should qualify, not just chasers.
    if(this.predScore>=40&&this.evolSteps.has('aggressive')&&ecosystemMature&&!this.evolSteps.has('predatory')){
      this.evolSteps.add('predatory');this.hsv=orgColor(this.dna,this.evolSteps);
      showTicker(`↯ Predation discovered — Gen ${this.gen}`);
    }
    if(this.paraScore>=5&&this.evolSteps.has('predatory')&&this.sz<5.5&&highGen>=14&&!this.evolSteps.has('parasitic')){
      this.evolSteps.add('parasitic');this.hsv=orgColor(this.dna,this.evolSteps);
      showTicker(`↯ Parasitism emerged — Gen ${this.gen}`);
    }
    if(this.grassTicks>=2800&&this.evolSteps.has('large')&&!this.evolSteps.has('herbivore')){
      this.evolSteps.add('herbivore');this.hsv=orgColor(this.dna,this.evolSteps);
      showTicker(`↯ Herbivory unlocked — Gen ${this.gen}`);
    }
    // Urchin — like crab, a branch off predation rather than its own
    // standalone path: has to have proven itself a hunter first, then
    // specializes into colony-grazing while staying small.
    if(this.evolSteps.has('predatory')&&this.colGrazeScore>=8&&this.sz<6.5&&!this.evolSteps.has('urchin')){
      this.evolSteps.add('urchin');this.hsv=orgColor(this.dna,this.evolSteps);
      showTicker(`↯ Urchin niche — Gen ${this.gen} settles in to graze colonies`);
    }
    // Crab — a small-bodied predator branch. Rides on the existing
    // predatory gate (already proven itself a hunter) but only claims
    // the niche while it stays small — a nimble opportunist rather
    // than a large chaser.
    if(this.evolSteps.has('predatory')&&this.sz<6.5&&!this.evolSteps.has('crab')){
      this.evolSteps.add('crab');this.hsv=orgColor(this.dna,this.evolSteps);
      showTicker(`↯ Crab niche — Gen ${this.gen} stays small and quick`);
    }
    // Fish — an omnivore that actively hunts rather than just grazing:
    // toothed (omnivore base) + real predatory drive + speed to chase.
    if(this.evolSteps.has('toothed')&&this.predScore>=15&&this.dna.speed>2.2&&!this.evolSteps.has('fish')){
      this.evolSteps.add('fish');this.hsv=orgColor(this.dna,this.evolSteps);
      showTicker(`↯ Fish niche — Gen ${this.gen} hunts the small and shelled`);
    }
    // Contact feeder step — enough collisions to learn proximity pays
    if(this.contactScore>=20&&!this.evolSteps.has('contact_feeder')){
      this.evolSteps.add('contact_feeder');this.hsv=orgColor(this.dna,this.evolSteps);
      showTicker(`↯ Contact feeding — Gen ${this.gen} learns collisions feed`);
    }
    // Teeth — bite DNA + contact experience, available to all
    if(this.dna.bite>.32&&this.contactScore>=40&&!this.evolSteps.has('toothed')){
      this.evolSteps.add('toothed');this.hsv=orgColor(this.dna,this.evolSteps);
      showTicker(`↯ Teeth evolved — Gen ${this.gen} punctures and tastes blood`);
    }
    // Ambush: separate path from active predation — patience, not speed
    if(this.ambushScore>=10&&this.sz>6&&!this.evolSteps.has('predatory')&&!this.evolSteps.has('ambush')){
      this.evolSteps.add('ambush');this.hsv=orgColor(this.dna,this.evolSteps);
      showTicker(`↯ Ambush discovered — Gen ${this.gen} waits for prey to come to it`);
    }
    // Deep water adaptation — earned by surviving pressure and cold
    if(this.deepTicks>900&&this.evolSteps.has('efficient')&&!this.evolSteps.has('deep_adapted')){
      this.evolSteps.add('deep_adapted');this.hsv=orgColor(this.dna,this.evolSteps);
      showTicker(`↯ Deep adaptation — Gen ${this.gen} conquers the abyss`);
      biomeMilestones.deepAdapted=true;
    }
    // Vent adaptation — superheated water (~400°C), lethal without specific tolerance
    // Requires deep_adapted first, then sustained exposure near active vents
    if(this.ventTicks>600&&this.evolSteps.has('deep_adapted')&&!this.evolSteps.has('vent_adapted')){
      this.evolSteps.add('vent_adapted');this.hsv=orgColor(this.dna,this.evolSteps);
      showTicker(`↯ Vent adaptation — Gen ${this.gen} survives superheated water`);
    }
    if(this.evolSteps.size!==prevSize){this.hsv=orgColor(this.dna,this.evolSteps);this.evolSteps.forEach(s=>biomeMilestones.stepsDiscovered.add(s));}
  }

  determineMode(){
    // Colony-niche specialists — check before the generic archetypes they
    // branch off of, so a qualifying organism reads as the more specific
    // niche (urchin/crab/fish) rather than plain parasite/predator/omnivore.
    if(this.evolSteps.has('urchin')&&this.sz<7)return'urchin';
    if(this.evolSteps.has('crab')&&this.sz<8)return'crab';
    if(this.evolSteps.has('fish'))return'fish';
    if(this.evolSteps.has('parasitic')&&this.sz<5.5)return'parasite';
    if(this.evolSteps.has('ambush'))return'ambush';
    if(this.evolSteps.has('predatory'))return'predator';
    if(this.evolSteps.has('herbivore'))return'herbivore';
    // Commune — sessile AND armored enough to hold a defensive cluster.
    // Without this, mode never becomes 'commune', so detectReefs() never
    // finds any commune organisms, biomeMilestones.communeFormed never
    // fires, and the Bowl→Tank biome expansion (which requires it) can
    // never happen — the world gets permanently stuck at Bowl.
    if(this.evolSteps.has('sessile')&&this.dna.armor>.48)return'commune';
    if(this.evolSteps.has('toothed'))return'omnivore';
    return'grazer';
  }

  effectiveSense(){
    // Boost sense in early biomes so organisms can find food
    return this.dna.sense*(biomeIdx===0?5:biomeIdx===1?2.5:1);
  }
  effectiveSpeed(){
    let s=this.dna.speed*1.5;
    if(this.mode==='herbivore'){
      s*=.28;if(this.digestTimer>0)s*=.45;s=Math.min(s,.75);
    }
    if(this.mode==='ambush')s=Math.min(s,.5);
    // Biological trade-offs — can't max everything
    // Giant organisms are slow — mass costs mobility
    if(this.sz>9)s*=Math.max(.22,1-(this.sz-9)*.09);
    // Heavy armor costs speed — weight and rigidity
    if(this.dna.armor>.35)s*=Math.max(.38,1-(this.dna.armor-.35)*.55);
    // Giant + armored = very slow — pick one
    if(this.sz>8&&this.dna.armor>.4)s*=.45; // ambush predators barely move
    // Unadapted organisms move slower under deep water pressure
    if(this.y>WH*.58&&!this.evolSteps.has('deep_adapted')){
      const deepness=Math.max(0,(this.y/WH-.58)/.42);
      s*=Math.max(.25,1-deepness*.72);
    }
    s*=this.packBonus||1;
    // Parasite load slows large organisms — more passengers, more drag
    if(this.parasiteLoad>0&&this.sz>4){
      const maxLoad=Math.floor(this.sz/2); // bigger = can carry more
      const loadFrac=Math.min(1,this.parasiteLoad/Math.max(1,maxLoad));
      s*=Math.max(.08,1-loadFrac*.85); // up to 92% speed reduction at full load
    }
    if(this.mode==='commune')s*=.4;
    s*=(1-this.dna.armor*.15);
    return s;
  }

  communeDefenseOf(prey){
    if(prey.communeBonus>0)return prey.communeBonus;
    return 0;
  }

  // ── AMBUSH ────────────────────────────────────────────────
  behaveAmbush(){
    // Drift slowly toward best ambush position (vent or dense grass edge or rock edge)
    if(!this.ambushSpot||Math.random()<.002){
      // Find nearest vent or dense grass
      let best=null,bestScore=0;
      for(const v of vents){const dx=v.x-this.x,dy=v.y-this.y,d=Math.sqrt(dx*dx+dy*dy);const s=1/(d+100);if(s>bestScore){bestScore=s;best={x:v.x,y:v.y};}}
      for(const gp of grassPatches){if(gp.density>.5){const dx=gp.x-this.x,dy=gp.y-this.y,d=Math.sqrt(dx*dx+dy*dy);const s=gp.density/(d+100);if(s>bestScore){bestScore=s;best={x:gp.x+Math.cos(Math.random()*Math.PI*2)*gp.r*.8,y:gp.y+Math.sin(Math.random()*Math.PI*2)*gp.r*.8};}}}
      this.ambushSpot=best||{x:this.x,y:this.y};
    }
    const ap=this.ambushSpot,dx=ap.x-this.x,dy=ap.y-this.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    if(d>40){this.vx+=dx/d*.25;this.vy+=dy/d*.25;}
    else{this.vx*=.35;this.vy*=.35;} // hold position — near-stationary

    // Strike range: anything that wanders within size*4
    const strikeR=this.sz*3.8;
    for(const o of OG.near(this.x,this.y,strikeR)){
      if(!o.alive||o.id===this.id||o.sz>this.sz*1.3)continue;
      const odx=o.x-this.x,ody=o.y-this.y,od=Math.sqrt(odx*odx+ody*ody)||1;
      if(od<this.sz+o.sz+5){
        // Burst damage — surprise attack
        const still=this.vx*this.vx+this.vy*this.vy<0.15;
        const surpriseMult=still?2.2:1.0;
        const arm=Math.min(.88,o.dna.armor*.6+o.communeBonus);
        const dmg=this.dna.aggr*this.sz*.18*(1-arm)*surpriseMult;
        o.energy-=dmg;o.hurt=14;this.energy+=dmg*.72;this.flash=6;
        this.ambushScore+=still?0.6:0.2;
        this.learnAggression(dmg);
        bloodSignals.push({x:o.x,y:o.y,str:o.dna.size,age:0,maxAge:220});
      }
    }
    this.fleeBehavior(); // ambush preds still flee larger threats
  }

  // ── FLEE ──────────────────────────────────────────────────
  fleeBehavior(){
    // Only true sessile commitment forfeits flight response — not just a creeping
    // anchor value. Without this, organisms lose flee ability at anchor>0.5 while
    // still climbing toward the 0.55 sessile threshold, leaving them defenseless
    // in a gap they haven't actually earned. Predators latch onto them and never
    // let go since the target can never move away — a feeding black hole.
    if(this.evolSteps.has('sessile'))return;
    let fx=0,fy=0,worstThreat=null,worstD=Infinity;
    for(const o of OG.near(this.x,this.y,this.dna.sense*.55)){
      if(!o.alive||o.id===this.id)continue;
      // Generic apex predator threatens anyone smaller; crab specifically
      // hunts urchin; large/medium fish specifically hunt crab. These are
      // exactly the roles applyColonyNavGate() size-gates around colonies,
      // so the refuge bias below always lines up with a real physical wall.
      const isGenPred=(o.mode==='predator'&&o.sz>this.sz*.7);
      const isCrabThreat=(o.mode==='crab'&&this.mode==='urchin');
      const isFishThreat=(o.mode==='fish'&&o.sz>=4&&this.mode==='crab');
      if(!isGenPred&&!isCrabThreat&&!isFishThreat)continue;
      const dx=this.x-o.x,dy=this.y-o.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      const str=Math.max(0,1-d/(this.dna.sense*.55));
      fx+=dx/d*str;fy+=dy/d*str;
      if(d<worstD){worstD=d;worstThreat=o;}
    }
    if(!fx&&!fy)return;
    // Refuge — if the closest threat is big enough to be physically
    // blocked from a colony's branches/lanes and we're not, run for the
    // colony instead of just running blind away from the threat.
    if(worstThreat&&worstThreat.sz>=7&&this.sz<7){
      let bestCol=null,bCd=this.dna.sense*this.dna.sense;
      for(const col of colonies){
        if(!col.alive)continue;
        const dx=col.x-this.x,dy=col.y-this.y,d2=dx*dx+dy*dy;
        if(d2<bCd){bCd=d2;bestCol=col;}
      }
      if(bestCol){
        const dx=bestCol.x-this.x,dy=bestCol.y-this.y,d=Math.sqrt(dx*dx+dy*dy)||1;
        fx+=dx/d*1.4;fy+=dy/d*1.4; // bias hard toward the refuge
      }
    }
    const fm=Math.sqrt(fx*fx+fy*fy)||1,spd=this.effectiveSpeed();
    this.vx+=fx/fm*spd*1.1*.3;this.vy+=fy/fm*spd*1.1*.3;
  }

  // ── GRAZER ────────────────────────────────────────────────
  behaveGrazer(){
    const senseR=this.effectiveSense();let best=null,bD2=senseR*senseR;
    for(const f of FG.near(this.x,this.y,senseR)){
      if(!f.alive)continue;const dx=f.x-this.x,dy=f.y-this.y,d2=dx*dx+dy*dy;if(d2<bD2){bD2=d2;best=f;}
    }
    if(best){
      const d=Math.sqrt(bD2)||1,spd=this.effectiveSpeed();
      this.vx+=(best.x-this.x)/d*spd*.22;this.vy+=(best.y-this.y)/d*spd*.22;
      if(d<this.sz+5){best.alive=false;const _fe=FOOD_E*(biomeIdx===0?6:biomeIdx===1?3:biomeIdx===2?1.5:1)*this.dna.effic*(1+this.dna.bite*.5);this.energy+=_fe;this.flash=8;this.hungerTicks=0;this.fullness+=1+this.dna.effic*.5;if(this.sz<this.dna.size)this.sz=Math.min(this.dna.size,this.sz+.005*this.dna.effic);}
    }else{this.wa+=(Math.random()-.5)*.44;this.vx+=Math.cos(this.wa)*.08;this.vy+=Math.sin(this.wa)*.08;}
    // Also test attacking smaller organisms (aggression-based discovery)
    if(this.dna.aggr>.38&&this.energy<this.maxE*.6&&this.dna.size>5.5)this.tryPredatoryAttack();
    this.fleeBehavior();
  }

  // ── PREDATOR ──────────────────────────────────────────────
  behavePredator(){
    let best=null,bD2=this.dna.sense*this.dna.sense;

    // Vulnerability scan — slow/loaded giants detectable at 3x normal sense range
    // Mob instinct: distress signals pull in multiple predators simultaneously
    const extRange=this.dna.sense*3;
    for(const o of OG.near(this.x,this.y,extRange)){
      if(!o.alive||o.id===this.id)continue;
      const vel=Math.sqrt(o.vx*o.vx+o.vy*o.vy);
      const isVulnerable=(o.parasiteLoad>2&&o.dna.size>6)  // parasite loaded
                       ||(vel<0.15&&o.energy<o.maxE*.3);   // slow AND low energy
      if(!isVulnerable)continue;
      // Even giants become viable prey when crippled
      const dx=o.x-this.x,dy=o.y-this.y,d2=dx*dx+dy*dy;
      if(d2<extRange*extRange&&d2<bD2){bD2=d2;best=o;}
    }

    // Standard prey detection (normal range)
    for(const o of OG.near(this.x,this.y,this.dna.sense)){
      if(!o.alive||o.id===this.id||o.inBall)continue;
      if(o.sz>this.sz*1.5&&(o.parasiteLoad||0)<2)continue; // skip healthy giants
      const cover=grassCoverAt(o.x,o.y);
      const isStillAmbush=o.evolSteps&&o.evolSteps.has('ambush')&&o.vx*o.vx+o.vy*o.vy<0.12;
      const detectMult=isStillAmbush?.35:1;
      const effectiveDist=Math.sqrt((o.x-this.x)**2+(o.y-this.y)**2)*(1+cover)/detectMult;
      if(effectiveDist<Math.sqrt(bD2)){bD2=effectiveDist*effectiveDist;best=o;}
    }
    // Blood signal attraction — extends detection
    if(!best){
      for(const sig of bloodSignals){
        const fade=1-sig.age/sig.maxAge;
        const dx=sig.x-this.x,dy=sig.y-this.y,d2=dx*dx+dy*dy;
        const detectR=this.dna.sense*(1+fade*.6);
        if(d2<detectR*detectR){
          const d=Math.sqrt(d2)||1;
          this.vx+=dx/d*this.dna.speed*.18*fade;this.vy+=dy/d*this.dna.speed*.18*fade;
        }
      }
    }
    // Pack bonus: faster when hunting with others
    const packNearby=OG.near(this.x,this.y,280).filter(o=>o.alive&&o!==this&&o.mode==='predator').length;
    // Mob bonus stacks higher when hunting a vulnerable giant
    const huntingVulnerable=best&&(best.parasiteLoad>2||Math.sqrt(best.vx*best.vx+best.vy*best.vy)<0.2);
    this.packBonus=huntingVulnerable?1+Math.min(packNearby,5)*.18:1+Math.min(packNearby,3)*.12;

    if(best){
      const d=Math.sqrt((best.x-this.x)**2+(best.y-this.y)**2)||1;
      const spd=this.effectiveSpeed();
      this.vx+=(best.x-this.x)/d*spd*.28;this.vy+=(best.y-this.y)/d*spd*.28;
      if(d<this.sz+best.sz+2){
        const arm=Math.min(.88,best.dna.armor*.6+this.communeDefenseOf(best));
        const sizeFactor=clamp(this.sz/best.sz,.3,2.5);
        // Mob bonus — slow/loaded prey is easier to rip into
        const bestVel=Math.sqrt(best.vx*best.vx+best.vy*best.vy);
        const vulnMult=1+((best.parasiteLoad||0)>2?.8:0)+(bestVel<0.2&&best.energy<best.maxE*.4?.5:0);
        const dmg=sizeFactor*this.dna.aggr*1.2*(1-arm)*vulnMult;
        if(dmg>0.01){
          best.energy-=dmg;best.hurt=10;best.hungerTicks=999;this.energy+=dmg*.7;this.flash=5;this.hungerTicks=0;this.predScore+=.3;
          this.learnAggression(dmg);
          bloodSignals.push({x:best.x,y:best.y,str:best.dna.size*vulnMult,age:0,maxAge:200});
          if(vulnMult>1.5&&Math.random()<.02)
            showTicker(`⟡ Mob attack — size ${best.sz.toFixed(1)} giant overwhelmed`);
        }
      }
    }else{
      this.behaveGrazerFoodOnly();this.tryPredatoryAttack();
    }
    this.fleeBehavior();
  }

  // ── PARASITE ──────────────────────────────────────────────
  behaveParasite(){
    // Seek large hosts — prefers anchored communes
    let best=null,bD2=this.dna.sense*this.dna.sense,bestScore=-1;
    for(const o of OG.near(this.x,this.y,this.dna.sense)){
      if(!o.alive||o.id===this.id)continue;
      if(o.sz<this.sz*2.2)continue;
      const dx=o.x-this.x,dy=o.y-this.y,d2=dx*dx+dy*dy;
      if(d2>bD2)continue;
      // Score: prefer anchored (can't flee), punish high armor
      const score=(o.dna.anchor*.8+.2)*(1-o.dna.armor*.5)/(Math.sqrt(d2)||1);
      if(score>bestScore){bestScore=score;bD2=d2;best=o;}
    }
    if(best){
      const d=Math.sqrt(bD2)||1,spd=this.effectiveSpeed();
      this.vx+=(best.x-this.x)/d*spd*1.4*.28;this.vy+=(best.y-this.y)/d*spd*1.4*.28;
      if(d<this.sz+best.sz+3){
        const armorBlock=best.dna.armor>.42-this.dna.adhes*.25;
        // Adhesion only works for small organisms — size 7+ can't grip effectively
        // Grip scales with size ratio — parasites need host much larger than themselves
        const sizeRatio=best.sz/Math.max(1,this.sz);
        const gripFactor=Math.max(0,Math.min(1,(sizeRatio-1)/3))*(1-(this.sz-2.5)/5);
        // Host can shake off parasites if already heavily loaded relative to size
        const maxLoad=Math.floor(best.dna.size/2);
        const overloaded=best.parasiteLoad>=maxLoad&&Math.random()<.3;
        if(!armorBlock&&gripFactor>.05&&!overloaded){
          const trapped=best.evolSteps.has('sessile');
          const drain=this.dna.adhes*.22*(trapped?1.55:1)*gripFactor;
          best.energy-=drain;best.hurt=6;
          this.energy+=drain*.72;this.flash=3;this.hungerTicks=0;this.paraScore+=trapped?.35:.2;
          best.parasiteLoad=(best.parasiteLoad||0)+1; // accumulate load on host
          // Heavily loaded hosts leak strong blood signals — calls in predators
          if(best.parasiteLoad>2&&tick%12===0)
            bloodSignals.push({x:best.x,y:best.y,str:best.dna.size*1.5,age:0,maxAge:300});
        }
      }
    }else{this.wa+=(Math.random()-.5)*.5;this.vx+=Math.cos(this.wa)*.09;this.vy+=Math.sin(this.wa)*.09;}
  }

  // ── HERBIVORE ─────────────────────────────────────────────
  behaveHerbivore(){
    let bestGP=null,bestD=999999;
    for(const gp of grassPatches){
      if(gp.density<.12)continue;
      const dx=gp.x-this.x,dy=gp.y-this.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<bestD){bestD=d;bestGP=gp;}
    }
    if(bestGP){
      const spd=this.effectiveSpeed();
      const d=bestD||1;
      this.vx+=(bestGP.x-this.x)/d*spd*.18;this.vy+=(bestGP.y-this.y)/d*spd*.18;
      if(bestD<bestGP.r+this.sz+5&&this.digestTimer===0){
        // One bite per digestion cycle — max 6% of current density, never more than 0.012
        const eaten=Math.min(.012, bestGP.density*.06);
        bestGP.density=Math.max(0,bestGP.density-eaten);
        this.digestTimer=95; // ticks before next bite
        this.digestEnergy=eaten*90*this.dna.effic; // energy released gradually
        this.flash=4;
      }
    }else{this.wa+=(Math.random()-.5)*.3;this.vx+=Math.cos(this.wa)*.06;this.vy+=Math.sin(this.wa)*.06;}
    // Herbivores accumulate grass time
    for(const gp of grassPatches){if(gp.density>.25&&gp.coverAt(this.x,this.y)>.0)this.grassTicks++;}
    this.fleeBehavior();
  }

  behaveGrazerFoodOnly(){
    let best=null,bD2=this.dna.sense*this.dna.sense;
    for(const f of FG.near(this.x,this.y,this.dna.sense)){
      if(!f.alive)continue;const dx=f.x-this.x,dy=f.y-this.y,d2=dx*dx+dy*dy;if(d2<bD2){bD2=d2;best=f;}
    }
    if(best){
      const d=Math.sqrt(bD2)||1,spd=this.effectiveSpeed();
      this.vx+=(best.x-this.x)/d*spd*.2;this.vy+=(best.y-this.y)/d*spd*.2;
      if(d<this.sz+5){best.alive=false;const _fe=FOOD_E*(biomeIdx===0?6:biomeIdx===1?3:biomeIdx===2?1.5:1)*this.dna.effic*(1+this.dna.bite*.5);this.energy+=_fe;this.flash=8;this.hungerTicks=0;this.fullness+=1+this.dna.effic*.5;if(this.sz<this.dna.size)this.sz=Math.min(this.dna.size,this.sz+.005*this.dna.effic);}
    }
  }


  // ── URCHIN — slow colony grazer, spiny armor ──────────────────
  behaveUrchin(){
    // Find nearest colony and creep toward it
    let best=null,bD=this.dna.sense*this.dna.sense*4;
    for(const col of colonies){
      if(!col.alive)continue;
      const dx=col.x-this.x,dy=col.y-this.y,d2=dx*dx+dy*dy;
      if(d2<bD){bD=d2;best=col;}
    }
    if(best){
      const d=Math.sqrt(bD)||1;
      const spd=this.effectiveSpeed();
      this.vx+=(best.x-this.x)/d*spd*.15;
      this.vy+=(best.y-this.y)/d*spd*.15;
      // Feed when in contact — urchins are the efficient colony feeders.
      // Paced by colBiteCooldown — was landing a full bite every single
      // tick of contact, which could chew through a colony's hex cells
      // in well under a second even from one lone organism. Also only
      // feeds if actually hungry — the intent is feeding, not killing,
      // so a satiated urchin leaves the colony alone.
      if(d<best.radius+this.sz+3&&this.colBiteCooldown<=0&&this.energy<this.maxE*.9){
        const bite=this.sz*0.055*this.dna.effic;
        if(bite>0&&best.energy>0){
          best.takeDamage(bite,this);
          this.hungerTicks=0;this.fullness+=1.2;
          this.colBiteCooldown=22;
        }
      }
    } else {
      this.wa+=(Math.random()-.5)*.3;
      this.vx+=Math.cos(this.wa)*.04;this.vy+=Math.sin(this.wa)*.04;
    }
  }

  // ── CRAB — favors urchin, falls back to colony ────────────────
  behaveCrab(){
    // Urchin is the preferred prey; only nibbles a colony directly when
    // there's no urchin around to hunt instead.
    let bestPrey=null,bD=this.dna.sense*this.dna.sense;
    for(const o of OG.near(this.x,this.y,this.dna.sense)){
      if(!o.alive||o.mode!=='urchin')continue;
      const dx=o.x-this.x,dy=o.y-this.y,d2=dx*dx+dy*dy;
      if(d2<bD){bD=d2;bestPrey=o;}
    }
    if(bestPrey){
      const d=Math.sqrt(bD)||1;
      const spd=this.effectiveSpeed();
      this.vx+=(bestPrey.x-this.x)/d*spd*.25;
      this.vy+=(bestPrey.y-this.y)/d*spd*.25;
      if(d<this.sz+bestPrey.sz+2){
        const arm=Math.min(.7,bestPrey.dna.armor*.5);
        const dmg=this.dna.aggr*this.sz*0.08*(1-arm);
        if(dmg>0){
          bestPrey.energy-=dmg;bestPrey.hurt=8;
          this.energy+=dmg*.65;this.hungerTicks=0;this.fullness+=0.9;
          this.learnAggression(dmg);
        }
      }
    } else {
      // Nothing to grab — nibble colony as fallback
      let bestCol=null,bCd=this.dna.sense*this.dna.sense*.5;
      for(const col of colonies){
        if(!col.alive)continue;
        const dx=col.x-this.x,dy=col.y-this.y,d2=dx*dx+dy*dy;
        if(d2<bCd){bCd=d2;bestCol=col;}
      }
      if(bestCol){
        const d=Math.sqrt(bCd)||1;
        this.vx+=(bestCol.x-this.x)/d*this.effectiveSpeed()*.12;
        this.vy+=(bestCol.y-this.y)/d*this.effectiveSpeed()*.12;
        if(d<bestCol.radius+this.sz+2&&this.colBiteCooldown<=0&&this.energy<this.maxE*.9){
          const bite=this.sz*0.025;
          bestCol.takeDamage(bite,this);
          this.hungerTicks=0;this.fullness+=0.4;
          this.colBiteCooldown=32;
        }
      } else {
        this.wa+=(Math.random()-.5)*.4;
        this.vx+=Math.cos(this.wa)*.06;this.vy+=Math.sin(this.wa)*.06;
      }
    }
  }

  // ── FISH — large/medium favor crab, fall back to colony; ─────
  // small fish don't hunt at all, they're just grazers with the fish label
  behaveFish(){
    if(this.sz<4){
      this.behaveGrazerFoodOnly();
      this.fleeBehavior();
      return;
    }
    let best=null,bD=this.dna.sense*this.dna.sense;
    for(const o of OG.near(this.x,this.y,this.dna.sense)){
      if(!o.alive||o.mode!=='crab')continue;
      const dx=o.x-this.x,dy=o.y-this.y,d2=dx*dx+dy*dy;
      if(d2<bD){bD=d2;best=o;}
    }
    if(best){
      const d=Math.sqrt(bD)||1;
      const spd=this.effectiveSpeed();
      this.vx+=(best.x-this.x)/d*spd*.32;
      this.vy+=(best.y-this.y)/d*spd*.32;
      if(d<this.sz+best.sz+2){
        const arm=Math.min(.6,best.dna.armor*.5);
        const dmg=this.sz*0.07*(1-arm)*this.dna.aggr;
        if(dmg>0){
          best.energy-=dmg;best.hurt=10;
          this.energy+=dmg*.7;this.hungerTicks=0;this.fullness+=1.0;
          this.learnAggression(dmg);
          bloodSignals.push({x:best.x,y:best.y,str:dmg*2,age:0,maxAge:180});
        }
      }
      this.fleeBehavior();
      return;
    }
    // No crab nearby — nibble a colony as fallback
    let bestCol=null,bCd=this.dna.sense*this.dna.sense*.5;
    for(const col of colonies){
      if(!col.alive)continue;
      const dx=col.x-this.x,dy=col.y-this.y,d2=dx*dx+dy*dy;
      if(d2<bCd){bCd=d2;bestCol=col;}
    }
    if(bestCol){
      const d=Math.sqrt(bCd)||1;
      this.vx+=(bestCol.x-this.x)/d*this.effectiveSpeed()*.15;
      this.vy+=(bestCol.y-this.y)/d*this.effectiveSpeed()*.15;
      if(d<bestCol.radius+this.sz+2&&this.colBiteCooldown<=0&&this.energy<this.maxE*.9){
        const bite=this.sz*0.02;
        bestCol.takeDamage(bite,this);
        this.hungerTicks=0;this.fullness+=0.35;
        this.colBiteCooldown=35;
      }
    } else {
      // Nothing to hunt at all — fall back to grazing
      this.behaveGrazerFoodOnly();
    }
    this.fleeBehavior();
  }

  tryPredatoryAttack(){
    // Aggressive organisms test attacking nearby organisms — discovery mechanism
    for(const o of OG.near(this.x,this.y,this.sz*4)){
      if(!o.alive||o.id===this.id)continue;
      const dx=o.x-this.x,dy=o.y-this.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      if(d<this.sz+o.sz+1){
        // Can attack if smaller or similar size
        if(o.sz<this.sz*1.3){
          const dmg=this.dna.aggr*.4*(1-o.dna.armor*.5);
          if(dmg>.005){o.energy-=dmg;o.hurt=5;this.energy+=dmg*.5;this.predScore+=.15;this.learnAggression(dmg);}
        }
        // Parasitic test — try draining much larger organisms
        if(o.sz>this.sz*2&&this.dna.adhes>.2){
          if(o.dna.armor<.42-this.dna.adhes*.2){
            const drain=this.dna.adhes*.15;
            o.energy-=drain;o.hurt=4;this.energy+=drain*.6;this.paraScore+=.12;
          }
        }
      }
    }
  }

  // ── JET ────────────────────────────────────────────────────
  fireJet(){
    this.mFill+=this.dna.mantle;
    if(this.mFill<70)return;
    this.mFill=0;
    let jx=Math.random()-.5,jy=Math.random()-.5;
    // Aim at nearest food or prey
    let target=null,tD2=this.dna.sense*this.dna.sense;
    for(const f of FG.near(this.x,this.y,this.dna.sense)){if(!f.alive)continue;const dx=f.x-this.x,dy=f.y-this.y,d2=dx*dx+dy*dy;if(d2<tD2){tD2=d2;target={x:f.x,y:f.y};}}
    if(target&&this.dna.nozzle>.08){const d=Math.sqrt(tD2)||1;jx=(target.x-this.x)/d*this.dna.nozzle+jx*(1-this.dna.nozzle);jy=(target.y-this.y)/d*this.dna.nozzle+jy*(1-this.dna.nozzle);}
    const jm=Math.sqrt(jx*jx+jy*jy)||1,force=this.dna.jet*this.dna.mantle*4;
    this.vx+=jx/jm*force;this.vy+=jy/jm*force;this.energy-=force*.38;
    if(particles.length<180){const[h,s,l]=this.hsv;particles.push({x:this.x-jx/jm*this.sz*1.3,y:this.y-jy/jm*this.sz*1.3,vx:-jx/jm*force*.45,vy:-jy/jm*force*.45,life:20,max:20,h,s,l});}
  }

  // ── UPDATE ─────────────────────────────────────────────────
  update(){
    this.age++;this.parasiteLoad=0;
    if(this.colBiteCooldown>0)this.colBiteCooldown--;
    if(this.age%30===0)this.recalcSteps();
    // Urchin and crab stay small permanently — without this, ordinary
    // feeding growth (this.sz creeping toward dna.size every bite) would
    // eventually push them past the size where determineMode() still
    // recognizes the niche, so the whole point of a SMALL specialist
    // would quietly erode over its lifetime.
    if((this.evolSteps.has('urchin')||this.evolSteps.has('crab'))&&this.sz>6.5)this.sz=6.5;
    this.mode=this.determineMode();

    if(this.inBall)return; // ball handles position
    // ── CONTACT FEEDING — passive energy transfer on overlap ──────────
    // Happens in dense populations before teeth; omnivore foundation
    // Teeth fire for ANY organism — universal faster feeding
    if(this.dna.bite>.04&&Math.random()<.05){
      for(const o of OG.near(this.x,this.y,this.sz*1.8)){
        if(!o.alive||o.id===this.id)continue;
        const dx=o.x-this.x,dy=o.y-this.y;
        const d=Math.sqrt(dx*dx+dy*dy)||1;
        if(d<this.dna.size+o.dna.size){ // actual overlap
          // Bite damage scales with bite trait — works for all modes
          const arm=Math.min(.75,o.dna.armor*.5+(o.communeBonus||0));
          const dmg=this.dna.bite*(this.evolSteps.has('toothed')?2.2:0.8)*(1-arm);
          o.energy-=dmg; o.hurt=5;
          this.energy+=dmg*.7; this.hungerTicks=0;
          this.contactScore+=.2;
          // Ambush bootstrap — behaveAmbush() only runs once mode is already
          // 'ambush', which only happens once ambushScore>=10: a deadlock that
          // meant no organism could ever earn its way in. Any organism that
          // happens to be nearly still when it lands a bite is behaving like
          // an ambush hunter in that moment, so it earns toward the step too.
          if(this.vx*this.vx+this.vy*this.vy<0.1)this.ambushScore=(this.ambushScore||0)+0.15;
          this.learnAggression(dmg);
          // Blood taste — the moment that changes everything
          if(dmg>.08&&o.hurt>0){
            this.predScore+=.25; // blood feeds predatory drive
            if(Math.random()<.015){
              // First real blood taste fires an event
              if(!this._tasted){
                this._tasted=true;
                showTicker(`↯ Blood taste — Gen ${this.gen} remembers`);
              }
            }
            bloodSignals.push({x:o.x,y:o.y,str:dmg*3,age:0,maxAge:140});
          }
          break;
        }
      }
    }
    switch(this.mode){
      case'predator': this.behavePredator();break;
      case'ambush':   this.behaveAmbush();break;
      case'parasite': this.behaveParasite();break;
      case'herbivore':this.behaveHerbivore();break;
      case'urchin':   this.behaveUrchin();break;
      case'crab':     this.behaveCrab();break;
      case'fish':     this.behaveFish();break;
      default:        this.behaveGrazer();break;
    }

    if(this.dna.mantle>.12&&this.dna.jet>.07)this.fireJet();

    // GrassTicks only build when trapped in dense grass WITH depleted local food
    // Aggressive/predatory organisms are hunters not grazers — excluded
    if(this.sz>7&&this.mode!=='herbivore'&&!this.evolSteps.has('aggressive')&&!this.evolSteps.has('predatory')){
      const localFood=FG.near(this.x,this.y,110).filter(f=>f.alive).length;
      if(localFood<3){
        for(const gp of grassPatches){
          if(gp.density>.42&&gp.coverAt(this.x,this.y)>0)this.grassTicks+=.5;
        }
      }
    }

    // Physics
    this.vx*=.82;this.vy*=.82;
    const spd=this.effectiveSpeed(),mag=Math.sqrt(this.vx*this.vx+this.vy*this.vy);
    if(mag>spd+2){this.vx=this.vx/mag*(spd+2);this.vy=this.vy/mag*(spd+2);}

    // Current (anchor + size reduce drift; large commune members nearly immune)
    const cur=currentAt(this.x,this.y);
    const anchorR=this.dna.anchor*.78,sizeR=clamp((this.dna.size-2)/14*.35,0,.35);
    const drift=Math.max(.02,1-anchorR-sizeR);
    this.vx+=cur.vx*drift;this.vy+=cur.vy*drift;

    this.x+=this.vx;this.y+=this.vy;
    const r=this.sz;
    if(this.x<r){this.x=r;this.vx=Math.abs(this.vx)*.5;}else if(this.x>activeW-r){this.x=activeW-r;this.vx=-Math.abs(this.vx)*.5;}
    if(this.y<r){this.y=r;this.vy=Math.abs(this.vy)*.5;}else if(this.y>activeH-r){this.y=activeH-r;this.vy=-Math.abs(this.vy)*.5;}
    applyTerrain(this);
    reefCollide(this);
    applyColonyNavGate(this);

    // Energy cost — large organisms and communes cost more
    const depth=this.y/WH,tempMod=1+Math.max(0,1-depth*4)*.2-depth*.12;
    const sizeCost=this.sz/10;
    // Base metabolic cost
    const biomeMetabScale=biomeIdx<=1?.02:biomeIdx===2?.65:1;
    this.energy-=(this.dna.speed*sizeCost*.012*tempMod+this.dna.armor*.007)*biomeMetabScale;
    // Waste/excretion — every living organism constantly sheds ammonia/waste
    // back into the water regardless of biome-stage energy dampening (that
    // scale only throttles the organism's own cost, not real biology).
    // Bigger organisms and denser populations return more nutrients — this
    // is what colonies actually filter-feed on.
    dumpWaste(this.x,this.y,0.0006+this.sz*0.00014);
    // Dead-zone choking — a bloom-collapse zone has crashed dissolved
    // oxygen locally. Free-swimming organisms can at least try to get out
    // (unlike a colony), but sitting in one still costs real energy.
    const hx=hypoxiaAt(this.x,this.y);
    if(hx>0)this.energy-=hx*this.maxE*0.002;
    // Giant upkeep — exponential, must eat constantly or die
    if(this.sz>7&&biomeIdx>=2)this.energy-=Math.pow(this.sz-7,1.8)*.008*ADM.upkeepMult;
    // Sprint cost — energy burned proportional to actual velocity
    const vel=Math.sqrt(this.vx*this.vx+this.vy*this.vy);
    if(biomeIdx>=2){
      const sprintCost=Math.pow(vel,1.6)*sizeCost*.018*ADM.sprintMult*(biomeIdx===2?.5:1);
      this.energy-=sprintCost;
    }
    // Surplus tax — organism at near-max energy must spend it or lose it.
    // Prevents island clingers from sitting at full energy indefinitely
    // doing nothing until their age timer runs out. Applies in ALL biomes.
    if(this.energy>this.maxE*.88){
      const surplus=(this.energy-this.maxE*.88)/this.maxE;
      this.energy-=surplus*0.18; // burns off ~18% of the surplus per tick
    }
    // Crowding penalty — too many organisms in the same small area means
    // less food per organism. Strong enough to push idle clingers to move.
    if(tick%15===0){
      const crowdR=this.sz*5+30;
      let neighbors=0;
      for(const o of OG.near(this.x,this.y,crowdR)){
        if(o.id!==this.id&&o.alive)neighbors++;
      }
      if(neighbors>4){
        // More than 4 neighbors in close range — competition drains energy
        const crowdPenalty=(neighbors-4)*0.018*(1-Math.min(.9,this.dna.effic*.5));
        this.energy=Math.max(0,this.energy-crowdPenalty);
      }
    }
    // Parasite load adds extra energy drain — each parasite costs the host
    if(this.parasiteLoad>1){
      const extraDrain=(this.parasiteLoad-1)*.045*this.sz*.1;
      this.energy-=extraDrain;
    }
    this.energy=Math.min(this.maxE,this.energy);
    // No energy floor — if you can't find food you die. That's evolution.

    if(this.flash>0)this.flash--;if(this.hurt>0)this.hurt--;
    if(this.mateCooldown>0)this.mateCooldown--;if(this.mating>0)this.mating--;
    // Gradual digestion energy release
    if(this.digestTimer>0){
      this.digestTimer--;
      this.energy+=this.digestEnergy/95;
      this.hungerTicks=0; // digesting = still nourished
    }

    // Deep water survival — unadapted organisms suffer pressure and cold
    // Drives evolution of efficient+deep_adapted lineages, keeps early orgs in shallow
    const depthFrac=this.y/WH;
    if(depthFrac>0.56&&biomeIdx>=2&&BIOME_STAGES[biomeIdx].depth){
      this.deepTicks++;
      if(!this.evolSteps.has('deep_adapted')){
        const deepness=Math.max(0,(depthFrac-0.56)/0.44);
        this.energy-=deepness*deepness*0.055; // escalating pressure/cold drain
        // Surface urge — gentle upward push when hurting in deep water
        if(deepness>.5&&this.energy<this.maxE*.35)this.vy-=deepness*.18;
      }
    } else {
      this.deepTicks=Math.max(0,this.deepTicks-.5);
    }

    // Vent proximity — superheated water is lethal without adaptation
    // Must be deep_adapted first, then earn vent_adapted through survival
    {
      let nearVent=false,closestVentD=Infinity;
      for(const v of vents){
        const dx=this.x-v.x,dy=this.y-v.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<v.r*1.4){nearVent=true;closestVentD=Math.min(closestVentD,d/v.r);break;}
      }
      if(nearVent){
        const heatProximity=Math.max(0,1-closestVentD); // 0 at edge, 1 at centre
        if(this.evolSteps.has('vent_adapted')){
          this.ventTicks++; // adapted — thrive here
        } else if(this.evolSteps.has('deep_adapted')){
          // Deep adapted but not vent adapted — partial tolerance
          // Survive edge heat, lethal at centre
          this.energy-=heatProximity*heatProximity*.12;
          if(heatProximity<.55)this.ventTicks+=.4; // building tolerance at safe distance
        } else {
          // No adaptation — rapid heat death near vent
          this.energy-=heatProximity*heatProximity*.28;
          // Strong repulsion — flee the heat
          for(const v of vents){
            const dx=this.x-v.x,dy=this.y-v.y,d=Math.sqrt(dx*dx+dy*dy)||1;
            if(d<v.r*1.4){this.vx+=dx/d*.8;this.vy+=dy/d*.8;break;}
          }
        }
      }
    }

    // Fullness bleeds when stressed — energy floor prevents division under pressure
    if(this.energy<this.maxE*.25&&this.fullness>0)
      this.fullness=Math.max(0,this.fullness-.8);

    // Starvation — real consequences everywhere, grace period scales with biome
    this.hungerTicks++;
    const graceScale=biomeIdx===0?3:biomeIdx===1?2:biomeIdx===2?1.4:1;
    const ht=Math.max(0,this.hungerTicks-ADM.starvGrace*graceScale);
    if(ht>0)this.energy-=Math.pow(ht/300,2)*.06; // escalates — find food or die
    if(this.energy<=0)this.alive=false;
    // Catabolism — sustained starvation burns body mass
    if(this.hungerTicks>400&&this.sz>2.2)this.sz=Math.max(2.2,this.sz-.001);

    // Sessile adaptation — sustained stillness + food security grows anchor trait
    // An organism that stops moving and doesn't starve is learning something.
    // Thresholds are deliberately long — sessility is a life strategy not a habit.
    // ~2400 ticks of near-zero movement before anchor starts climbing (~40s at 1x, ~10s at 4x)
    // ~5000 ticks total to reach sessile step (~83s at 1x, ~21s at 4x)
    // Velocity threshold is tight — must be almost completely motionless, not just slow
    {
      const vel=Math.sqrt(this.vx*this.vx+this.vy*this.vy);
      const wellFed=this.energy>this.maxE*.45&&this.hungerTicks<ADM.starvGrace*graceScale*.5;
      if(vel<0.055&&wellFed&&this.mode!=='predator'&&this.mode!=='parasite'){
        this.stillTicks=(this.stillTicks||0)+1;
        if(this.stillTicks>2400&&this.dna.anchor<0.98){
          this.dna.anchor=Math.min(0.98,this.dna.anchor+0.0002);
          if(this.dna.anchor>0.55&&!this.evolSteps.has('sessile')){
            this.recalcSteps();
            showTicker(`⟡ Sessile — Gen ${this.gen} takes root`);
          }
        }
      } else {
        // Movement or hunger drains the counter — must be genuinely sustained
        this.stillTicks=Math.max(0,(this.stillTicks||0)-5);
        if(vel>1.5&&this.dna.anchor>0.1)
          this.dna.anchor=Math.max(0.01,this.dna.anchor-0.0002);
      }
    }

    // Natural aging — cells die regardless of energy
    // Efficient cells live longer — direct selection pressure
    const ageLimit=this.maxAge*(0.7+this.dna.effic*.6);
    if(this.age>ageLimit)this.alive=false;
  }

  divide(){
    // Cell splits when sated — each half gets 50% energy, mutated DNA
    // No energy cost — the biomass is already there
    if(this.mateCooldown>0)return null;
    const halfE=this.energy*.5;
    this.energy=halfE;
    const a=Math.random()*Math.PI*2,d=this.sz*2;
    const childSteps=new Set([...this.evolSteps].filter(s=>
      ['predatory','parasitic','herbivore','contact_feeder','toothed','sessile'].includes(s)));
    const child=new Org(
      clamp(this.x+Math.cos(a)*d,5,activeW-5),
      clamp(this.y+Math.sin(a)*d,5,activeH-5),
      mutateDNA(this.dna),halfE,this.gen+1,childSteps,mutateAppendages(this.appendages)
    );
    child.maxAge=Math.floor(this.maxAge*(0.9+Math.random()*.2));
    child.sz=Math.max(2,this.sz*.35); // offspring born small regardless of parent's size
    // Sessile offspring inherit the tendency through DNA anchor value — no timer shortcut
    // They still have to prove the commitment themselves
    if(this.evolSteps.has('sessile')||this.dna.anchor>0.45)
      child.stillTicks=Math.floor((this.stillTicks||0)*.2); // small head start only
    // Hunting/parasitic/contact drive carries forward (partial) across
    // generations. Without this, predScore/paraScore/contactScore reset to
    // 0 on every single division — so every individual organism had to
    // independently rack up predScore>=40 from scratch AND simultaneously
    // roll rare speed>3.0 ("fast") and aggr>0.58 ("aggressive") mutations,
    // all within its own one lifetime, or predation could never be
    // discovered at all. This lets a lineage's tendency to bite/attack
    // actually accumulate the way its DNA already does, rather than every
    // generation starting over from zero.
    child.predScore=(this.predScore||0)*.35;
    child.paraScore=(this.paraScore||0)*.35;
    child.contactScore=(this.contactScore||0)*.35;
    return child;
  }
  reproduce(){
    const cost=this.dna.repro*.5;this.energy-=cost;
    const a=Math.random()*Math.PI*2,d=this.dna.size*2.5;
    // Inherit discovery steps to offspring
    const childSteps=new Set([...this.evolSteps].filter(s=>['predatory','parasitic','herbivore'].includes(s)));
    return new Org(clamp(this.x+Math.cos(a)*d,5,activeW-5),clamp(this.y+Math.sin(a)*d,5,activeH-5),mutateDNA(this.dna),cost*.85,this.gen+1,childSteps,mutateAppendages(this.appendages));
  }
}

// ═══════════════════════════════════════════════════════════
// BREEDING
// ═══════════════════════════════════════════════════════════
let matingLines=[];
function canBreed(a,b){
  if(a.evolSteps.size<3||b.evolSteps.size<3)return false;
  let shared=0;for(const s of a.evolSteps)if(b.evolSteps.has(s))shared++;
  if(shared<3)return false;
  return(a.evolSteps.size-shared)<=1&&(b.evolSteps.size-shared)<=1;
}
function tryMate(a,b){
  if(!canBreed(a,b))return null;
  if(a.mateCooldown>0||b.mateCooldown>0)return null;
  if(a.energy<a.dna.repro*.65||b.energy<b.dna.repro*.65)return null;
  const cost=Math.min(a.dna.repro,b.dna.repro)*.4;
  a.energy-=cost;b.energy-=cost;a.mateCooldown=220;b.mateCooldown=220;a.mating=14;b.mating=14;
  // Child inherits discovery steps from both parents
  const childSteps=new Set([...[...a.evolSteps,...b.evolSteps].filter(s=>['predatory','parasitic','herbivore'].includes(s))]);
  // Appendages inherit from both sides — either parent's structural mutations can pass on
  const combinedAppendages=new Set([...(a.appendages||[]),...(b.appendages||[])]);
  matingLines.push({x1:a.x,y1:a.y,x2:b.x,y2:b.y,life:18,max:18});
  biomeMilestones.sexualRepro=true;
  sexualBirths++;
  const child=new Org((a.x+b.x)*.5,(a.y+b.y)*.5,blendDNA(a.dna,b.dna),cost*.75,Math.max(a.gen,b.gen)+1,childSteps,mutateAppendages(combinedAppendages));
  // Same fix as divide() — carry forward part of both parents' hunting drive
  // instead of resetting to 0, otherwise predator discovery is practically
  // unreachable (see divide() for the full explanation).
  child.predScore=((a.predScore||0)+(b.predScore||0))*.5*.35;
  child.paraScore=((a.paraScore||0)+(b.paraScore||0))*.5*.35;
  child.contactScore=((a.contactScore||0)+(b.contactScore||0))*.5*.35;
  return child;
}
function findMate(o){
  if(!canBreed(o,o))return null; // quick self-check for step count
  const rng=o.dna.size*8;
  for(const other of OG.near(o.x,o.y,rng)){
    if(other.id===o.id||!other.alive||other.mateCooldown>0)continue;
    if(!canBreed(o,other))continue;
    const dx=other.x-o.x,dy=other.y-o.y;
    if(dx*dx+dy*dy<rng*rng)return other;
  }
  return null;
}

// ═══════════════════════════════════════════════════════════
// FOOD + VENT
// ═══════════════════════════════════════════════════════════
class Food{
  constructor(x,y){this.x=x!=null?x:Math.random()*WW;this.y=y!=null?y:Math.random()*WH;this.alive=true;}
  drift(){const c=currentAt(this.x,this.y);this.x=clamp(this.x+c.vx*.2,0,WW);this.y=clamp(this.y+c.vy*.15,0,WH);
    // Push out of BOTH rocks and islands. Previously only excluded `terrain`
    // (rocks) — islands were never checked, so food spawning inside an
    // island's solid radius stayed marooned there forever. Organisms can't
    // enter that radius either (see applyTerrain), so they'd swim up to the
    // island edge chasing food they could never reach, stall in a push/pull
    // equilibrium against the collision boundary, and starve — this is the
    // "sitting still near islands until they die" bug.
    for(const t of [...terrain,...islands]){const dx=this.x-t.x,dy=this.y-t.y,d=Math.sqrt(dx*dx+dy*dy)||1;if(d<t.r+4){this.x=t.x+(dx/d)*(t.r+4);this.y=t.y+(dy/d)*(t.r+4);}}}
}
class Vent{
  constructor(x,y){this.x=x;this.y=y;this.r=165;this.pulse=Math.random()*Math.PI*2;this.onTrack=false;}
  update(){
    this.pulse+=.024;
    // Vents pulse in cycles — active bursts then quiet periods
    // Forces organisms to move rather than park permanently
    if(!this.ventCycle)this.ventCycle=Math.floor(Math.random()*800);
    this.ventCycle++;
    const cyclePos=(this.ventCycle%600)/600;
    const active=cyclePos<ADM.ventActivity;
    if(active){
      // Food spawns at safe radius — only vent_adapted can get close enough to eat core
      const localFood=foods.filter(f=>f.alive&&Math.hypot(f.x-this.x,f.y-this.y)<this.r*2).length;
      if(localFood<12&&Math.random()<.22){
        // Core food (hot zone) vs edge food (accessible to deep_adapted)
        const coreSpawn=Math.random()<.4; // 40% spawns in hot core
        const r=coreSpawn?Math.random()*this.r*.45:(this.r*.55+Math.random()*this.r*.8);
        const a=Math.random()*Math.PI*2;
        foods.push(new Food(this.x+Math.cos(a)*r,this.y+Math.sin(a)*r));
      }
    }
  }
}

let terraformMode=false,terraformTool='rock',terraformRadius=180;

function placeTerrain(wx,wy){
  // Check unlock before placing
  if(terraformTool==='rock'&&!terraformUnlocked.rock){showTicker('× Rock not yet unlocked — grow population to 30');return;}
  if(terraformTool==='island'&&!terraformUnlocked.island){showTicker('× Island not yet unlocked — establish a colony first');return;}
  if(terraformTool==='vent'&&!terraformUnlocked.vent){showTicker('× Vent not yet unlocked — reach generation 8');return;}
  if(terraformTool==='shallow'&&!terraformUnlocked.shallow){showTicker('× Shallow not yet unlocked — evolve an urchin');return;}
  if(terraformTool==='waypoint'&&!terraformUnlocked.waypoint){showTicker('× Current not yet unlocked — reach Bowl biome');return;}
  if(terraformTool==='rock'){terrain.push({x:wx,y:wy,r:terraformRadius});seedGrassAround(wx,wy,terraformRadius,3);}
  else if(terraformTool==='island'){const ir=terraformRadius*.5;islands.push({x:wx,y:wy,r:ir});shallowZones.push({x:wx,y:wy,r:ir*3.2});seedGrassAround(wx,wy,ir*2,5);}
  else if(terraformTool==='vent'){const v=new Vent(wx,wy);v.r=terraformRadius*.9;vents.push(v);}
  else if(terraformTool==='shallow'){shallowZones.push({x:wx,y:wy,r:terraformRadius*1.4});seedGrassAround(wx,wy,terraformRadius,4);}
  else if(terraformTool==='waypoint'){
    surfaceWPs.push({x:wx,y:wy});
    buildCurrentField();
    const n=surfaceWPs.length;
    if(n<3)showTicker(`Current waypoint ${n} placed — need ${3-n} more to form a loop`);
    else showTicker(`Current loop updated — ${n} waypoints`);
  }
  else if(terraformTool==='remove'){
    let best=null,bD=999999;
    for(const t of terrain){const d=Math.hypot(wx-t.x,wy-t.y);if(d<t.r+30&&d<bD){bD=d;best={type:'rock',obj:t};}}
    for(const v of vents){const d=Math.hypot(wx-v.x,wy-v.y);if(d<120&&d<bD){bD=d;best={type:'vent',obj:v};}}
    for(const sz of shallowZones){const d=Math.hypot(wx-sz.x,wy-sz.y);if(d<sz.r&&d<bD){bD=d;best={type:'shallow',obj:sz};}}
    for(let i=0;i<surfaceWPs.length;i++){const d=Math.hypot(wx-surfaceWPs[i].x,wy-surfaceWPs[i].y);if(d<40&&d<bD){bD=d;best={type:'waypoint',idx:i};}}
    if(best){
      if(best.type==='rock')terrain=terrain.filter(t=>t!==best.obj);
      else if(best.type==='vent')vents=vents.filter(v=>v!==best.obj);
      else if(best.type==='shallow')shallowZones=shallowZones.filter(s=>s!==best.obj);
      else if(best.type==='waypoint'){surfaceWPs.splice(best.idx,1);buildCurrentField();}
    }
  }
}

    // True primordial: identical clones — only random mutation drives divergence from here

      dna.mantle=0;dna.jet=0;dna.nozzle=0;dna.armor=0;dna.anchor=0;dna.aggr=0;dna.adhes=0;}
    // Spread organisms across the active zone — prevent instant clustering
  const spawnX=clamp(50+Math.random()*(activeW-100),10,activeW-10);
  const spawnY=clamp(50+Math.random()*(activeH-100),10,activeH-10);
  orgs.push(new Org(spawnX,spawnY,dna,biomeIdx===0?120:40,1));
  }

    const y=Math.random()<.65?Math.random()*activeH*.38:Math.random()*activeH;

function initBiome(idx){
  biomeIdx=idx;
  const b=BIOME_STAGES[idx];
  activeW=b.w;activeH=b.h;
  // Rescale the default shallow zones to the current biome size so their
  // food/grass richness bonus is actually distributed across the area
  // being played in, not mostly stuck outside it. See DEFAULT_SHALLOW_FRACS.
  {
    let fi=0;
    for(const sz of shallowZones){
      if(!sz.isDefault)continue;
      const f=DEFAULT_SHALLOW_FRACS[fi++];
      if(!f)break;
      sz.x=activeW*f.fx;sz.y=activeH*f.fy;sz.r=activeW*f.fr;
    }
  }
  // Disable mechanics not yet unlocked
  if(!b.vents)vents=[];
  if(!b.grass)grassPatches=[];
  if(!b.current){surfaceWPs=[];currentField=null;}
  else buildCurrentField();
  // Reposition any terrain/organisms outside new zone
  for(const o of orgs){o.x=Math.min(o.x,activeW-20);o.y=Math.min(o.y,activeH-20);}
  for(const t of terrain){if(t.x>activeW||t.y>activeH){t.x=Math.random()*activeW*.8;t.y=Math.random()*activeH*.8;}}
  // Seed grass if unlocked
  if(b.grass)initGrass();
  // Set caps
  clampCam();
  showTicker(`◈ ${b.name} — ${b.milestones.length?b.milestones[0]:''}...`);
}

function checkBiomeMilestones(){
  if(biomeIdx>=BIOME_STAGES.length-1)return;
  const b=BIOME_STAGES[biomeIdx];
  let ready=false;
  if(b.key==='petri'){
    if(biomeMilestones.sexualRepro)biomeMilestones.pop30ticks++;
    else biomeMilestones.pop30ticks=0;
    if(!biomeMilestones.predatorEverEmerged&&orgs.some(o=>o.evolSteps.has('predatory')))biomeMilestones.predatorEverEmerged=true;
    ready=(biomeMilestones.sexualRepro&&biomeMilestones.pop30ticks>=500)||biomeMilestones.predatorEverEmerged;
  } else if(b.key==='bowl'){
    ready=biomeMilestones.communeFormed&&biomeMilestones.stepsDiscovered.size>=10;
  } else if(b.key==='tank'){
    if(orgs.filter(o=>o.alive&&o.mode==='predator').length>0)biomeMilestones.predatorFound=true;
    if(orgs.filter(o=>o.alive&&o.mode==='herbivore').length>0)biomeMilestones.herbivoreFound=true;
    if(biomeMilestones.predatorFound&&biomeMilestones.herbivoreFound)biomeMilestones.pop100ticks++;
    else biomeMilestones.pop100ticks=0;
    ready=biomeMilestones.predatorFound&&biomeMilestones.herbivoreFound&&biomeMilestones.pop100ticks>=2000;
  } else if(b.key==='pond'){
    ready=biomeMilestones.whaleFall&&biomeMilestones.deepAdapted;
  } else if(b.key==='lake'){
    const modes=new Set(orgs.filter(o=>o.alive).map(o=>o.mode));
    biomeMilestones.fullStack=['grazer','herbivore','predator','parasite','commune'].every(m=>modes.has(m));
    ready=biomeMilestones.fullStack;
  }
  if(ready&&!biomeExpanding)expandBiome();
}

function expandBiome(){
  biomeExpanding=true;biomeExpandT=0;
  const next=BIOME_STAGES[biomeIdx+1];
  biomeExpandFromW=activeW;biomeExpandFromH=activeH;
  biomeExpandToW=next.w;biomeExpandToH=next.h;
  showTicker(`◈ BIOME EXPANDING → ${next.name.toUpperCase()}`);
}

function updateBiomeExpansion(){
  if(!biomeExpanding)return;
  biomeExpandT+=.018;
  const t=Math.min(1,biomeExpandT);
  const ease=t<.5?2*t*t:(1-Math.pow(-2*t+2,2)/2);
  activeW=biomeExpandFromW+(biomeExpandToW-biomeExpandFromW)*ease;
  activeH=biomeExpandFromH+(biomeExpandToH-biomeExpandFromH)*ease;
  if(t>=1){
    biomeExpanding=false;
    biomeIdx++;
    const b=BIOME_STAGES[biomeIdx];
    if(b.vents&&vents.length===0)for(const[vx,vy]of DEFAULT_VENTS.slice(0,3))vents.push(new Vent(vx*activeW/WW,vy*activeH/WH));
    if(b.grass&&grassPatches.length<4)initGrass();
    if(b.current&&!currentField)buildCurrentField();
    showTicker(`◈ ${b.name.toUpperCase()} UNLOCKED — ${b.milestones.length?b.milestones[0]:'Explore...'}`);
  }
}

// ── Urchin/crab/fish are no longer pre-spawned specialists — they now
// emerge the same way predator/parasite/herbivore do: as evolutionary
// discoveries earned by ordinary organisms (see recalcSteps()). This
// function is kept only so any old call sites don't error; it does
// nothing now.
function spawnSpecialists(){}

function spawnFood(){
  const bCfg=BIOME_STAGES[biomeIdx];
  if(foods.length>=bCfg.maxFood)return;
  const isPetri=biomeIdx===0;
  const wx=Math.random()*activeW,wy=isPetri?Math.random()*activeH:(Math.random()<.65?Math.random()*activeH*.38:Math.random()*activeH);
  // Don't spawn food inside solid ground — organisms can't enter a rock's or
  // island's radius (see applyTerrain), so food placed inside one is
  // unreachable until drift() next evicts it. Skip this tick's spawn rather
  // than hand out bait nothing can reach.
  for(const t of terrain){const dx=wx-t.x,dy=wy-t.y;if(dx*dx+dy*dy<(t.r+4)*(t.r+4))return;}
  for(const isl of islands){const dx=wx-isl.x,dy=wy-isl.y;if(dx*dx+dy*dy<(isl.r+4)*(isl.r+4))return;}
  // Local density cap — prevent total clustering at islands/vents
  const localCount=foods.filter(f=>f.alive&&Math.abs(f.x-wx)<120&&Math.abs(f.y-wy)<120).length;
  if(localCount>18)return; // already rich here, spread elsewhere
  // Primary production — food-spawn rate is nutrient-limited growth
  // (Monod/Michaelis-Menten saturation kinetics), same shape real
  // phytoplankton growth follows: scales with local dissolved nutrient
  // concentration and saturates rather than growing without bound. This
  // replaces the old scripted NUTRIENT BLOOM/DROUGHT timers — abundance
  // now genuinely depends on the same nutrient pool colonies/hypoxia use,
  // not an independent random-event economy.
  const nut=isPetri?1:nutAt(wx,wy); // Petri Dish IS the primordial soup — always rich
  const nutFactor=nut/(nut+0.22);
  let rate=FOOD_RATE*ADM.foodRate*nutFactor*(isPetri?2.2:1);
  // Emergency floor — when food is critically scarce, guarantee a minimum trickle
  // regardless of how starved local nutrients are. Prevents synchronized mass
  // starvation where the entire population hits zero food at the same time.
  if(foods.length<14)rate=Math.max(rate,0.55);
  // Shallow zones / islands / grass patches are real spatial productivity
  // zones (photic-zone upwelling, organic litterfall) — kept as bonuses
  for(const sz of shallowZones){const dx=wx-sz.x,dy=wy-sz.y;if(dx*dx+dy*dy<sz.r*sz.r){rate*=1.6;break;}}
  if(nearIsland(wx,wy,220))rate*=1.35; // gentle bonus not a magnet
  // Dense grass generates organic matter — extra food for grazers
  for(const gp of grassPatches){
    const dx=wx-gp.x,dy=wy-gp.y;
    if(dx*dx+dy*dy<gp.r*gp.r&&gp.density>.35){rate*=1+gp.density*1.2;break;}
  }
  if(Math.random()<rate){
    foods.push(new Food(wx,wy));
    if(!isPetri)depleteNut(wx,wy,0.01); // uptake — nutrient becomes biomass
  }
  // Seed food near grass patches directly every 16 ticks
  if(tick%16===0&&foods.length<MAX_FOOD){
    for(const gp of grassPatches){
      if(gp.density>.5&&Math.random()<gp.density*.2){
        const a=Math.random()*Math.PI*2,r=Math.random()*gp.r*.8;
        const fx=gp.x+Math.cos(a)*r,fy=gp.y+Math.sin(a)*r;
        foods.push(new Food(fx,fy));
        if(!isPetri)depleteNut(fx,fy,0.008);
        if(foods.length>=MAX_FOOD)break;
      }
    }
  }
}

function step(){
  tick++;spawnFood();
  for(const v of vents)v.update();
  for(const gp of grassPatches)gp.update();
  // Colony updates
  newColonies=[];
  for(const col of colonies){col.update();if(!col.alive)col.die();}
  colonies=[...colonies.filter(c=>c.alive),...newColonies];
  colonyFeedingStep();
  diffuseNutGrid();
  updateHypoxicZones();
  checkTerraformUnlocks();
  spawnSpecialists();

  updateFlow();updateNichePressure();

  FG.clear();OG.clear();
  if(tick%4===0)for(const f of foods)if(f.alive)f.drift();
  for(const f of foods)if(f.alive)FG.put(f);
  for(const o of orgs)if(o.alive)OG.put(o);

  // Precompute commune bonus for all organisms
  if(tick%5===0){
    for(const o of orgs){
      o.communeBonus=0;
      if(o.dna.anchor>.52&&o.dna.armor>.48){ // genuine sessile commitment required
        let n=0;for(const other of OG.near(o.x,o.y,130)){if(other.id!==o.id&&other.alive&&other.dna.anchor>.52&&other.dna.armor>.48)n++;}
        o.communeBonus=Math.min(.42,n*.11);
      }
    }
  }

  const newOrgs=[];
  for(const o of orgs){
    if(!o.alive)continue;
    o.update();
    if(orgs.length+newOrgs.length<curMaxOrg()&&o.mateCooldown<=0){
      // DIVISION — food-based satiation model
      // Eat enough, maintain energy, cell splits. No energy threshold needed.
      const foodPerCapita=foods.length/Math.max(1,orgs.length+newOrgs.length);
      // Scarcity brake — as food-per-organism drops, divide threshold rises.
      // This slows reproduction BEFORE famine hits rather than after —
      // a population approaching carrying capacity eases off instead of overshooting.
      const scarcityMult=1+Math.max(0,1-foodPerCapita/0.7)*1.4;
      const divThreshold=(7+o.sz*1.2)*scarcityMult; // bigger cells need significantly more meals
      if(o.fullness>=divThreshold&&o.energy>o.maxE*.4){
        o.fullness=0;
        const baby=o.divide();
        if(baby)newOrgs.push(baby);
        o.mateCooldown=160; // brief rest before dividing again
      }
      // SEXUAL REPRODUCTION — only available at level 3+ evolution
      // A discovered behaviour, not a suppressed one
      else if(o.evolSteps.size>=3&&o.energy>=o.dna.repro&&o.fullness>=divThreshold*.6){
        const mate=findMate(o);
        if(mate){
          const child=tryMate(o,mate);
          if(child)newOrgs.push(child);
        }
      }
    }
    if(o.gen>highGen)highGen=o.gen;
  }
  orgs.push(...newOrgs);
  // Whale fall + blood on death
  for(const o of orgs){
    if(!o.alive&&!o.deathHandled){
      o.deathHandled=true;
      bloodSignals.push({x:o.x,y:o.y,str:o.sz*2,age:0,maxAge:o.sz>7?400:180});
      enrichNut(o.x,o.y,0.004+(o.sz||2)*0.001,40); // death enriches local water
      // Parasites that killed a large host get a death burst — scavenging the corpse
      if(o.parasiteLoad>2&&o.dna.size>6){
        for(const p of orgs){
          if(!p.alive||p.mode!=='parasite')continue;
          const dx=p.x-o.x,dy=p.y-o.y;
          if(dx*dx+dy*dy<(o.dna.size*8)*(o.dna.size*8)){
            p.energy+=o.dna.size*3; // rich death feast
            p.flash=12;
          }
        }
        showTicker(`⟡ Host collapse — ${o.parasiteLoad} parasites scatter hungry`);
      }
      if(o.sz>9){
        // Only create a new whale fall if one isn't already active nearby
        const tooClose=nutrientZones.some(nz=>{const dx=nz.x-o.x,dy=nz.y-o.y;return dx*dx+dy*dy<400*400;});
        if(!tooClose){
          const sz=o.sz,dur=sz*80; // shorter duration to prevent permanent hotspots
          nutrientZones.push(new NutrientZone(o.x,o.y,sz,dur));
          enrichNut(o.x,o.y,0.18,sz*20); // whale fall enriches water column
          showTicker(`⟡ Whale fall — body size ${sz.toFixed(1)} decomposing`);
          biomeMilestones.whaleFall=true;
        }
      }
    }
  }
  foods=foods.filter(f=>f.alive);orgs=orgs.filter(o=>o.alive);

  if(orgs.length===0){
    extinctions++;const _he=document.getElementById('h-ext');if(_he)_he.textContent=extinctions;
    showTicker('EXTINCTION — life rebuilds');
    // Was Math.random()*WW/WH — the FULL 7680x4320 world, not the current
    // biome. In Petri (1440x900) that's only ~4% of the area new life could
    // land in, so ~96% of respawns scattered into the fogged, not-yet-
    // unlocked part of the map — invisible and effectively wasted. Spawn
    // within the active biome instead, clustered toward its center.
    const cx=activeW*.5,cy=activeH*.5,spread=Math.min(activeW,activeH)*.35;
    for(let i=0;i<INIT_POP;i++){
      const a=Math.random()*Math.PI*2,r=Math.random()*spread;
      const x=clamp(cx+Math.cos(a)*r,10,activeW-10);
      const y=clamp(cy+Math.sin(a)*r,10,activeH-10);
      orgs.push(new Org(x,y,randDNA(),55,1));
    }
  }
  updateParticles();updateMatingLines();
  // Update bait balls (before organism update so positions are set)
  for(let i=baitBalls.length-1;i>=0;i--){baitBalls[i].update();if(!baitBalls[i].alive)baitBalls.splice(i,1);}
  checkBaitBalls();
  // Nutrient zones
  for(let i=nutrientZones.length-1;i>=0;i--){nutrientZones[i].update();if(!nutrientZones[i].alive)nutrientZones.splice(i,1);}
  // Blood signals
  updateBloodSignals();
  detectReefs();
  if(tick%120===0){checkBiomeMilestones();if(orgs.filter(o=>o.alive).length>=30)biomeMilestones.pop30ticks+=120;else biomeMilestones.pop30ticks=0;}
  updateBiomeExpansion();
  if(--evCountdown<=0)fireEvent();
  if(tick-lastSample>60){popHistory.push(orgs.length);if(popHistory.length>CHART_LEN)popHistory.shift();lastSample=tick;}
}

// ── Terrain geometry cache — built once per terrain piece ──
const terrainCache=new Map();
function getTerrainPoly(t){
  if(terrainCache.has(t))return terrainCache.get(t);
  // Seeded random so same rock looks same every frame
  const seed=t.x*73856093^t.y*19349663^(t.r*1000)|0;
  const lcg=(s)=>{s=(s^61)^(s>>16);s+=s<<3;s^=s>>4;s*=0x27d4eb2d;s^=s>>15;return(s>>>0)/4294967296;};
  let rng=Math.abs(seed)%999983+1;
  const next=()=>{rng=lcg(rng)*999983+1;return lcg(rng);};
  const nSides=7+Math.floor(next()*5); // 7-11 sides
  const pts=[];
  for(let i=0;i<nSides;i++){
    const baseAngle=(i/nSides)*Math.PI*2;
    const angleJitter=(next()-.5)*.6*(Math.PI*2/nSides);
    const a=baseAngle+angleJitter;
    const rMult=.72+next()*.32; // 72%-104% of radius
    pts.push({x:Math.cos(a)*t.r*rMult, y:Math.sin(a)*t.r*rMult});
  }
  terrainCache.set(t,pts);
  return pts;
}
function getIslandPoly(isl){
  const key='isl_'+isl.x+'_'+isl.y;
  if(terrainCache.has(key))return terrainCache.get(key);
  const seed=isl.x*31337^isl.y*7919^(isl.r*100)|0;
  let rng=Math.abs(seed)%999983+1;
  const next=()=>{rng=(rng*1664525+1013904223)>>>0;return rng/4294967296;};
  const nSides=9+Math.floor(next()*6); // 9-14 sides — more organic coastline
  const pts=[];
  for(let i=0;i<nSides;i++){
    const a=(i/nSides)*Math.PI*2;
    const jitter=(next()-.5)*.5*(Math.PI*2/nSides);
    const rm=.68+next()*.36;
    pts.push({x:Math.cos(a+jitter)*isl.r*rm, y:Math.sin(a+jitter)*isl.r*rm});
  }
  terrainCache.set(key,pts);
  return pts;
}

function drawTerrainPoly(pts,cx,cy){
  ctx.beginPath();
  ctx.moveTo(cx+pts[0].x,cy+pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(cx+pts[i].x,cy+pts[i].y);
  ctx.closePath();
}

function drawTerrain(){
  for(const t of terrain){
    if(!inView(t.x,t.y,t.r+60))continue;
    const pts=getTerrainPoly(t);

    // Water shadow — soft dark pool on downstream side
    ctx.save();
    ctx.translate(t.x+t.r*.35,t.y+t.r*.25);
    ctx.scale(1.35,0.9);
    const shadow=ctx.createRadialGradient(0,0,t.r*.3,0,0,t.r*1.1);
    shadow.addColorStop(0,'rgba(0,0,0,0.22)');
    shadow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(0,0,t.r*1.1,0,Math.PI*2);
    ctx.fillStyle=shadow;ctx.fill();
    ctx.restore();

    // Rock body
    drawTerrainPoly(pts,t.x,t.y);
    // Deep fill
    ctx.fillStyle='#020810';ctx.fill();
    // Mid tone
    ctx.strokeStyle='rgba(18,42,68,0.7)';ctx.lineWidth=3/cam.zoom;ctx.stroke();

    // Inner facets — suggest depth and cracking
    ctx.save();ctx.translate(t.x,t.y);
    drawTerrainPoly(pts.map(p=>({x:p.x*.78,y:p.y*.78})),0,0);
    ctx.strokeStyle='rgba(22,50,78,0.25)';ctx.lineWidth=1.5/cam.zoom;ctx.stroke();
    drawTerrainPoly(pts.map(p=>({x:p.x*.52,y:p.y*.52})),0,0);
    ctx.strokeStyle='rgba(28,58,88,0.15)';ctx.lineWidth=1/cam.zoom;ctx.stroke();
    ctx.restore();

    // Upper-left highlight — light from above
    ctx.save();ctx.translate(t.x,t.y);
    drawTerrainPoly(pts,0,0);
    ctx.clip();
    const hl=ctx.createRadialGradient(-t.r*.4,-t.r*.4,0,-t.r*.4,-t.r*.4,t.r*1.1);
    hl.addColorStop(0,'rgba(40,80,120,0.22)');
    hl.addColorStop(.5,'rgba(20,50,80,0.06)');
    hl.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=hl;ctx.fill();
    ctx.restore();
  }

  // Islands — irregular coastlines with beach gradient and vegetation
  for(const isl of islands){
    if(!inView(isl.x,isl.y,isl.r+220))continue;
    const pts=getIslandPoly(isl);

    // Shallow water halo — warm teal ring
    const halo=ctx.createRadialGradient(isl.x,isl.y,isl.r*.9,isl.x,isl.y,isl.r+200);
    halo.addColorStop(0,'rgba(18,65,55,0.0)');
    halo.addColorStop(.25,'rgba(15,58,48,0.18)');
    halo.addColorStop(.7,'rgba(8,35,28,0.08)');
    halo.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(isl.x,isl.y,isl.r+200,0,Math.PI*2);
    ctx.fillStyle=halo;ctx.fill();

    // Beach ring — sandy warm tone just outside rock
    const beach=ctx.createRadialGradient(isl.x,isl.y,isl.r*.85,isl.x,isl.y,isl.r*1.15);
    beach.addColorStop(0,'rgba(42,32,18,0)');
    beach.addColorStop(.5,'rgba(42,32,18,0.35)');
    beach.addColorStop(1,'rgba(42,32,18,0)');
    ctx.beginPath();ctx.arc(isl.x,isl.y,isl.r*1.2,0,Math.PI*2);
    ctx.fillStyle=beach;ctx.fill();

    // Island body — dark rock
    drawTerrainPoly(pts,isl.x,isl.y);
    ctx.fillStyle='#111c11';ctx.fill();
    ctx.strokeStyle='rgba(35,60,30,0.7)';ctx.lineWidth=2.5/cam.zoom;ctx.stroke();

    // Vegetation interior (larger islands)
    if(isl.r>45){
      ctx.save();ctx.translate(isl.x,isl.y);
      drawTerrainPoly(pts.map(p=>({x:p.x*.6,y:p.y*.6})),0,0);
      ctx.fillStyle='rgba(22,48,18,0.85)';ctx.fill();
      // Highlight canopy
      drawTerrainPoly(pts.map(p=>({x:p.x*.35,y:p.y*.35})),0,0);
      ctx.fillStyle='rgba(28,58,22,0.6)';ctx.fill();
      ctx.restore();
    }

    // Upper-left light on island
    ctx.save();ctx.translate(isl.x,isl.y);
    drawTerrainPoly(pts,0,0);ctx.clip();
    const ihl=ctx.createRadialGradient(-isl.r*.3,-isl.r*.35,0,-isl.r*.3,-isl.r*.35,isl.r);
    ihl.addColorStop(0,'rgba(50,90,40,0.2)');
    ihl.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ihl;ctx.fill();
    ctx.restore();
  }

  // Trench edge — ragged cliff line where seafloor drops away
  const trenchY=activeH*.58;
  if(inView(activeW/2,trenchY,activeW)){
    ctx.save();
    // Jagged cliff silhouette
    ctx.beginPath();ctx.moveTo(0,trenchY);
    const steps=Math.ceil(activeW/60);
    for(let i=0;i<=steps;i++){
      const x=i/steps*activeW;
      const jag=Math.sin(x*.012)*8+Math.sin(x*.031)*4+Math.sin(x*.077)*2;
      ctx.lineTo(x,trenchY+jag);
    }
    ctx.lineTo(activeW,activeH);ctx.lineTo(0,activeH);ctx.closePath();
    const cliffGrad=ctx.createLinearGradient(0,trenchY,0,trenchY+80);
    cliffGrad.addColorStop(0,'rgba(8,18,32,0.45)');
    cliffGrad.addColorStop(.4,'rgba(4,10,20,0.2)');
    cliffGrad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=cliffGrad;ctx.fill();
    // Cliff edge line
    ctx.beginPath();ctx.moveTo(0,trenchY);
    for(let i=0;i<=steps;i++){
      const x=i/steps*activeW;
      const jag=Math.sin(x*.012)*8+Math.sin(x*.031)*4+Math.sin(x*.077)*2;
      ctx.lineTo(x,trenchY+jag);
    }
    ctx.strokeStyle='rgba(25,55,90,0.3)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.restore();
  }
}

function drawGrass(){
  const wt=tick*.018;
  for(const gp of grassPatches){
    if(!inView(gp.x,gp.y,gp.r+20)||gp.density<.05)continue;
    const nb=Math.floor(gp.density*gp.blades.length);
    for(let i=0;i<nb;i++){
      const b=gp.blades[i],bx=gp.x+b.ox,by=gp.y+b.oy;
      const sway=Math.sin(wt+b.sw)*3.5;
      const green=70+gp.density*90|0;
      ctx.strokeStyle=`rgba(15,${green},12,${gp.density*.6})`;
      ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(bx,by);
      ctx.bezierCurveTo(bx+sway,by-b.h*.4,bx-sway+2,by-b.h*.7,bx+sway*.4+1,by-b.h);
      ctx.stroke();
    }
  }
}

function drawBiomeFog(){
  if(biomeIdx>=BIOME_STAGES.length-1&&!biomeExpanding)return;
  // Dark fog beyond active zone
  ctx.fillStyle='rgba(2,6,14,0.92)';
  ctx.fillRect(activeW,0,WW-activeW,WH);
  ctx.fillRect(0,activeH,activeW,WH-activeH);
  // Glowing boundary edge — right
  if(activeW<WW){
    const gr=ctx.createLinearGradient(activeW-120,0,activeW+10,0);
    gr.addColorStop(0,'rgba(20,80,140,0)');
    gr.addColorStop(1,'rgba(30,100,180,0.28)');
    ctx.fillStyle=gr;ctx.fillRect(activeW-120,0,130,activeH);
  }
  // Glowing boundary edge — bottom
  if(activeH<WH){
    const gb=ctx.createLinearGradient(0,activeH-120,0,activeH+10);
    gb.addColorStop(0,'rgba(20,80,140,0)');
    gb.addColorStop(1,'rgba(30,100,180,0.28)');
    ctx.fillStyle=gb;ctx.fillRect(0,activeH-120,activeW,130);
  }
  // Biome label top-right of fog boundary
  const bx=w2s(activeW,0);
  if(bx.x>50&&bx.x<W+200){
    ctx.fillStyle='rgba(60,140,200,0.35)';
    ctx.font=`bold ${11/cam.zoom}px Courier New`;
    ctx.fillText('▸ '+BIOME_STAGES[Math.min(biomeIdx+1,BIOME_STAGES.length-1)].name.toUpperCase(),activeW+8,activeH*.5);
  }
}

function drawCurrentTrack(){
  if(!splineSamples.length)return;
  // Glow tube along spline
  ctx.beginPath();
  ctx.moveTo(splineSamples[0].x,splineSamples[0].y);
  for(const p of splineSamples)ctx.lineTo(p.x,p.y);
  ctx.closePath();
  ctx.strokeStyle='rgba(35,120,175,0.05)';ctx.lineWidth=140;ctx.stroke();
  ctx.strokeStyle='rgba(55,145,195,0.13)';ctx.lineWidth=2;ctx.stroke();
  // Flow particles along spline
  for(let i=0;i<NFLOW;i++){
    const idx=Math.floor(flowPhases[i]*splineSamples.length)%splineSamples.length;
    const p=splineSamples[idx];
    if(!inView(p.x,p.y,15))continue;
    ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,Math.PI*2);
    ctx.fillStyle='rgba(75,158,208,0.28)';ctx.fill();
  }
  // Trench points
  for(const tp of trenchPts){
    if(!inView(tp.x,tp.y,40))continue;
    const col=tp.type==='up'?'rgba(80,180,220,0.7)':tp.type==='down'?'rgba(220,120,80,0.7)':'rgba(80,120,180,0.6)';
    ctx.beginPath();ctx.arc(tp.x,tp.y,8,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
  }
  // Waypoint markers — larger, clearly draggable
  for(let i=0;i<surfaceWPs.length;i++){
    const wp=surfaceWPs[i];
    if(!inView(wp.x,wp.y,25))continue;
    const isDragging=draggingWP===i;
    ctx.beginPath();ctx.arc(wp.x,wp.y,isDragging?10:7,0,Math.PI*2);
    ctx.fillStyle=isDragging?'rgba(120,200,240,0.6)':'rgba(55,145,195,0.4)';ctx.fill();
    ctx.strokeStyle='rgba(120,200,240,0.8)';ctx.lineWidth=isDragging?2:1.5;ctx.stroke();
    ctx.fillStyle='rgba(180,230,255,0.9)';ctx.font=`bold ${10/cam.zoom}px Courier`;
    ctx.fillText(i+1,wp.x-3/cam.zoom,wp.y+4/cam.zoom);
  }
  // Current arrows
  const gs=240,lx=cam.x-W/(2*cam.zoom),ty_=cam.y-H/(2*cam.zoom),rx=cam.x+W/(2*cam.zoom),by=cam.y+H/(2*cam.zoom);
  const sx=Math.floor(lx/gs)*gs,sy=Math.floor(ty_/gs)*gs;ctx.lineWidth=1/cam.zoom;
  for(let wx=sx;wx<rx+gs;wx+=gs)for(let wy=sy;wy<by+gs;wy+=gs){
    if(wx<0||wx>WW||wy<0||wy>WH)continue;
    const{vx,vy}=currentAt(wx,wy),mag=Math.sqrt(vx*vx+vy*vy);if(mag<.015)continue;
    const al=Math.min(.18,mag*1.5),len=(mag/.22)*22,nx=vx/mag,ny=vy/mag;
    const hx=wx+nx*len*.5,hy=wy+ny*len*.5;
    ctx.beginPath();ctx.moveTo(wx-nx*len*.5,wy-ny*len*.5);ctx.lineTo(hx,hy);ctx.strokeStyle=`rgba(60,150,195,${al})`;ctx.stroke();
    const as=5/cam.zoom,px=-ny*as*.5,py_=nx*as*.5;
    ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx-nx*as+px,hy-ny*as+py_);ctx.lineTo(hx-nx*as-px,hy-ny*as-py_);ctx.closePath();ctx.fillStyle=`rgba(60,150,195,${al})`;ctx.fill();
  }
}

function drawVent(v){
  if(!inView(v.x,v.y,220))return;
  const pulse=(Math.sin(v.pulse)+1)*.5;
  const gv=ctx.createRadialGradient(v.x,v.y,0,v.x,v.y,v.r*(1.1+pulse*.1));
  gv.addColorStop(0,`rgba(255,105,25,${.11+pulse*.07})`);gv.addColorStop(.5,'rgba(180,50,8,.04)');gv.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.arc(v.x,v.y,v.r*1.25,0,Math.PI*2);ctx.fillStyle=gv;ctx.fill();
  ctx.beginPath();ctx.arc(v.x,v.y,5+pulse*3,0,Math.PI*2);ctx.fillStyle=`rgba(255,145,45,${.7+pulse*.3})`;ctx.fill();
  ctx.beginPath();ctx.arc(v.x,v.y,2.5,0,Math.PI*2);ctx.fillStyle='rgba(255,220,130,0.9)';ctx.fill();
}

function drawDefenderLinks(){
  for(const o of orgs){
    if(o.communeBonus<=0||o.dna.anchor<.52||!inView(o.x,o.y,130))continue;
    for(const other of OG.near(o.x,o.y,125)){
      if(other.id<=o.id||!other.alive||other.communeBonus<=0)continue;
      ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(other.x,other.y);
      ctx.strokeStyle='rgba(80,160,200,0.06)';ctx.lineWidth=1.5;ctx.stroke();
    }
  }
}

function drawMatingLinesW(){
  for(const ml of matingLines){const a=ml.life/ml.max*.4;ctx.beginPath();ctx.moveTo(ml.x1,ml.y1);ctx.lineTo(ml.x2,ml.y2);ctx.strokeStyle=`rgba(200,225,255,${a})`;ctx.lineWidth=1.5;ctx.stroke();}
}

function drawFood(f){if(!inView(f.x,f.y,10))return;ctx.beginPath();ctx.arc(f.x,f.y,6,0,Math.PI*2);ctx.fillStyle='rgba(34,197,94,0.05)';ctx.fill();ctx.beginPath();ctx.arc(f.x,f.y,2.4,0,Math.PI*2);ctx.fillStyle='#22c55e';ctx.fill();}

function drawNutrientZones(){
  for(const nz of nutrientZones){
    if(!inView(nz.x,nz.y,nz.r+30))continue;
    const vitality=nz.remaining/nz.totalTicks;
    const pulse=(Math.sin(nz.pulse)+1)*.5;
    const g=ctx.createRadialGradient(nz.x,nz.y,0,nz.x,nz.y,nz.r*(1+pulse*.1));

function drawHypoxicZones(){
  for(const hz of hypoxicZones){
    if(!inView(hz.x,hz.y,hz.r+30))continue;
    const life=hz.ticksLeft/hz.maxTicks;

function drawBloodSignals(){

function drawBaitBalls(){
