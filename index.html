function drawReefs(){
  for(const reef of activeReefs){
    if(!inView(reef.x,reef.y,reef.r+50))continue;
    ctx.beginPath();ctx.arc(reef.x,reef.y,reef.r,0,Math.PI*2);
    ctx.strokeStyle='rgba(80,160,140,0.2)';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='rgba(40,100,80,0.04)';ctx.fill();
    // Reef label
    ctx.fillStyle='rgba(80,160,140,0.4)';
    ctx.font=`${9/cam.zoom}px Courier New`;
    ctx.fillText(`REEF ${reef.members}`,reef.x-20/cam.zoom,reef.y);
  }
}
function drawParticlesW(){for(const p of particles){if(!inView(p.x,p.y,10))return;ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fillStyle=hsl(p.h,p.s,p.l,p.life/p.max*.45);ctx.fill();}}

function modeRingColor(mode){
  if(mode==='predator') return'rgba(220,50,50,0.85)';   // red
  if(mode==='parasite') return'rgba(180,50,240,0.8)';   // violet
  if(mode==='herbivore')return'rgba(50,210,80,0.8)';    // green
  if(mode==='omnivore') return'rgba(60,140,230,0.8)';   // blue
  if(mode==='ambush')   return'rgba(210,140,30,0.8)';   // amber
  if(mode==='urchin')   return'rgba(210,190,40,0.85)';  // gold-yellow
  if(mode==='crab')     return'rgba(220,90,40,0.85)';   // orange
  if(mode==='fish')     return'rgba(40,200,210,0.85)';  // cyan
  if(mode==='sessile')  return'rgba(100,200,160,0.6)';  // teal
  return null;
}

function drawOrg(o,sel){
  if(!inView(o.x,o.y,o.dna.size*3+5))return;
  const[h,s,l]=o.hsv,r=o.sz,ep=Math.max(0,Math.min(1,o.energy/o.maxE));
  const fl=o.flash>0,ht=o.hurt>0,mt=o.mating>0;
  const hasJet=o.dna.mantle>.12&&o.dna.jet>.07;

  // Mode ring
  const ringCol=modeRingColor(o.mode);
  if(ringCol){ctx.beginPath();ctx.arc(o.x,o.y,r+3,0,Math.PI*2);ctx.strokeStyle=ringCol;ctx.lineWidth=1.8;ctx.stroke();}

  // Teeth spikes
  if(o.evolSteps&&o.evolSteps.has('toothed')&&o.dna.bite>.12){
    const nT=Math.max(3,Math.floor(o.dna.bite*8));
    const sl=r*.5*o.dna.bite+1.5/cam.zoom;
    ctx.strokeStyle=`rgba(200,160,70,${.4+o.dna.bite*.45})`;
    ctx.lineWidth=1.5/cam.zoom;
    for(let i=0;i<nT;i++){
      const a=(i/nT)*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(o.x+Math.cos(a)*r,o.y+Math.sin(a)*r);
      ctx.lineTo(o.x+Math.cos(a)*(r+sl),o.y+Math.sin(a)*(r+sl));
      ctx.stroke();
    }
  }
  // Contact feeder amber glow
  if(o.evolSteps&&o.evolSteps.has('contact_feeder')&&!o.evolSteps.has('toothed')){
    ctx.beginPath();ctx.arc(o.x,o.y,r+3/cam.zoom,0,Math.PI*2);
    ctx.strokeStyle='rgba(200,140,60,0.2)';ctx.lineWidth=2/cam.zoom;ctx.stroke();
  }
  // Jet charge ring
  if(hasJet&&o.mFill>0){const mp=o.mFill/70;ctx.beginPath();ctx.arc(o.x,o.y,r+5+mp*3,0,Math.PI*2);ctx.strokeStyle=hsl(h,s,l,mp*.25);ctx.lineWidth=1.5;ctx.stroke();}

  // Armor ring
  if(o.dna.armor>.35){ctx.beginPath();ctx.arc(o.x,o.y,r+1.5,0,Math.PI*2);ctx.strokeStyle=`rgba(160,200,220,${o.dna.armor*.18})`;ctx.lineWidth=o.dna.armor*2.8;ctx.stroke();}

  // Mating pulse
  if(mt){ctx.beginPath();ctx.arc(o.x,o.y,r+5+o.mating*.3,0,Math.PI*2);ctx.strokeStyle=`rgba(200,220,255,${o.mating/14*.28})`;ctx.lineWidth=2;ctx.stroke();}

  ctx.beginPath();ctx.arc(o.x,o.y,r*2.1,0,Math.PI*2);ctx.fillStyle=ht?'rgba(200,40,40,0.04)':hsl(h,s,l,.05);ctx.fill();
  ctx.beginPath();ctx.arc(o.x,o.y,r*1.38,0,Math.PI*2);ctx.fillStyle=ht?'rgba(200,40,40,0.17)':hsl(h,s,l,.14);ctx.fill();

  ctx.beginPath();ctx.arc(o.x,o.y,r,0,Math.PI*2);
  ctx.globalAlpha=.58+ep*.42;
  ctx.fillStyle=ht?`hsl(${h},35%,${l-8}%)`:(fl?hsl(h,s,l+10):hsl(h,s,l));
  ctx.fill();
  // Parasite load grey tint — organism visibly sickens under heavy load
  if(o.parasiteLoad>1&&o.dna.size>4){
    const lf=Math.min(1,o.parasiteLoad/Math.max(1,Math.floor(o.dna.size/2)));
    ctx.fillStyle=`rgba(110,110,110,${lf*.42})`;ctx.fill();
  }ctx.globalAlpha=1;

  if(ep>.06){ctx.beginPath();ctx.arc(o.x,o.y,r+2,-Math.PI/2,-Math.PI/2+Math.PI*2*ep);ctx.strokeStyle=`hsla(${ep*120|0},70%,65%,.44)`;ctx.lineWidth=1.5;ctx.stroke();}
  ctx.beginPath();ctx.arc(o.x-r*.28,o.y-r*.28,r*.19,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.17)';ctx.fill();

  if(sel){ctx.beginPath();ctx.arc(o.x,o.y,r+6,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,0.38)';ctx.lineWidth=1;ctx.stroke();ctx.beginPath();ctx.arc(o.x,o.y,o.dna.sense,0,Math.PI*2);ctx.strokeStyle='rgba(80,175,255,0.08)';ctx.setLineDash([5,5]);ctx.stroke();ctx.setLineDash([]);}
}

// Terraform ghost preview
function drawTerraformGhost(){
  if(!terraformMode)return;
  const w=mouseWorld;
  // r scales with terraformRadius; waypoint and remove show fixed small marker
  const r=terraformTool==='waypoint'?12/cam.zoom:terraformTool==='remove'?40/cam.zoom:terraformRadius;
  const col=terraformTool==='rock'?'rgba(100,140,200,0.25)':terraformTool==='vent'?'rgba(255,140,40,0.3)':terraformTool==='shallow'?'rgba(40,180,140,0.2)':terraformTool==='island'?'rgba(60,180,80,0.25)':'rgba(255,80,80,0.25)';
  // Size label
  if(terraformTool!=='waypoint'&&terraformTool!=='remove'){
    ctx.save();ctx.font=`${11/cam.zoom}px Courier New`;ctx.fillStyle='rgba(180,220,255,0.7)';
    ctx.fillText(`r=${Math.round(terraformRadius)}`,w.x+r+5/cam.zoom,w.y);ctx.restore();
  }
  ctx.beginPath();ctx.arc(w.x,w.y,r,0,Math.PI*2);ctx.strokeStyle=col;ctx.lineWidth=2/cam.zoom;ctx.stroke();
  ctx.beginPath();ctx.arc(w.x,w.y,r,0,Math.PI*2);ctx.fillStyle=col.replace(/[\d.]+\)$/,'0.06)');ctx.fill();
}

function render(){
  ctx.clearRect(0,0,W,H);ctx.save();
  ctx.translate(W*.5-cam.x*cam.zoom,H*.5-cam.y*cam.zoom);ctx.scale(cam.zoom,cam.zoom);
  drawBg();drawNutGrid();drawTerrain();drawCurrentTrack();
  for(const v of vents)drawVent(v);
  drawGrass();
  drawNutrientZones();
  drawHypoxicZones();
  drawColonies();
  drawBloodSignals();
  drawDefenderLinks();drawMatingLinesW();
  for(const f of foods)drawFood(f);
  drawParticlesW();
  drawBaitBalls();
  drawReefs();
  for(const o of orgs)drawOrg(o,o.id===selectedId);
  drawBiomeFog();
  drawTerraformGhost();
  ctx.restore();
}

let chX=null,_chEl=null;
function getChX(){if(!_chEl||!_chEl.isConnected){_chEl=document.getElementById('chart');if(_chEl)chX=_chEl.getContext('2d');}return chX;}
function drawChart(){
  if(!getChX())return;
  const cw=_chEl.width||236,ch=_chEl.height||54;chX.clearRect(0,0,cw,ch);if(popHistory.length<2)return;
  const max=Math.max(1,...popHistory),step=cw/(CHART_LEN-1);
  chX.beginPath();chX.strokeStyle='#196485';chX.lineWidth=1.5;
  for(let i=0;i<popHistory.length;i++){const x=(i+(CHART_LEN-popHistory.length))*step,y=ch-(popHistory[i]/max)*(ch-4);i===0?chX.moveTo(x,y):chX.lineTo(x,y);}
  chX.stroke();chX.lineTo((CHART_LEN-1)*step,ch);chX.lineTo((CHART_LEN-popHistory.length)*step,ch);chX.closePath();chX.fillStyle='rgba(25,100,133,0.07)';chX.fill();
  chX.fillStyle='#3a6e90';chX.font='9px Courier New';chX.fillText('peak '+max,3,11);chX.fillText('now '+orgs.length,3,ch-3);
}
let mmC=null,mmX=null;
function getMMCtx(){if(!mmC||!mmC.isConnected){mmC=document.getElementById('minimap');if(mmC)mmX=mmC.getContext('2d');}return mmC;}
const MMW=236,MMH=151,MSX=MMW/WW,MSY=MMH/WH;
function drawMinimap(){
  if(!getMMCtx())return;
  const bg=mmX.createLinearGradient(0,0,0,MMH);bg.addColorStop(0,'#0b2833');bg.addColorStop(.28,'#060f1e');bg.addColorStop(.64,'#040c17');bg.addColorStop(1,'#020407');
  mmX.fillStyle=bg;mmX.fillRect(0,0,MMW,MMH);
  // Draw spline path on minimap
  if(splineSamples.length>1){
    mmX.beginPath();mmX.moveTo(splineSamples[0].x*MSX,splineSamples[0].y*MSY);
    for(const p of splineSamples)mmX.lineTo(p.x*MSX,p.y*MSY);
    mmX.closePath();mmX.strokeStyle='rgba(55,140,190,0.22)';mmX.lineWidth=1.5;mmX.stroke();
  }
  for(const t of terrain){mmX.beginPath();mmX.arc(t.x*MSX,t.y*MSY,t.r*MSX,0,Math.PI*2);mmX.fillStyle='rgba(3,10,18,0.7)';mmX.fill();}
  for(const v of vents){mmX.beginPath();mmX.arc(v.x*MSX,v.y*MSY,2.5,0,Math.PI*2);mmX.fillStyle='rgba(255,115,35,0.85)';mmX.fill();}
  for(const gp of grassPatches){if(gp.density<.15)continue;mmX.beginPath();mmX.arc(gp.x*MSX,gp.y*MSY,2,0,Math.PI*2);mmX.fillStyle=`rgba(20,${80+gp.density*100|0},15,${gp.density*.7})`;mmX.fill();}
  for(const o of orgs){const[h,s2,l]=o.hsv;mmX.beginPath();mmX.arc(o.x*MSX,o.y*MSY,1.4,0,Math.PI*2);mmX.fillStyle=`hsl(${h},${s2}%,${l}%)`;mmX.fill();}
  const vx=Math.max(0,(cam.x-W/(2*cam.zoom))*MSX),vy=Math.max(0,(cam.y-H/(2*cam.zoom))*MSY);
  const vw=Math.min(MMW,(W/cam.zoom)*MSX),vh=Math.min(MMH,(H/cam.zoom)*MSY);
  mmX.strokeStyle='rgba(0,0,0,0.7)';mmX.lineWidth=3;mmX.strokeRect(vx,vy,vw,vh);
  mmX.strokeStyle='rgba(255,255,255,0.92)';mmX.lineWidth=1.5;mmX.strokeRect(vx,vy,vw,vh);
  const tk=4;mmX.strokeStyle='#22c55e';mmX.lineWidth=1.5;
  [[vx,vy],[vx+vw,vy],[vx,vy+vh],[vx+vw,vy+vh]].forEach(([cx,cy])=>{
    const sx=cx===vx?1:-1,sy=cy===vy?1:-1;
    mmX.beginPath();mmX.moveTo(cx+sx*tk,cy);mmX.lineTo(cx,cy);mmX.lineTo(cx,cy+sy*tk);mmX.stroke();
  });
  mmX.strokeStyle='#163552';mmX.lineWidth=1;mmX.strokeRect(0,0,MMW,MMH);
}
// click handled in map tab
if(mmC)mmC.addEventListener('click',e=>{const r=mmC.getBoundingClientRect();cam.x=(e.clientX-r.left)/MSX;cam.y=(e.clientY-r.top)/MSY;clampCam();});

// ═══════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════
let isDrag=false,dStart=null,cStart=null,dMoved=false,draggingWP=null;

canvas.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  const w=s2w(e.clientX,e.clientY);
  // In waypoint mode: check if grabbing an existing waypoint to drag
  if(terraformMode&&terraformTool==='waypoint'&&surfaceWPs.length>0){
    const grabR=(22/cam.zoom)*(22/cam.zoom);
    let closest=-1,closestD=grabR;
    for(let i=0;i<surfaceWPs.length;i++){
      const dx=surfaceWPs[i].x-w.x,dy=surfaceWPs[i].y-w.y,d2=dx*dx+dy*dy;
      if(d2<closestD){closestD=d2;closest=i;}
    }
    if(closest>=0){draggingWP=closest;dMoved=false;return;}
  }
  isDrag=true;dMoved=false;
  dStart={x:e.clientX,y:e.clientY};cStart={x:cam.x,y:cam.y};
});
canvas.addEventListener('mousemove',e=>{
  const w=s2w(e.clientX,e.clientY);mouseWorld.x=w.x;mouseWorld.y=w.y;
  // Dragging a waypoint
  if(draggingWP!==null){
    surfaceWPs[draggingWP].x=w.x;surfaceWPs[draggingWP].y=w.y;
    buildSpline(); // live spline preview while dragging
    dMoved=true;return;
  }
  if(!isDrag)return;
  const dx=e.clientX-dStart.x,dy=e.clientY-dStart.y;
  if(Math.abs(dx)+Math.abs(dy)>4)dMoved=true;
  cam.x=cStart.x-dx/cam.zoom;cam.y=cStart.y-dy/cam.zoom;clampCam();
});
canvas.addEventListener('mouseup',e=>{
  // Release dragged waypoint — full current field rebuild
  if(draggingWP!==null){
    buildCurrentField();
    draggingWP=null;return;
  }
  if(!dMoved){
    const w=s2w(e.clientX,e.clientY);
    if(terraformMode){placeTerrain(w.x,w.y);}
    else{
      // Organisms are checked FIRST with a tight hit radius. A colony's
      // bounding radius can be 50+ units once it's branched out, and
      // urchins/crabs specifically like to sit right on top of one —
      // if colonies won the priority check, their large radius would
      // swallow every click near them and an organism sitting there
      // could never be selected directly.
      let best=null,bD=(18/cam.zoom)*(18/cam.zoom);
      for(const o of orgs){const dx=o.x-w.x,dy=o.y-w.y,d2=dx*dx+dy*dy;const selR=Math.max(18/cam.zoom,o.sz);if(d2<selR*selR&&d2<bD){bD=d2;best=o;}}
      if(best){
        selectedColonyId=null;selectedId=best.id;
      } else {
        let bestCol=null,bColD=Infinity;
        for(const col of colonies){
          if(!col.alive)continue;
          const dx=col.x-w.x,dy=col.y-w.y,d2=dx*dx+dy*dy;
          if(d2<(col.radius+8)*(col.radius+8)&&d2<bColD){bColD=d2;bestCol=col;}
        }
        if(bestCol){
          selectedColonyId=bestCol.id;selectedId=null;
          showColonyInspect(bestCol);
        } else {
          selectedColonyId=null;selectedId=null;
          const _iw=document.getElementById('insp-wrap');if(_iw)_iw.style.display='none';
        }
      }
    }
  }
  isDrag=false;
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return; // don't intercept slider input
  if(e.key==='a'||e.key==='A'){
    const b=document.getElementById('admin-body');
    if(b)b.style.display=b.style.display==='none'?'block':'none';
  }
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  // In terraform mode: scroll changes placement size, not camera zoom
  if(terraformMode&&terraformTool!=='waypoint'&&terraformTool!=='remove'){
    const factor=e.deltaY>0?.82:1.22;
    terraformRadius=clamp(terraformRadius*factor,20,600);
    return;
  }
  // Normal camera zoom — focus on cursor position
  const f=e.deltaY>0?.88:1.13,oz=cam.zoom;
  cam.zoom=clamp(cam.zoom*f,cam.minZ,cam.maxZ);
  const wx=(e.clientX-W*.5)/oz+cam.x,wy=(e.clientY-H*.5)/oz+cam.y;
  cam.x=wx-(e.clientX-W*.5)/cam.zoom;cam.y=wy-(e.clientY-H*.5)/cam.zoom;
  clampCam();
  const _h=document.getElementById('hint');if(_h)_h.style.opacity='0';
},{passive:false});


// ═══════════════════════════════════════════════════════════
// TOUCH EVENTS — pan, pinch-zoom, tap-select
// ═══════════════════════════════════════════════════════════
const IS_MOBILE=('ontouchstart' in window)||(navigator.maxTouchPoints>0);

let _tDrag=false,_tStart=null,_tCamStart=null,_tMoved=false;
let _pinchDist0=0,_pinchCam0=null,_pinchMid0=null;
let _longPressTimer=null;

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(e.touches.length===1){
    const t=e.touches[0];
    _tStart={x:t.clientX,y:t.clientY};
    _tCamStart={x:cam.x,y:cam.y};
    _tMoved=false;_tDrag=true;
    // Check waypoint drag in terraform mode
    if(terraformMode&&terraformTool==='waypoint'){
      const w=s2w(t.clientX,t.clientY);
      const grabR=(34/cam.zoom)*(34/cam.zoom);
      let closest=-1,closestD=grabR;
      for(let i=0;i<surfaceWPs.length;i++){
        const dx=surfaceWPs[i].x-w.x,dy=surfaceWPs[i].y-w.y,d2=dx*dx+dy*dy;
        if(d2<closestD){closestD=d2;closest=i;}
      }
      if(closest>=0){draggingWP=closest;_tMoved=false;return;}
    }
  } else if(e.touches.length===2){
    _tDrag=false;
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    _pinchDist0=Math.sqrt(dx*dx+dy*dy);
    _pinchCam0={x:cam.x,y:cam.y,zoom:cam.zoom};
    _pinchMid0={x:(e.touches[0].clientX+e.touches[1].clientX)*.5,
                y:(e.touches[0].clientY+e.touches[1].clientY)*.5};
  }
},{passive:false});

canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&_tDrag){
    const t=e.touches[0];
    // Drag waypoint
    if(draggingWP!==null){
      const w=s2w(t.clientX,t.clientY);
      surfaceWPs[draggingWP].x=w.x;surfaceWPs[draggingWP].y=w.y;
      buildSpline();_tMoved=true;return;
    }
    const dx=t.clientX-_tStart.x,dy=t.clientY-_tStart.y;
    if(Math.abs(dx)+Math.abs(dy)>6)_tMoved=true;
    cam.x=_tCamStart.x-dx/cam.zoom;cam.y=_tCamStart.y-dy/cam.zoom;clampCam();
  } else if(e.touches.length===2&&_pinchCam0){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const factor=dist/_pinchDist0;
    const midX=(e.touches[0].clientX+e.touches[1].clientX)*.5;
    const midY=(e.touches[0].clientY+e.touches[1].clientY)*.5;
    // Terraform mode: pinch changes terraform radius instead of zooming
    if(terraformMode&&terraformTool!=='waypoint'&&terraformTool!=='remove'){
      terraformRadius=clamp(terraformRadius*factor,20,600);
      _pinchDist0=dist;return;
    }
    const oz=_pinchCam0.zoom;
    cam.zoom=clamp(oz*factor,cam.minZ,cam.maxZ);
    const wx=(midX-W*.5)/oz+_pinchCam0.x,wy=(midY-H*.5)/oz+_pinchCam0.y;
    cam.x=wx-(midX-W*.5)/cam.zoom;cam.y=wy-(midY-H*.5)/cam.zoom;
    clampCam();
  }
},{passive:false});

canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  if(draggingWP!==null){buildCurrentField();draggingWP=null;_tDrag=false;return;}
  if(!_tMoved&&_tStart){
    const w=s2w(_tStart.x,_tStart.y);
    if(terraformMode){
      placeTerrain(w.x,w.y);
    } else {
      // Clear any colony selection first — otherwise updateHUD()'s colony
      // branch keeps taking priority and a tapped organism never shows.
      selectedColonyId=null;
      let best=null,bD2=Infinity;
      for(const o of orgs){
        const dx=o.x-w.x,dy=o.y-w.y,d2=dx*dx+dy*dy;
        const selR=Math.max(28/cam.zoom,(o.sz||4));
        if(d2<selR*selR&&d2<bD2){bD2=d2;best=o;}
      }
      selectedId=best?best.id:null;
      const _iw=document.getElementById('insp-wrap');if(_iw)_iw.style.display=best?'block':'none';
      if(best&&IS_MOBILE)openMobileDrawer('pop'); // auto-show stats on organism tap
    }
  }
  if(e.touches.length===0){_tDrag=false;_tMoved=false;_pinchCam0=null;}
},{passive:false});

  mc.fillStyle='#060f1e';mc.fillRect(0,0,mw,mh);
  for(const t of terrain){mc.beginPath();mc.arc(t.x*mx,t.y*my,t.r*mx,0,Math.PI*2);mc.fillStyle='#020810';mc.fill();}

  for(const o of orgs){const[h,s,l]=o.hsv;mc.beginPath();mc.arc(o.x*mx,o.y*my,1.5,0,Math.PI*2);mc.fillStyle=`hsl(${h},${s}%,${l}%)`;mc.fill();}
  const vx=(cam.x-W/(2*cam.zoom))*mx,vy=(cam.y-H/(2*cam.zoom))*my;

  mc.strokeStyle='rgba(255,255,255,.8)';mc.lineWidth=1.5;mc.strokeRect(vx,vy,vw,vh);
}

// ═══════════════════════════════════════════════════════════
// CAPTURE SEQUENCE — grabs several timed snapshots of the main canvas and
// composites them into one downloadable PNG contact sheet. Not a video —
// just a quick way to hand over "here's what's happening right now" as a
// single image, since that's what can actually be reviewed directly.
// ═══════════════════════════════════════════════════════════
let _captureActive=false;
function captureSequence(frames=6,intervalMs=1000){
  if(_captureActive)return;
  _captureActive=true;
  const cols=3,rows=Math.ceil(frames/cols);
  const cellW=320,cellH=Math.max(1,Math.round(cellW*H/W)),pad=6,labelH=40;
  const sheet=document.createElement('canvas');
  sheet.width=cols*cellW+pad*(cols+1);
  sheet.height=rows*(cellH+labelH)+pad*(rows+1);
  const sctx=sheet.getContext('2d');
  sctx.fillStyle='#040c17';sctx.fillRect(0,0,sheet.width,sheet.height);
  const btn=document.getElementById('adm-capture-btn');
  if(btn){btn.disabled=true;btn.textContent=`📸 Capturing 1/${frames}…`;}
  showTicker(`📸 Capturing ${frames} frames over ${(frames*intervalMs/1000).toFixed(0)}s…`);
  let n=0;
  const grab=()=>{
    const col=n%cols,row=(n/cols|0);
    const cx=pad+col*(cellW+pad),cy=pad+row*(cellH+labelH+pad);
    sctx.drawImage(canvas,cx,cy,cellW,cellH);
    sctx.strokeStyle='rgba(60,120,180,0.4)';sctx.lineWidth=1;sctx.strokeRect(cx,cy,cellW,cellH);
    sctx.fillStyle='rgba(168,212,240,0.9)';sctx.font='11px Courier New';
    const s=tick/60|0;
    sctx.fillText(`t=${(s/60|0).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}  pop=${orgs.length}  ${BIOME_STAGES[biomeIdx].name}`,cx,cy+cellH+12);
    const liveOrgs=orgs.filter(o=>o.alive);
    const modeCounts={};

  };

let frame=0,lastHUD=0,rafId=null,bgInt=null;
function loop(){
  if(!paused)for(let i=0;i<speed;i++)step();
  render();
  if(++frame-lastHUD>=HUD_N){updateHUD();drawChart();if(frame%3===0)drawMinimap();lastHUD=frame;}
  if(uiMgr)uiMgr.tick();
  if(typeof _mobileHUDTick!=="undefined")_mobileHUDTick();
  rafId=requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(rafId){cancelAnimationFrame(rafId);rafId=null;}bgInt=setInterval(()=>{if(!paused)step();},200);}
  else{if(bgInt){clearInterval(bgInt);bgInt=null;}loop();}
});

// Preset system — localStorage backed, factory slot is indestructible
const PRESET_KEY='primordial_presets_v1';
function loadPresets(){
  try{return JSON.parse(localStorage.getItem(PRESET_KEY)||'{}');}
  catch{return {};}
}
function savePresets(ps){
  try{localStorage.setItem(PRESET_KEY,JSON.stringify(ps));}
  catch(e){console.warn('Preset save failed:',e);}
}
function applyPreset(vals){
  for(const k of Object.keys(FACTORY)){
    if(vals[k]!==undefined)ADM[k]=vals[k];
  }
  syncAdminSliders();
}
function syncAdminSliders(){
  // Update all slider elements and their value displays to match ADM
  const map={
    'adm-food-rate':   ['foodRate',   v=>v.toFixed(2)],
    'adm-starv-grace': ['starvGrace', v=>v],
    'adm-mut-mult':    ['mutMult',    v=>v.toFixed(1)],
    'adm-pred-gate':   ['predGate',   v=>Math.round(v/1000)+'k'],
    'adm-upkeep':      ['upkeepMult', v=>v.toFixed(1)],
    'adm-sprint':      ['sprintMult', v=>v.toFixed(1)],
    'adm-vent':        ['ventActivity',v=>Math.round(v*100)+'%'],
  };
  for(const[id,[key,fmt]]of Object.entries(map)){
    const sl=document.getElementById(id);

function saveCurrentPreset(){
  const name=prompt('Preset name:','My Settings');
  if(!name||name.trim()==='')return;
  if(name.trim().toLowerCase()==='factory'){alert('Cannot overwrite Factory preset.');return;}
  const ps=loadPresets();
  ps[name.trim()]={...ADM};
  savePresets(ps);
  refreshPresetDropdown();
  const dd=document.getElementById('preset-dd');
  if(dd)dd.value=name.trim();
}
function deleteCurrentPreset(){
  const dd=document.getElementById('preset-dd');
  if(!dd)return;
  const name=dd.value;
  if(name==='factory'){alert('Factory preset cannot be deleted.');return;}
  if(!confirm('Delete preset "'+name+'"?'))return;
  const ps=loadPresets();
  delete ps[name];
  savePresets(ps);
  refreshPresetDropdown();
}
function refreshPresetDropdown(){
  const dd=document.getElementById('preset-dd');
  if(!dd)return;
  const ps=loadPresets();
  const cur=dd.value;
  dd.innerHTML='<option value="factory">⚙ Factory Defaults</option>';
  for(const name of Object.keys(ps)){
    const opt=document.createElement('option');
    opt.value=name;opt.textContent='◈ '+name;
    dd.appendChild(opt);
  }
  if(cur&&dd.querySelector('option[value="'+cur+'"]'))dd.value=cur;
}

// UI PANEL SYSTEM — v7
// ═══════════════════════════════════════════════════════
let _pid=0;
const SNAP_D=20;

class UIPanel{
  constructor(cfg){
    this.id='p'+(++_pid);
    this.x=cfg.x??100; this.y=cfg.y??100;
    this.w=cfg.w??280; this.h=cfg.h??360;
    this.tabs=[]; this.activeIdx=0;
    this._build();
  }
  _build(){
    const el=document.createElement('div');
    el.className='ui-panel'; el.id=this.id;
    el.style.cssText=`left:${this.x}px;top:${this.y}px;width:${this.w}px;height:${this.h}px`;
    this.tabbar=document.createElement('div'); this.tabbar.className='ui-tabbar';
    this.cwrap=document.createElement('div'); this.cwrap.className='ui-cwrap';
    for(const e of ['n','s','e','w','ne','nw','se','sw']){
      const h=document.createElement('div');
      h.className=`ui-rz ui-rz-${e}`; h.dataset.edge=e;
      el.appendChild(h);
    }
    el.append(this.tabbar,this.cwrap);
    document.getElementById('ui-root').appendChild(el);
    this.el=el;
    this._bindEvents();
  }
  addTab(tabDef){
    const cEl=document.createElement('div');
    cEl.className='ui-content'+(tabDef.nopad?' canvas-tab':'');
    cEl.style.display='none';
    if(tabDef.build) tabDef.build(cEl,this.w,this.h-26);
    this.cwrap.appendChild(cEl);
    tabDef._el=cEl;
    this.tabs.push(tabDef);
    this._rebuildTabbar();
    if(this.tabs.length===1) this.setActive(0);
    return this;
  }
  _rebuildTabbar(){
    this.tabbar.innerHTML='';
    this.tabs.forEach((t,i)=>{
      const d=document.createElement('div');
      d.className='ui-tab'+(i===this.activeIdx?' active':'');
      d.textContent=t.label; d.dataset.i=i;
      this.tabbar.appendChild(d);
    });
  }
  setActive(i){
    this.activeIdx=i;
    this.tabs.forEach((t,j)=>{t._el.style.display=j===i?'flex':'none';});
    this._rebuildTabbar();
    const t=this.tabs[i];
    if(t&&t.onActivate) t.onActivate(t._el,this.w,this.h-26);
  }
  move(x,y){
    this.x=Math.max(0,Math.min(x,window.innerWidth-this.w));
    this.y=Math.max(0,Math.min(y,window.innerHeight-this.h));
    this.el.style.left=this.x+'px'; this.el.style.top=this.y+'px';
  }
  resize(w,h){
    this.w=Math.max(150,w); this.h=Math.max(90,h);
    this.el.style.width=this.w+'px'; this.el.style.height=this.h+'px';
    const t=this.tabs[this.activeIdx];
    if(t&&t.onResize) t.onResize(t._el,this.w,this.h-26);
  }
  tick(){
    const t=this.tabs[this.activeIdx];
    if(t&&t.update) t.update(t._el,this.w,this.h-26);
  }
  _bindEvents(){
    this.tabbar.addEventListener('mousedown',e=>{
      const tab=e.target.closest('.ui-tab');
      if(tab){uiMgr.onTabDown(this,+tab.dataset.i,e);return;}
      uiMgr.onPanelDown(this,e);
    });
    this.el.querySelectorAll('.ui-rz').forEach(h=>{
      h.addEventListener('mousedown',e=>{e.stopPropagation();uiMgr.onResizeDown(this,h.dataset.edge,e);});
    });
    this.el.addEventListener('mousedown',()=>uiMgr.toFront(this),true);
  }
}

class UIManager{
  constructor(){
    this.panels=[];
    this.drag=null; this.rz=null; this.z=100;
    this.overlay=document.getElementById('snap-overlay');
    this.ghost=document.getElementById('tab-ghost');
    document.addEventListener('mousemove',e=>this._move(e));
    document.addEventListener('mouseup',e=>this._up(e));
    document.addEventListener('keydown',e=>{
      if(e.target.tagName==='INPUT') return;
      if(e.key==='a'||e.key==='A'){
        const adm=this.panels.find(p=>p.tabs.some(t=>t.label==='Admin'));
        if(adm) adm.el.style.display=adm.el.style.display==='none'?'':'none';
      }
    });
  }
  add(cfg){const p=new UIPanel(cfg);this.panels.push(p);this.toFront(p);return p;}
  toFront(p){p.el.style.zIndex=++this.z;}
  onTabDown(panel,idx,e){
    e.preventDefault(); e.stopPropagation();
    panel.setActive(idx); this.toFront(panel);
    this.drag={panel,idx,mode:'tab-wait',
      ox:e.clientX,oy:e.clientY,offX:e.clientX-panel.x,offY:e.clientY-panel.y};
  }
  onPanelDown(panel,e){
    e.preventDefault(); this.toFront(panel);
    this.drag={panel,mode:'panel',offX:e.clientX-panel.x,offY:e.clientY-panel.y};
  }
  onResizeDown(panel,edge,e){
    e.preventDefault(); this.toFront(panel);
    this.rz={panel,edge,sx:e.clientX,sy:e.clientY,sw:panel.w,sh:panel.h,px:panel.x,py:panel.y};
  }
  _move(e){
    if(this.rz){this._doResize(e);return;}
    if(!this.drag) return;
    const d=this.drag;
    if(d.mode==='tab-wait'){
      if(Math.hypot(e.clientX-d.ox,e.clientY-d.oy)>8) d.mode='tab-drag';
      else return;
    }
    if(d.mode==='tab-drag'){
      this.ghost.style.cssText=`display:block;left:${e.clientX-24}px;top:${e.clientY-14}px`;
      this.ghost.textContent=d.panel.tabs[d.idx].label;
      this.panels.forEach(p=>{
        const r=p.el.getBoundingClientRect();
        const over=p!==d.panel&&e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
        p.el.style.outline=over?'2px solid rgba(80,180,255,0.65)':'';
      });
      return;
    }
    // Panel drag
    let nx=e.clientX-d.offX,ny=e.clientY-d.offY;
    const {sx,sy,glows}=this._snap(d.panel,nx,ny);
    d.panel.move(sx??nx,sy??ny);
    this._drawSnap(glows);
  }
  _doResize(e){
    const r=this.rz,dx=e.clientX-r.sx,dy=e.clientY-r.sy;
    let w=r.sw,h=r.sh,px=r.px,py=r.py;
    if(r.edge.includes('e'))w=r.sw+dx;
    if(r.edge.includes('s'))h=r.sh+dy;
    if(r.edge.includes('w')){w=r.sw-dx;px=r.px+dx;}
    if(r.edge.includes('n')){h=r.sh-dy;py=r.py+dy;}
    r.panel.resize(Math.max(150,w),Math.max(90,h));
    if(r.edge.includes('w')||r.edge.includes('n')) r.panel.move(px,py);
  }
  _up(e){
    if(this.drag){
      if(this.drag.mode==='tab-drag') this._finishTabDrag(e);
      this.panels.forEach(p=>p.el.style.outline='');
      this.ghost.style.display='none';
      this._drawSnap([]);
      this.drag=null;
    }
    this.rz=null;
  }
  _finishTabDrag(e){
    const d=this.drag,src=d.panel,tab=src.tabs[d.idx];
    const els=document.elementsFromPoint(e.clientX,e.clientY);
    const tEl=els.find(el=>el.classList.contains('ui-panel')&&el.id!==src.id);
    const target=tEl?this.panels.find(p=>p.el===tEl):null;
    if(target){
      this._removeTab(src,d.idx);
      target.addTab(tab); target.setActive(target.tabs.length-1);
    } else if(src.tabs.length>1){
      this._removeTab(src,d.idx);
      this.add({x:e.clientX-140,y:e.clientY-13,w:300,h:340}).addTab(tab);
    }
  }
  _removeTab(panel,idx){
    const tab=panel.tabs.splice(idx,1)[0];
    tab._el.remove();
    if(!panel.tabs.length){panel.el.remove();this.panels=this.panels.filter(p=>p!==panel);}
    else panel.setActive(Math.min(panel.activeIdx,panel.tabs.length-1));
  }
  _snap(panel,nx,ny){
    const W=window.innerWidth,H=window.innerHeight,pw=panel.w,ph=panel.h;
    let sx=null,sy=null; const glows=[];
    if(Math.abs(nx)<SNAP_D){sx=0;glows.push({x:0,y:0,w:4,h:H});}
    else if(Math.abs(nx+pw-W)<SNAP_D){sx=W-pw;glows.push({x:W-4,y:0,w:4,h:H});}
    if(Math.abs(ny)<SNAP_D){sy=0;glows.push({x:0,y:0,w:W,h:4});}
    else if(Math.abs(ny+ph-H)<SNAP_D){sy=H-ph;glows.push({x:0,y:H-4,w:W,h:4});}
    for(const o of this.panels){
      if(o===panel) continue;
      const ox=o.x,oy=o.y,ow=o.w,oh=o.h;
      const vy=ny+ph>oy+10&&ny<oy+oh-10,vx=nx+pw>ox+10&&nx<ox+ow-10;
      if(vy&&Math.abs(nx-(ox+ow))<SNAP_D){sx=ox+ow;glows.push({x:ox+ow-2,y:oy,w:4,h:oh});}
      else if(vy&&Math.abs(nx+pw-ox)<SNAP_D){sx=ox-pw;glows.push({x:ox-2,y:oy,w:4,h:oh});}
      if(vx&&Math.abs(ny-(oy+oh))<SNAP_D){sy=oy+oh;glows.push({x:ox,y:oy+oh-2,w:ow,h:4});}
      else if(vx&&Math.abs(ny+ph-oy)<SNAP_D){sy=oy-ph;glows.push({x:ox,y:oy-2,w:ow,h:4});}
    }
    return{sx,sy,glows};
  }
  _drawSnap(glows){
    this.overlay.innerHTML='';
    glows.forEach(g=>{
      const d=document.createElement('div');
      d.className='snap-glow';
      d.style.cssText=`left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px`;
      this.overlay.appendChild(d);
    });
  }
  tick(){this.panels.forEach(p=>p.tick());}
}

// ── Events ticker tape
let tkPaused=false,tkSpeed=1.2,tkScrollX=0;

function makeEventsTab(){
  const cvs=document.createElement('canvas');
  cvs.id='ticker-cnv';
  cvs.style.cssText='display:block;width:100%;height:100%';
  // Render at native device pixel density — canvas.width/height are the
  // physical backing-store size, logW/logH stay in CSS-pixel space (what
  // the drawing code below actually measures/positions against). Without
  // this, text renders at 1 canvas-px per CSS-px and gets blurrily
  // upscaled by the browser on any HiDPI screen, looking soft/shrunken.
  let ctx2=null,dpr=Math.max(1,window.devicePixelRatio||1),logW=200,logH=60;
  function fit(cw,ch){
    logW=Math.max(60,cw|0);logH=Math.max(40,ch|0);
    cvs.width=Math.round(logW*dpr);cvs.height=Math.round(logH*dpr);
    ctx2=cvs.getContext('2d');
    ctx2.setTransform(dpr,0,0,dpr,0,0);
  }
  return{label:'Events',
    build(el){
      el.style.gap='4px';
      const ctrl=document.createElement('div');
      ctrl.className='ticker-controls';
      ctrl.innerHTML=`<button class="tk-btn" id="tkp-btn">&#9646;&#9646; Pause</button>
        <span style="font-size:9px;color:var(--text);opacity:.6">Speed</span>
        <input type="range" min="0.3" max="5" step="0.2" value="1.2" style="width:70px;accent-color:var(--accent)" id="tk-spd-sl">
        <span style="font-size:9px;color:var(--text-bright)" id="tk-spd-lbl">1.2×</span>`;
      const stage=document.createElement('div');
      stage.className='ticker-stage';
      stage.style.flex='1';
      stage.appendChild(cvs);
      el.append(ctrl,stage);
      ctrl.querySelector('#tkp-btn').onclick=function(){tkPaused=!tkPaused;this.innerHTML=tkPaused?'&#9654; Play':'&#9646;&#9646; Pause';};
      ctrl.querySelector('#tk-spd-sl').oninput=function(){tkSpeed=+this.value;ctrl.querySelector('#tk-spd-lbl').textContent=(+this.value).toFixed(1)+'×';};
    },
    onActivate(el,w,h){fit(cvs.offsetWidth||w,cvs.offsetHeight||(h-34));},
    onResize(el,w,h){fit(w,h-34);},
    update(el){
      if(!ctx2)fit(cvs.offsetWidth||200,cvs.offsetHeight||60);
      if(!ctx2)return;
      const W=logW,H=logH;
      ctx2.fillStyle='rgba(2,5,12,0.85)';ctx2.fillRect(0,0,W,H);
      if(!tickerEvents.length){
        ctx2.fillStyle='rgba(60,100,140,0.45)';ctx2.font='10px Courier New';
        ctx2.fillText('Awaiting evolutionary events...',12,H/2+4);return;
      }
      // Tall panel — a horizontal crawl makes no sense in a vertical box,
      // so switch to a stacked list instead: newest event on top, pushing
      // older ones down, same as a chat log.
      if(H>W){
        ctx2.font='bold 10px Courier New';
        const lineH=16,maxLines=Math.floor(H/lineH),recent=tickerEvents.slice(-maxLines).reverse();
        let y=lineH-2;
        for(const ev of recent){
          let text=ev.text;
          while(text.length>4&&ctx2.measureText(text).width>W-16)text=text.slice(0,-1);
          if(text!==ev.text)text=text.slice(0,-1)+'…';
          ctx2.fillStyle=ev.color;ctx2.fillText(text,8,y);
          y+=lineH;
          if(y>H)break;
        }
        return;
      }
      // Wide panel — the original horizontal crawl
      if(tkPaused)return;
      ctx2.font='bold 10px Courier New';
      let total=0;
      const items=tickerEvents.map(ev=>{const tw=ctx2.measureText(ev.text).width+36;total+=tw;return{...ev,tw};});
      if(total<W){tkScrollX=0;}
      else{tkScrollX=(tkScrollX+tkSpeed)%total;}
      let x=W-tkScrollX;
      const cy=H/2+4;
      for(const it of items){
        if(x>W+10){x+=it.tw;continue;}
        if(x<-it.tw){x+=it.tw;continue;}
        ctx2.fillStyle=it.color;ctx2.fillText(it.text,x,cy);
        ctx2.fillStyle='rgba(60,100,140,0.6)';ctx2.fillText(' · ',x+it.tw-26,cy);
        x+=it.tw;
      }
      // Glow scanline
      const gl=ctx2.createLinearGradient(0,0,0,H);
      gl.addColorStop(0,'rgba(58,138,191,0.04)');gl.addColorStop(.5,'rgba(58,138,191,0)');gl.addColorStop(1,'rgba(58,138,191,0.04)');
      ctx2.fillStyle=gl;ctx2.fillRect(0,0,W,H);
    }
  };
}

// BOOT — single clean showTicker that does both jobs
// ═══════════════════════════════════════════════════════
// Override updateBars to handle all three layout modes
function updateBars(means){
  const keys=['speed','size','sense','effic','repro','mantle','jet','nozzle','armor','anchor','aggr','adhes','bite'];
  const maxV={speed:4.5,size:16,sense:200,effic:2,repro:250,mantle:1,jet:1,nozzle:1,armor:1,anchor:1,aggr:1,adhes:1,bite:1};
  keys.forEach(k=>{
    const v=means[k]||0,pct=Math.min(100,v/maxV[k]*100);
    const fill=document.getElementById('tf-'+k);
    const val=document.getElementById('tv-'+k);
    if(fill){
      if(fill.classList.contains('tr-stick-fill'))fill.style.height=pct+'%';
      else fill.style.width=pct+'%';
    }
    if(val)val.textContent=v.toFixed(2);
  });
}
